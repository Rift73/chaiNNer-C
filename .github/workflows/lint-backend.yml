# This is a basic workflow to help you get started with Actions

name: Backend

# Controls when the workflow will run
on:
    pull_request:
        branches: ['*']
        types:
            - opened
            - synchronize
            - closed
        paths:
            - 'backend/**'
            - 'native/tools/**'
            - 'native/tests/**'
            - 'stubs/**'
            - '.github/workflows/**'
            - '.github/actions/**'
            - 'pyproject.toml'
            - 'pyrightconfig.json'
            - 'requirements.txt'
            - 'native/python-stack.lock.txt'
    push:
        branches: [main, chaiNNer-C]

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
    backend-formatting:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-python@v6
              with:
                  python-version: '3.14'
                  cache: 'pip'
            - run: pip install -r requirements.txt
            - run: ruff format backend --check

    backend-lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-python@v6
              with:
                  python-version: '3.14'
                  cache: 'pip'
            - run: pip install -r requirements.txt
            - run: ruff check backend

    # Hosted CI runs the lint jobs and the backend's pure-Python tests only (Consult 14 D-30 (d)):
    # the native build, native/tests, the verifiers, parity and the bench are local gates
    # (native/README.md). Both Windows jobs use .github/actions/backend-env, the environment
    # pyrightconfig.json names (locally the provisioned runtime), so pyright runs plain with the
    # repo's config. The backend itself never starts here: its native binaries are not built.
    backend-pyright:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/backend-env
            - name: pyright
              run: ./native/runtime/cpython-3.14.8/Scripts/pyright

    backend-tests:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/backend-env
            - name: pytest backend/tests
              run: ./native/runtime/cpython-3.14.8/Scripts/python -m pytest backend/tests
