# Help texts of the VapourSynth nodes Load Clip, Clip Properties, Convert Format, Cut and Splice,
# Planes, Colour and Expression (pop-up texts; see the overlay format in common.toml).

[method."vssource.*.source"]
help = "Opens a video file through vs-jetpack, which also sets the colour information and converts the bit depth (32-bit float unless Bit depth says otherwise). Pick the indexer below; BestSource is the safe default. Use it over \"Open a video (BestSource)\" when you want the clip ready for vs-jetpack filters. Pitfall: 32-bit float is slower and uses four times the memory of 8-bit."

[method."vssource.*.source".docs]
file = "The file to open. Several files are opened one after another as one clip."
bits = "Bit depth of the clip after loading: 8, 10, 16, or 32 (32-bit float). Higher keeps more precision for filtering but is slower and uses more memory. Leave empty to keep the file's own depth.\n\nExample: `16`"
matrix = "Overrides what the clip says its YUV-to-RGB matrix is; the pixels are not changed. Default reads it from the file, else guesses from the size (BT.709 for HD). Set it when colours come out wrong.\n\nExample: BT.601 / SMPTE 170M (6) for a DVD."
transfer = "Overrides the transfer (the brightness curve, e.g. BT.709 or PQ for HDR) the clip is marked with; the pixels are not changed. Default reads the file, else guesses."
primaries = "Overrides the colour primaries (the gamut, e.g. BT.709 or BT.2020) the clip is marked with; the pixels are not changed. Default reads the file, else guesses."
chroma_location = "Overrides where the colour samples sit relative to the brightness samples. Left is usual for most video, Top left for UHD Blu-ray. Only matters for later resizing of colour planes."
color_range = "Overrides whether the clip is marked limited (TV, 16-235 at 8 bit) or full (PC, 0-255) range; the pixels are not changed. Wrong range looks washed out or crushed."
field_based = "Overrides whether the clip is marked progressive or interlaced (TFF: top field first, BFF: bottom field first). Resizers treat interlaced clips field by field."
idx_props = "On: stores the file path and the indexer name in each frame's properties (IdxFilePath, Idx). Harmless; off only to keep the properties short."
ref = "Another clip to match: the loaded clip gets its size, format, colour information, frame rate and length (cut, or padded by repeating the last frame)."
name = "A name stored in each frame's Name property, to tell clips apart later in a script or a comparison."

[method."vssource.*.source".init_docs]
cachemode = "Where BestSource keeps its index. 0 never saves it (re-indexes every run); 1 and 2 use BestSource's own cache folder; 3 (the default here) and 4 use vs-jetpack's cache folder. 2 and 4 always write, 1 and 3 only when it saves time.\n\nExample: `0`"
rff = "1 applies the file's repeat-field flags (soft telecine on DVD or broadcast MPEG-2), giving the frames as a player shows them. 0 keeps the coded frames. Files without such flags are unchanged.\n\nExample: `0`"
showprogress = "1 prints indexing progress to the log while BestSource indexes the file; 0 stays quiet.\n\nExample: `0`"
show_pretty_progress = "A progress bar for indexing, meant for a terminal; it has no use inside chaiNNer, so leave it off."
kwargs = "Extra settings passed to the indexer's own source plugin, by its parameter names.\n\nExample: `{'threads': 4}`"
bin_path = "The D2VWitch program to run. Empty uses `d2vwitch` found on PATH."
ext = "File extension of the index D2VWitch writes. Empty uses `d2v`."
force = "For D2VWitch: on deletes a corrupted index file and indexes again; off stops with an error instead. Does nothing for the other indexers."
default_out_folder = "Folder for the D2VWitch index file. Empty writes it next to the video."

[method."vssource.*.source".choices]
BestSource = "Frame-exact even when seeking; indexes the whole file the first time, which takes a while on long videos. The safe default."
D2VWitch = "For DVD MPEG-2 (.vob, .m2v): runs the external D2VWitch program to make a .d2v index, then opens that. D2VWitch must be installed and on PATH."
FFMS2 = "Indexes faster than BestSource; seeking may be less exact on some files."
LSMAS = "L-SMASH Works. Can still be the better choice for some files such as .m2ts; vs-jetpack marks it as going away later."
ZipSource = "Opens image files (PNG, JPEG ...) with the vszip image reader, not video."

[method."bs.VideoSource"]
help = "Opens a video with the BestSource plugin directly: frame-exact even when seeking. It indexes the whole file the first time (slow on long videos), then reuses the index. The clip keeps the file's format and bit depth, unlike \"Open a video, vs-jetpack indexers\", which also converts it. Image sequences open with `%03d` in the file name."

[method."bs.VideoSource".docs]
track = "Which track to open: 0, 1, 2 ... counts all tracks of the file; a negative number picks the nth video track (-1 the first). Default is the first video track.\n\nExample: `-1`"
variableformat = "For files whose format changes midway: 0 or higher keeps only the nth format met and drops other frames; -1 lets the format change. Most files have one format, so it does nothing.\n\nExample: `0`"
fpsnum = "With Frame rate denominator, turns a variable-frame-rate file into a constant rate by repeating or dropping frames. Cannot be used together with Apply repeat flags.\n\nExample: `24000`"
fpsden = "Denominator of the constant frame rate set with Frame rate numerator; 1 by default.\n\nExample: `1001`"
rff = "1 applies repeat-field flags (soft telecine in DVD or broadcast MPEG-2) so frames come out as a player shows them. Off by default in the plugin. Cannot be combined with Frame rate numerator.\n\nExample: `1`"
threads = "Decoding threads. 0 picks automatically, which is usually best.\n\nExample: `8`"
seekpreroll = "How many frames before a requested one to decode and cache when seeking. Default 20. Raise only if seeking gives wrong frames.\n\nExample: `40`"
enable_drefs = "1 lets the MP4/MOV reader follow data references to other files. Rarely needed.\n\nExample: `1`"
use_absolute_path = "1 makes the MP4/MOV reader use absolute paths for data references. Rarely needed.\n\nExample: `1`"
cachemode = "Index storage: 0 never saves it; 1 saves under Index folder or file when it helps (default); 2 always saves there; 3 and 4 use Index folder or file as the index file's base name (3 when it helps, 4 always).\n\nExample: `0`"
cachepath = "Folder for index files (modes 1 and 2), or the index file's base name (modes 3 and 4). Default: %LOCALAPPDATA%\\bsindex, or next to the video for modes 3 and 4."
cachesize = "Memory for decoded frames, in MB. Default 100; raise it for 4K so seeking back stays fast.\n\nExample: `1000`"
timecodes = "Writes a timecode file (v2) with every frame's time to this path, for variable-frame-rate encodes. Fails if a frame has no timestamp."
start_number = "First number of an image sequence opened with `%d` or `%03d` in the file name. Without it, the sequence may start at 0 to 4.\n\nExample: `1`"
viewid = "Which view of a multi-view (3D) HEVC file to output. 0 by default; only some MV-HEVC files have more.\n\nExample: `1`"
showprogress = "1 prints indexing progress to the log (default); 0 stays quiet.\n\nExample: `0`"
maxdecoders = "How many decoders are kept for jumping around the file; default 4. 1 saves memory on 4K (about 250 MB of RAM each).\n\nExample: `1`"
gpufallback = "With Decode on the GPU on: 1 (default) decodes on the CPU when GPU decoding is not possible; 0 makes that an error. Does nothing without Decode on the GPU.\n\nExample: `0`"
exporttimestamps = "1 also returns every frame's timestamp. Cannot be combined with Apply repeat flags or Frame rate numerator. Rarely needed in a node chain.\n\nExample: `1`"
apply_rotation = "1 (default) turns the picture the way the file says it should be shown (phone videos); 0 keeps it as stored. Only multiples of 90 degrees.\n\nExample: `0`"
gpu = "1 decodes on the graphics card (Vulkan) and keeps frames in video memory. Only filters that take GPU frames can use them; not faster on every machine.\n\nExample: `1`"
source = "The video file to open. An image sequence opens with a number pattern in the name, `%03d` for 001, 002 ...; URLs work too."

[method."ffms2.Source"]
help = "Opens a video with FFMS2 (FFmpegSource). Indexes faster than BestSource; seeking is exact on most files but less safe on some. The index is saved next to the video as .ffindex. Pick BestSource when frame exactness matters most."

[method."ffms2.Source".docs]
track = "The video track to open, counted from 0 as FFMS2 sees them. -1 (default) opens the first video track.\n\nExample: `1`"
cache = "1 (default) saves the index to the cache file and reuses it; 0 indexes every time the clip is opened.\n\nExample: `0`"
cachefile = "Path of the index file. Default: the video's path plus .ffindex. With a custom path, a mismatching index is an error instead of a re-index."
fpsnum = "With Frame rate denominator, forces a constant frame rate, dropping or repeating frames (for variable-frame-rate files). Default keeps the file's frames.\n\nExample: `24000`"
fpsden = "Denominator of the constant frame rate set with Frame rate numerator; 1 by default.\n\nExample: `1001`"
threads = "Decoding threads; 0 or less uses all CPU cores (default). Some decoders ignore it.\n\nExample: `4`"
timecodes = "Writes Matroska v2 timecodes of the video track to this file. Empty writes none."
seekmode = "How seeking is done. 1 (default) safe; 0 decodes from the start every time (slow, for difficult files); 2 like 1 without the guess error; 3 aggressive, for testing.\n\nExample: `0`"
width = "Output width in pixels; default keeps the first frame's width. Mostly for streams that change size midway.\n\nExample: `1920`"
height = "Output height in pixels; default keeps the first frame's height. Mostly for streams that change size midway.\n\nExample: `1080`"
resizer = "Scaling method when Width, Height or Output format need resampling: FAST_BILINEAR, BILINEAR, BICUBIC (default), POINT, AREA, BICUBLIN, GAUSS, SINC, LANCZOS or SPLINE.\n\nExample: `LANCZOS`"
format = "Converts the output to this format while decoding. Default keeps the closest match to the file."
alpha = "1 also outputs the file's alpha (transparency) channel as a second clip. Default 0.\n\nExample: `1`"
source = "The video file to open."

[method."lsmas.LWLibavSource"]
help = "Opens a video with L-SMASH Works through FFmpeg, for any container. Writes an .lwi index next to the video. Can be the better pick for some files such as .m2ts; BestSource is the safer default elsewhere."

[method."lsmas.LWLibavSource".docs]
stream_index = "Which stream to open. -1 (default) picks the video stream with the largest resolution.\n\nExample: `0`"
cache = "1 (default) writes the .lwi index next to the video, so later openings are fast; 0 writes none.\n\nExample: `0`"
cachefile = "Path of the index file. Default: the video's path plus .lwi."
threads = "Decoding threads; 0 (default) picks automatically, up to 16.\n\nExample: `8`"
seek_mode = "What to do on a decoding error. 0 (default) retries from earlier keyframes, then gives the last good frame; 1 retries only on fatal errors; 2 gives the last good frame at once.\n\nExample: `1`"
seek_threshold = "How many frames ahead are reached by decoding forward instead of seeking to a keyframe. Default 10.\n\nExample: `30`"
dr = "1 tries direct rendering from the decoder (faster); the picture may then be padded to a multiple of 16 or 32 and need cropping. Default 0.\n\nExample: `1`"
fpsnum = "With Frame rate denominator, converts variable frame rate to this constant rate by repeating or dropping frames. Needed for AVI captures with dropped frames, to keep audio in sync.\n\nExample: `30000`"
fpsden = "Denominator of the constant frame rate set with Frame rate numerator; 1 by default.\n\nExample: `1001`"
variable = "1 lets format, width and height change midway, as the stream does. Default 0.\n\nExample: `1`"
format = "Forces this output pixel format, e.g. YUV420P10 or RGB24. Empty keeps the file's.\n\nExample: `YUV420P16`"
decoder = "FFmpeg decoders to try first, comma separated.\n\nExample: `h264_qsv,mpeg2_qsv`"
prefer_hw = "Hardware decoding: 0 software (default); 1 NVIDIA CUVID; 2 Intel Quick Sync; 3 tries CUVID, QSV, DXVA2, D3D11, D3D12, Vulkan in turn; 4 DXVA2; 5 D3D11; 6 D3D12; 7 Vulkan.\n\nExample: `1`"
repeat = "Applies repeat-field flags (soft telecine). 2 (default) applies them, silently giving a wrong constant rate when it cannot; 1 fails instead; 0 ignores the flags.\n\nExample: `0`"
dominance = "Field order used with Repeat flags: 0 follows the file (default), 1 top field first, 2 bottom field first.\n\nExample: `1`"
ff_loglevel = "How much FFmpeg prints: 0 nothing (default) up to 8 everything. 3 shows errors.\n\nExample: `3`"
cachedir = "Folder for the .lwi index files instead of next to the video; file names encode the full video path."
ff_options = "FFmpeg decoder options, `key=value` separated by spaces.\n\nExample: `drc_scale=0`"
rap_verification = "1 checks while indexing that every keyframe the file reports can really be decoded; 0 indexes faster. Changing it needs the old .lwi deleted.\n\nExample: `0`"
source = "The video file to open."

[method."lsmas.LibavSMASHSource"]
help = "Opens MP4, MOV and other ISO-media files with L-SMASH Works, which reads their frame table directly, so no index file is written. For other containers use \"Open a video, L-SMASH\"."

[method."lsmas.LibavSMASHSource".docs]
track = "Track number in the file; 0 (default) takes the first video track found.\n\nExample: `2`"
threads = "Decoding threads; 0 (default) picks automatically, up to 16.\n\nExample: `8`"
seek_mode = "What to do on a decoding error. 0 (default) retries from earlier keyframes, then gives the last good frame; 1 retries only on fatal errors; 2 gives the last good frame at once.\n\nExample: `1`"
seek_threshold = "How many frames ahead are reached by decoding forward instead of seeking to a keyframe. Default 10.\n\nExample: `30`"
dr = "1 tries direct rendering from the decoder (faster); the picture may then be padded to a multiple of 16 or 32 and need cropping. Default 0.\n\nExample: `1`"
fpsnum = "With Frame rate denominator, converts variable frame rate to this constant rate by repeating or dropping frames.\n\nExample: `30000`"
fpsden = "Denominator of the constant frame rate set with Frame rate numerator; 1 by default.\n\nExample: `1001`"
variable = "1 lets format, width and height change midway, as the stream does. Default 0.\n\nExample: `1`"
format = "Forces this output pixel format, e.g. YUV420P10 or RGB24. Empty keeps the file's.\n\nExample: `YUV420P16`"
decoder = "FFmpeg decoders to try first, comma separated.\n\nExample: `h264_qsv`"
prefer_hw = "Hardware decoding: 0 software (default); 1 NVIDIA CUVID; 2 Intel Quick Sync; 3 tries CUVID, QSV, DXVA2, D3D11, D3D12, Vulkan in turn; 4 DXVA2; 5 D3D11; 6 D3D12; 7 Vulkan.\n\nExample: `1`"
ff_loglevel = "How much FFmpeg prints: 0 nothing (default) up to 8 everything. 3 shows errors.\n\nExample: `3`"
ff_options = "FFmpeg decoder options, `key=value` separated by spaces.\n\nExample: `drc_scale=0`"
source = "The MP4, MOV or other ISO-media file to open."

[method."d2v.Source"]
help = "Opens a .d2v index made by DGIndex or D2VWitch for a DVD or other MPEG-2 video. Make the .d2v first; \"Open a video, vs-jetpack indexers\" with D2VWitch does both steps. Repeat-field flags are applied by default."

[method."d2v.Source".docs]
input = "Full path of the .d2v file (not the video itself)."
threads = "Decoding threads; 0 (default) picks automatically.\n\nExample: `4`"
nocrop = "1 always uses the decoder's padded picture, a little faster when you crop anyway; the picture may then need cropping. Default 0.\n\nExample: `1`"
rff = "1 (default) applies repeat-field flags (soft telecine) so frames come out as a DVD player shows them; 0 keeps the coded frames, for sources known to be 100% film.\n\nExample: `0`"

[method."vssource.IsoFile.get_vts"]
help = "Opens a whole DVD title set (VTS: a group of titles, usually the main film is title set 1) from an .iso or a DVD folder, applying the repeat-field flags so frames play as on a DVD player. Pitfall: the result may mix film and video parts."

[method."vssource.IsoFile.get_vts".docs]
path = "The DVD: an .iso file or the DVD's root folder (the one with VIDEO_TS)."
title_set_nr = "Which title set to open, counted from 1.\n\nExample: `2`"
apply_rff = "On (default) applies repeat-field flags (soft telecine) as a DVD player does; off keeps the coded frames."

[method."std.SetFrameProps"]

[method."std.SetFrameProps".docs]
_Matrix = "The YUV-to-RGB matrix the frames are marked with. Later conversions to RGB use it; set it when colours look shifted. HD is usually BT.709 (1), DVD BT.601 (6).\n\nExample: BT.709 (1)"
_Transfer = "The brightness curve the frames are marked with: BT.709 (1) for SDR video, PQ (16) or HLG (18) for HDR.\n\nExample: BT.709 (1)"
_Primaries = "The colour gamut the frames are marked with: BT.709 (1) for HD, SMPTE 170M (6) for NTSC DVD, BT.470BG (5) for PAL DVD, BT.2020 (9) for UHD.\n\nExample: BT.709 (1)"
_SARNum = "Width part of the sample (pixel) aspect ratio. Pixels are Width/Height times as wide as tall; anamorphic DVDs are not square.\n\nExample: `32` (with height `27` for 16:9 NTSC DVD)"
_SARDen = "Height part of the sample (pixel) aspect ratio; see the width part. 1 with width 1 means square pixels.\n\nExample: `27`"
kwargs = "More properties to set, by name. A name starting with `_` is one VapourSynth itself reads.\n\nExample: `{'_FieldBased': 0, '_ColorRange': 1}`"

[method."std.AssumeFPS"]

[method."std.AssumeFPS".docs]
src = "Takes the frame rate from this clip instead of the numbers below; set either this or the numbers, not both."
fpsnum = "Frame rate numerator. With denominator 1001, 24000 gives 23.976 fps.\n\nExample: `24000`"
fpsden = "Frame rate denominator; 1 for whole rates such as 25.\n\nExample: `1001`"

[method."vstools.change_fps"]

[method."vstools.change_fps".docs]
fps = "The new frame rate, as a fraction or a whole number. Frames are repeated or dropped to reach it; the length in seconds stays.\n\nExample: `24000/1001`"

[method."vstools.Sar.apply"]
help = "Marks the clip with a sample (pixel) aspect ratio, Aspect ratio width/height; the picture is not changed. Colour info and aspect does the same with colour information too. Example: 32 and 27 for a 16:9 NTSC DVD."

[method."vstools.Sar.apply".init_docs]
numerator = "Width part of the pixel aspect ratio. 1 with height 1 (the start) means square pixels; 0 marks it unknown.\n\nExample: `32`"
denominator = "Height part of the pixel aspect ratio, a whole number. Empty means 1.\n\nExample: `27`"

[method."vstools.initialize_clip"]
help = "Marks the clip with matrix, transfer, primaries, range, chroma location and field order, reading them from the clip or guessing from its size, then converts the bit depth (32-bit float by default). Use it right after a source that left this information unset. Pitfall: a guess can be wrong for SD material; set the values when you know them."

[method."vstools.initialize_clip".docs]
bits = "Bit depth after the conversion: 8, 10, 16 or 32 (float). The default 32 is slow and memory hungry; 16 is usually enough.\n\nExample: `16`"
matrix = "Marks the YUV-to-RGB matrix; Default keeps the clip's, else guesses from the size.\n\nExample: BT.709 (1)"
transfer = "Marks the brightness curve (BT.709 for SDR, PQ or HLG for HDR); Default keeps the clip's, else guesses."
primaries = "Marks the colour gamut; Default keeps the clip's, else guesses."
chroma_location = "Marks where the colour samples sit; Default keeps the clip's, else guesses (Left for most video)."
color_range = "Marks limited (TV, 16-235) or full (PC, 0-255) range; Default keeps the clip's, else limited for YUV."
field_based = "Marks progressive, or interlaced with top (TFF) or bottom (BFF) field first; As the video says keeps the clip's, else guesses."
kwargs = "Extra settings for the bit depth conversion (as in Bit depth in the Convert Format node).\n\nExample: `{'dither_type': 'none'}`"

[method."vstools.finalize_clip"]
help = "Prepares a clip for the encoder: converts to an integer bit depth (10 by default) and clips values outside the legal range. Use it at the end of a chain that works in 32-bit float. Pitfall: fails on a float or over-16-bit result."

[method."vstools.finalize_clip".docs]
clamp_tv_range = "On clips values to the TV (limited) range, 16-235 for luma at 8 bit; off clips only to the format's full range."
bits = "Output bit depth of the finished clip. Starts at 10, the usual for encoding.\n\nExample: `8`"
kwargs = "Extra settings for the bit depth conversion (as in Bit depth in the Convert Format node).\n\nExample: `{'dither_type': 'error_diffusion'}`"

[method."vstools.merge_clip_props"]
help = "Copies the frame properties of several clips into one: the main clip's picture with every other clip's properties added (theirs win on equal names). Example: keep scene-change marks measured on another clip."

[method."vstools.merge_clip_props".docs]
main_idx = "Which clip keeps its picture and receives the properties, counted from 0 in the order the clips are connected.\n\nExample: `1`"

[method."vstools.sc_detect"]
help = "Marks scene changes: compares each frame with its neighbours and sets the properties _SceneChangePrev and _SceneChangeNext to 1 or 0. Filters that respect scene changes read them. The picture is not changed."

[method."vstools.sc_detect".docs]
threshold = "How different two frames must be (0 to 1, average pixel difference) to count as a scene change. Higher finds fewer; 0.1 is the default.\n\nExample: `0.15`"

[method."std.ClipToProp"]
help = "Attaches each frame of a second clip (usually a mask or alpha) to the first clip's frames as a property, so cuts and splices keep both together. \"Get an attached clip\" gets it back. The output length follows the attached clip."

[method."std.ClipToProp".docs]
mclip = "The clip to attach, usually a mask or alpha channel."
prop = "Property name to store it under; default `_Alpha`. Use another name when it is not transparency.\n\nExample: `Mask`"

[method."std.PropToClip"]
help = "Gets back a clip attached to the frames as a property (by \"Attach a clip to the frames\"), such as the alpha channel some sources attach."

[method."std.PropToClip".docs]
prop = "Name of the property holding the clip; default `_Alpha`.\n\nExample: `Mask`"
index = "Which entry to take when the property holds several; 0 by default.\n\nExample: `0`"

[method."std.CopyFrameProps"]
help = "Gives the clip the frame properties of another clip, all of them or only the listed ones; the picture is not changed. Example: restore colour information lost in a filter."

[method."std.CopyFrameProps".docs]
prop_src = "The clip whose properties are copied. If it is shorter, its last frame's properties are used for the rest."
props = "Only these properties are copied (others stay as they are); a name the source lacks is deleted. Empty copies all and replaces everything.\n\nExample: `['_Matrix', '_Transfer']`"

[method."std.RemoveFrameProps"]
help = "Deletes frame properties: the listed ones, or all when the list is empty. The picture is not changed."

[method."std.RemoveFrameProps".docs]
props = "Names to delete; `*` and `?` work as wildcards. `_*` deletes only VapourSynth's own (colour, time, field) properties.\n\nExample: `VFM*`"

[method."std.PlaneStats"]
help = "Measures one plane of each frame and stores minimum, maximum and average (0 to 1) as frame properties (PlaneStatsMin, PlaneStatsMax, PlaneStatsAverage); with a second clip also their difference. Other filters and expressions can read them; the picture is not changed."

[method."std.PlaneStats".docs]
plane = "Which plane to measure: 0 luma (or red), 1 and 2 the colour planes. Default 0.\n\nExample: `1`"
prop = "Start of the property names; default `PlaneStats` gives PlaneStatsAverage and so on.\n\nExample: `Luma`"
clipb = "A clip to compare with; then the average absolute difference is stored as ...Diff (0 to 1)."

[method."std.SetFieldBased"]
help = "Marks the clip as progressive or interlaced; the picture is not changed. Mark a progressive clip that the source called interlaced as progressive, so resizers scale whole frames instead of fields."

[method."std.SetFieldBased".docs]
value = "0 progressive (frame based), 1 bottom field first, 2 top field first.\n\nExample: `0`"

[method."std.SetFrameProp"]
help = "Sets one frame property on every frame, as a whole number, a decimal number or text; an existing one is overwritten. Example: name `_FieldBased`, whole number `2` marks top field first."

[method."std.SetFrameProp".docs]
prop = "Name of the property.\n\nExample: `_FieldBased`"
intval = "Whole number(s) to store; several make a list.\n\nExample: `2`"
floatval = "Decimal number(s) to store; several make a list.\n\nExample: `0.5`"
data = "Text to store.\n\nExample: `film`"

[method."std.Trim"]

[method."std.Trim".docs]
first = "First frame kept, counted from 0. Default 0.\n\nExample: `30`"
last = "Last frame kept (included). Empty keeps up to the end. Set this or Length, not both.\n\nExample: `1000`"
length = "Number of frames kept from First frame. Set this or Last frame, not both.\n\nExample: `240`"

[method."vstools.replace_ranges"]

[method."vstools.replace_ranges".docs]
ranges = "Frames to take from the replacement clip: single frames and ranges, comma separated; a range includes both ends.\n\nExample: `682-687, 713-717, 721`"
exclusive = "Yes makes a range leave out its last frame (10-20 then means 10 to 19). Default includes both ends."
mismatch = "On allows a replacement clip of another size or format; the result then has a variable format."
planes = "Only these planes are taken from the replacement clip; the others stay from the original."
prop_src = "Only used when the frames are chosen by a Python function, which this node cannot take; leave it empty."

[method."std.DeleteFrames"]
help = "Removes the listed frames, so the clip gets shorter. Frame numbers are those of the input clip. Example: `0, 5, 6` removes three frames."

[method."std.DeleteFrames".docs]
frames = "Frame numbers to remove, comma separated, of the input clip. A frame listed twice is an error.\n\nExample: `0, 5, 6`"

[method."std.BlankClip"]

[method."std.BlankClip".docs]
length = "Number of frames. Default: like the input clip, or 10 seconds without one.\n\nExample: `240`"
