[method."vstools.depth".docs]
dither_type = "How the bit reduction hides banding: None rounds; Ordered a fixed pattern; Random (default) light noise; Error diffusion and the other diffusion kinds (Sierra, Stucki, Atkinson, Ostromoukhov) spread the error, best for gradients. Only matters when lowering the depth.\n\nExample: Error diffusion"
sample_type = "Integer or float output. Default: float for 32 bit (and 16 when asked as float), integer below."
range_in = "The input's range when the clip does not say: limited (TV) or full (PC)."
range_out = "Converts to this range at the same time: limited (TV, 16-235 at 8 bit) or full (PC, 0-255). Default keeps the input's."
bitdepth = "Bit depth of the output: 8, 10, 12 or 16 give integer, 32 gives float. Lowering it dithers (see Dither).\n\nExample: `10`"

[method."vstools.limiter"]
help = "Clips pixel values into a range: the format's legal range, the TV range (16-235 at 8 bit) or bounds you give. Integer clips without bounds or TV range pass unchanged. Use it after filters that overshoot. Example: TV range on before encoding."

[method."vstools.limiter".docs]
min_val = "Lowest value kept, in the clip's scale (0-255 at 8 bit, 0-1 float); one per plane, the last reused.\n\nExample: `16, 16`"
max_val = "Highest value kept, in the clip's scale; one per plane, the last reused.\n\nExample: `235, 240`"
tv_range = "On clips to the TV (limited) range: luma 16-235 and chroma 16-240 at 8 bit, scaled for other depths."
mask = "For float mask clips: treats the colour planes as 0 to 1 instead of -0.5 to 0.5."

[method."std.Limiter"]
help = "Clips pixel values to between Lowest value and Highest value; values outside are set to the bound. Default bounds are the format's lowest and highest value. Example: Lowest value `16`, Highest value `235, 240` on 8-bit YUV."

[method."std.Limiter".docs]
min = "Lowest value kept, in the clip's scale; one per plane.\n\nExample: `16`"
max = "Highest value kept, in the clip's scale; one per plane.\n\nExample: `235, 240`"

