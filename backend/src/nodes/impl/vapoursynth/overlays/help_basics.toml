width = "Width in pixels; default like the input clip, else 640.\n\nExample: `1920`"
height = "Height in pixels; default like the input clip, else 480.\n\nExample: `1080`"
format = "Pixel format; default like the input clip, else RGB24."
fpsnum = "Frame rate numerator; default like the input clip, else 24.\n\nExample: `24000`"
fpsden = "Frame rate denominator; default like the input clip, else 1.\n\nExample: `1001`"
keep = "1 returns the same frame for every request (saves a little time); there is rarely a reason to set it.\n\nExample: `1`"
varsize = "1 makes the clip report a variable size, for testing filters that must handle that.\n\nExample: `1`"
varformat = "1 makes the clip report a variable format, for testing filters that must handle that.\n\nExample: `1`"
gpu = "1 makes the frames GPU resident, for filters that take GPU frames.\n\nExample: `1`"

[method."std.Splice"]

[method."std.Splice".docs]
mismatch = "1 allows clips of different sizes or formats; the result then has a variable size or format, which many filters refuse. Clips of different frame rates always work.\n\nExample: `1`"

[method."std.DuplicateFrames"]
help = "Repeats the listed frames once each, so the clip gets longer. A frame may be listed several times. Example: `10, 10, 20`."

[method."std.DuplicateFrames".docs]
frames = "Frame numbers to repeat, comma separated, of the input clip.\n\nExample: `10, 20`"

[method."std.FreezeFrames"]
help = "Replaces whole ranges with one still frame each, keeping the length. Use it to hide a few broken frames. Example: Range starts `0, 100`, Range ends `15, 112`, Frame shown per range `8, 50` shows frame 8 for 0-15 and frame 50 for 100-112."

[method."std.FreezeFrames".docs]
first = "Start of each range (included), comma separated.\n\nExample: `0, 100`"
last = "End of each range (included), in the same order as Range starts. Ranges must not overlap.\n\nExample: `15, 112`"
replacement = "The input frame shown over each range, in the same order.\n\nExample: `8, 50`"

[method."std.Interleave"]
help = "Alternates the frames of the clips: A0, B0, A1, B1 ... Use it to compare clips frame by frame, or to rebuild a sequence after splitting. The frame rate is multiplied by the number of clips by default."

[method."std.Interleave".docs]
extend = "1 treats every clip as long as the longest, repeating the last frame of shorter ones.\n\nExample: `1`"
mismatch = "1 allows clips of different formats, sizes or frame rates.\n\nExample: `1`"
modify_duration = "1 (default) multiplies the frame rate by the number of clips, keeping the duration; 0 keeps the first clip's rate, so the result plays longer.\n\nExample: `0`"

[method."std.Loop"]
help = "Plays the clip several times in a row. Example: Times `3` gives three copies."

[method."std.Loop".docs]
times = "How many times to play it; 0 (default) repeats up to the longest length VapourSynth allows.\n\nExample: `3`"

[method."std.Reverse"]
help = "Plays the clip backwards: the last frame comes first."

[method."std.SelectEvery"]
help = "Keeps chosen frames out of every group of frames. Examples: Group size `2`, Positions kept `0` keeps even frames; Group size `5`, Positions kept `1, 2, 3, 4` drops the first of every five. The frame rate follows by default."

[method."std.SelectEvery".docs]
cycle = "Size of the repeating group of frames. Must be 1 or more.\n\nExample: `5`"
offsets = "Positions to keep in each group, from 0 to Group size minus 1; a position may repeat to duplicate it.\n\nExample: `1, 2, 3, 4`"
modify_duration = "1 (default) scales the frame rate by kept/cycle so the duration stays; 0 keeps the rate.\n\nExample: `0`"

[method."vstools.insert_clip"]
help = "Overwrites part of the clip with a shorter clip, starting at a frame; the length stays. Use it to drop in a fixed scene. Pitfall: the inserted clip must end before the main clip does unless Error if too long is off."

[method."vstools.insert_clip".docs]
insert = "The clip whose frames are written over the main clip."
start_frame = "Frame of the main clip where the inserted clip begins.\n\nExample: `1200`"
strict = "On stops with an error when the inserted clip would run past the end; off cuts it to fit."

[method."vstools.remap_frames"]
help = "Builds a new clip from the frames listed, in that order; frames may repeat. Example: `[0, 5, (10, 15)]` gives frames 0, 5 and 10 to 15."

[method."vstools.remap_frames".docs]
ranges = "Frame numbers and (start, end) pairs in square brackets; a pair includes both ends.\n\nExample: `[0, 5, (10, 15)]`"

[method."vstools.replace_every"]
help = "Replaces frames at fixed positions in every group of frames with the same frames of a second clip. Example: Group size `5`, Positions replaced `4` takes every fifth frame from the second clip, e.g. a differently deinterlaced one."

[method."vstools.replace_every".docs]
clipb = "The clip the replacement frames come from, frame for frame."
cycle = "Size of the repeating group of frames, 2 or more.\n\nExample: `5`"
offsets = "Positions in each group taken from the second clip, from 0 to Group size minus 1.\n\nExample: `4`"
modify_duration = "Leave on: it keeps the frame rate. Off leaves the frame rate doubled."

[method."vstools.shift_clip"]
help = "Moves the clip in time by whole frames, keeping the length: with 1, output frame n shows input frame n+1 and the last frame repeats; with -1, frame n shows n-1 and the first repeats. Use it to compare a frame with its neighbour."

[method."vstools.shift_clip".docs]
offset = "Frames to shift by. Positive shows later frames earlier; negative the reverse.\n\nExample: `-1`"

[method."vstools.shift_clip_multi"]
help = "Gives several shifted copies of the clip at once, one per offset in a range (see \"Shift in time\"). Example: `(-1, 1)` gives copies shifted by -1, 0 and 1, the previous, current and next frames."

[method."vstools.shift_clip_multi".docs]
offsets = "First and last offset of the range, both included, as a pair in brackets.\n\nExample: `(-2, 2)`"

[method."resize.Point"]
help = "Nearest-pixel kernel: no blurring, blocky when enlarging. Converts format, bit depth and colours (matrix, transfer, primaries, range), and resizes when Width or Height is set. The kernel matters only for resizing and for changing chroma subsampling. Pitfall: YUV to RGB needs a known matrix; on 'no path between colorspaces' set Input matrix."

[method."resize.Point".docs]
width = "Output width in pixels. Empty keeps the width, so only format and colours change.\n\nExample: `1920`"
height = "Output height in pixels. Empty keeps the height.\n\nExample: `1080`"
format = "The output pixel format: colour family (GRAY, YUV, RGB), chroma subsampling (420, 444) and bit depth (P8, P16, S for 32-bit float). Default keeps the input's."
matrix = "The YUV-to-RGB matrix of the output. Needed when converting RGB to YUV; default keeps the input's. HD is usually BT.709 (1).\n\nExample: BT.709 (1)"
transfer = "The brightness curve of the output, e.g. Linear (8) for linear-light processing or BT.709 (1) for SDR video. Changing it converts the values.\n\nExample: Linear (8)"
primaries = "The colour gamut of the output, e.g. BT.709 (1) or BT.2020 (9). Changing it converts the colours.\n\nExample: BT.709 (1)"
range = "Output range: limited (TV, 16-235 at 8 bit) or full (PC, 0-255). Default: limited for YUV, full for RGB when the family changes, else the input's."
matrix_s = "Output matrix by name instead of number; wins over Matrix: `709`, `170m`, `470bg`, `2020ncl`, `rgb` ...\n\nExample: `709`"
transfer_s = "Output transfer by name: `709`, `601`, `srgb`, `linear`, `st2084` (PQ), `std-b67` (HLG) ...\n\nExample: `linear`"
