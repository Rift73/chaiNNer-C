help = "Converts the clip to look like the reference clip: its size (Bicubic), format, matrix, transfer and primaries, frame rate, and optionally length. Use it before comparing or merging clips that must match."

[method."vstools.match_clip".docs]
ref = "The clip whose size, format, colour information and frame rate the clip takes on."
dimensions = "On resizes the clip to the reference's width and height (Bicubic)."
vformat = "On converts the clip to the reference's format (colour family, subsampling, bit depth)."
matrices = "On marks the clip with the reference's matrix, transfer and primaries (marks only, no conversion)."
length = "On cuts the clip, or pads it by repeating its last frame, to the reference's length."

[method."vstools.get_y"]
help = "Takes the luma (Y, brightness) plane as a grayscale clip. Example: work on brightness only, then put it back with Join planes."

[method."vstools.get_u"]
help = "Takes the first colour plane (U, blue difference) as a grayscale clip. On 4:2:0 video it is half the width and height."

[method."vstools.get_v"]
help = "Takes the second colour plane (V, red difference) as a grayscale clip. On 4:2:0 video it is half the width and height."

[method."vstools.get_r"]
help = "Takes the red plane of an RGB clip as a grayscale clip."

[method."vstools.get_g"]
help = "Takes the green plane of an RGB clip as a grayscale clip."

[method."vstools.get_b"]
help = "Takes the blue plane of an RGB clip as a grayscale clip."

[method."vstools.plane"]
help = "Takes one plane, chosen by number, as a grayscale clip: 0 is Y (or R), 1 is U (or G), 2 is V (or B)."

[method."vstools.plane".docs]
index = "Plane number: 0 Y or R, 1 U or G, 2 V or B.\n\nExample: `1`"
strict = "Off removes the matrix mark when taking a plane of an RGB clip (a grayscale clip of RGB has no YUV matrix)."

[method."vstools.join"]

[method."vstools.join".docs]
alpha = "An alpha (transparency) clip attached to the result."
family = "Colour family of the result: YUV (default), RGB or GRAY. Joining a luma clip with a chroma source must give YUV."

[method."vstools.stack_planes"]
help = "Shows every plane of the clip side by side as one grayscale picture, to inspect each plane. On 4:2:0 the colour planes are smaller and stacked. Example: look for noise in the colour planes."

[method."vstools.stack_planes".docs]
shift_float_chroma = "On, for 32-bit float YUV: shifts the colour planes so grey shows as mid-grey, as in integer video. Off shows them dark."
offset_chroma = "Brightens the colour planes for viewing: a number is added to their values; Python value `'min'` or `'max'` lines them up with luma's minimum or maximum.\n\nExample: `0.25`"
mode = "h places the planes side by side, v one under the other."
write_plane_name = "On writes each plane's name (Y, U, V ...) on it."
alignment = "Where the plane names are written, numpad style: 7 top left, 8 top centre, 5 centre, 1 bottom left.\n\nExample: `8`"
scale = "Size of the plane names; 2 doubles it.\n\nExample: `2`"

[method."std.Merge"]

[method."std.Merge".docs]
clipb = "The clip mixed in; same size and format as the first."
weight = "Share of the second clip, 0 to 1, one per plane; one value is used for all, a second covers both colour planes. Default 0.5.\n\nExample: `1, 0` (luma from the second clip, colour from the first)"

[method."std.MaskedMerge"]
help = "Mixes two clips pixel by pixel through a mask: black in the mask keeps the first clip, white takes the second, grey mixes. Example: apply a filter only where an edge mask is white."

[method."std.MaskedMerge".docs]
clipb = "The clip taken where the mask is white; same size and format as the first."
mask = "The mask: full-range values, black keeps the first clip, white takes the second. Same format as the clips or grayscale."
first_plane = "1 uses the mask's first plane for all planes (scaled down for subsampled colour planes). A grayscale mask always works this way.\n\nExample: `1`"
premultiplied = "1 treats the second clip as premultiplied with the mask (alpha compositing). Default 0.\n\nExample: `1`"

[method."std.MakeDiff"]
help = "Stores the difference between two clips as a clip (grey means no difference). With \"Add a difference back\" it moves detail between clips. Example: clip minus a blurred copy gives the detail; adding it back sharpens."

[method."std.MakeDiff".docs]
clipb = "The clip subtracted from the first; same size and format."

[method."std.MergeDiff"]
help = "Adds a difference clip made by \"Difference of two clips\" back onto a clip. Example: add the detail taken from the source back onto a denoised clip."

[method."std.MergeDiff".docs]
clipb = "The difference clip made by \"Difference of two clips\"."

[method."std.MakeFullDiff"]
help = "Like \"Difference of two clips\", but the result has one more bit of depth, so large differences are not clipped. Use it with \"Add a full difference back\"."

[method."std.MakeFullDiff".docs]
clipb = "The clip subtracted from the first; same size and format."

[method."std.MergeFullDiff"]
help = "Adds a difference clip made by \"Difference, one bit more\" back onto a clip; the difference clip must have one bit more than the clip."

[method."std.MergeFullDiff".docs]
clipb = "The difference clip made by \"Difference, one bit more\"."

[method."std.ShufflePlanes"]
help = "Picks planes from up to three clips and puts them together as a new clip, with almost no checks. Examples: Plane from each clip `0`, Gray takes plane 0; Plane from each clip `0, 2, 1`, YUV swaps U and V."

[method."std.ShufflePlanes".docs]
planes = "Which plane to take from each clip, one number per output plane (first from the first clip ...). One clip is reused for all.\n\nExample: `0, 2, 1`"
colorfamily = "Colour family of the result: Gray (one plane), YUV or RGB."
prop_src = "Takes the frame properties from this clip instead of the first."

[method."std.SplitPlanes"]
help = "Splits a clip into one grayscale clip per plane. Split Planes gives them as three separate outputs."

[method."std.StackHorizontal"]
help = "Places clips side by side, left to right. They must have the same height and format. Example: compare a source and a filtered clip."

[method."std.StackVertical"]
help = "Places clips one under the other. They must have the same width and format."

[method."std.Levels"]
help = "Adjusts brightness, contrast and gamma by mapping the input range Input black-white to Output black-white; values outside are clipped. Example: Input black `16`, Input white `235, 240`, Output black `0`, Output white `255` turns 8-bit TV range into full range. Pitfall: float YUV assumes 0-1 for the colour planes too."

[method."std.Levels".docs]
min_in = "Input value that becomes Output black (black point), in the clip's scale; one per plane, the last reused.\n\nExample: `16`"
max_in = "Input value that becomes Output white (white point); default the format's maximum.\n\nExample: `235, 240`"
gamma = "Midtone curve: above 1 brightens, below 1 darkens; 1 (default) is linear.\n\nExample: `1.2`"
min_out = "Output value for Input black; default 0.\n\nExample: `16`"
max_out = "Output value for Input white; default the format's maximum.\n\nExample: `235`"

[method."std.Invert"]
help = "Makes a negative: each value becomes the format's maximum minus the value. Choose the planes; for a mask use Invert Mask in the Masks node."

[method."vszip.CLAHE"]
help = "Local contrast boost (contrast limited adaptive histogram equalization): evens out brightness tile by tile, lifting detail in dark and flat areas. 8 to 16-bit integer clips only. Often used to make edge masks find faint edges."

[method."vszip.CLAHE".docs]
limit = "How much contrast may be added; higher is stronger and noisier. Default 7 at 8 bit; multiply by 256 for 16 bit.\n\nExample: `15`"
tiles = "The tile grid of the equalization (as OpenCV's tile grid): one value for both sides, or two. Default 3.\n\nExample: `8`"

[method."placebo.Tonemap"]
help = "Converts HDR to SDR (and other colour mappings) with libplacebo on the GPU (Vulkan). Example: Input colour space `1` (HDR10) and Output colour space `0` (SDR) for a UHD Blu-ray. Takes RGB48 or 16-bit YUV; gives RGB48 or YUV444P16."

[method."placebo.Tonemap".docs]
src_csp = "Colour space of the input: 0 SDR, 1 HDR10, 2 HLG, 3 Dolby Vision.\n\nExample: `1`"
dst_csp = "Colour space of the output: 0 SDR (BT.709), 1 HDR10, 2 HLG, 3 Dolby Vision.\n\nExample: `0`"
dst_prim = "Output primaries: 3 BT.709 (HD), 6 BT.2020, 11 DCI-P3, 12 DCI-P3 with D65 white; other numbers in the plugin's list.\n\nExample: `3`"
src_max = "Brightest level of the source display, in nits; default from the frame properties when present.\n\nExample: `1000`"
src_min = "Darkest level of the source display, in nits.\n\nExample: `0.005`"
dst_max = "Brightest level of the target display, in nits.\n\nExample: `203`"
dst_min = "Darkest level of the target display, in nits.\n\nExample: `0.1`"
dynamic_peak_detection = "1 (default) measures each scene's peak brightness and adapts to it; 0 uses the static values.\n\nExample: `0`"
smoothing_period = "Smooths the measured brightness over about this many frames, against flicker; 0 turns smoothing off. Default 20.\n\nExample: `50`"
scene_threshold_low = "Brightness change (in 1% PQ steps) where smoothing starts to give way at a scene cut. Default 1; 0 disables the scene logic.\n\nExample: `1.5`"
scene_threshold_high = "Brightness change where smoothing is fully off at a scene cut. Default 3.\n\nExample: `5`"
percentile = "Which brightness percentile counts as the peak; 100 (default) the brightest pixel. 99.995 ignores tiny highlights.\n\nExample: `99.995`"
gamut_mapping = "How out-of-gamut colours are handled: 0 clip, 1 perceptual (default), 2 softclip, 3 relative, 4 saturation, 5 absolute, 6 desaturate, 7 darken, 8 highlight them, 9 linear.\n\nExample: `2`"
tone_mapping_function = "Tone curve: 0 clip, 1 spline (default), 2 st2094-40, 3 st2094-10, 4 bt2390, 5 bt2446a, 6 reinhard, 7 mobius, 8 hable, 9 gamma, 10 linear, 11 linearlight.\n\nExample: `4`"
tone_mapping_function_s = "Tone curve by name, winning over the number: `spline`, `bt2390`, `bt2446a`, `hable`, `reinhard` ...\n\nExample: `bt2390`"
tone_mapping_param = "Fine-tunes the chosen tone curve; its meaning depends on the curve. Default the curve's own."
metadata = "Which HDR metadata to use: 0 automatic (default), 1 none, 2 HDR10 static, 3 HDR10+, 4 measured luminance.\n\nExample: `2`"
use_dovi = "1 uses the Dolby Vision metadata (RPU); on by default when the input is Dolby Vision.\n\nExample: `0`"
dovi_el = "The Dolby Vision enhancement layer clip (YUV420P16), when the source has one; needs Use Dolby Vision data `1`."
visualize_lut = "1 draws a graph of the active tone curve on the picture, for tuning.\n\nExample: `1`"
show_clipping = "1 highlights pixels that are hard-clipped by the tone mapping.\n\nExample: `1`"
contrast_recovery = "Adds back fine detail lost in tone mapping; 0 (default) off, 0.3 as libplacebo's high-quality preset. May ring on some sources.\n\nExample: `0.3`"
log_level = "How much libplacebo prints; default 2.\n\nExample: `3`"

[method."vsexprtools.norm_expr"]
help = "Runs a per-pixel formula (\"normalize\" refers to tidying the formula, not the picture). Formulas list operands first, then the operator: `x 2 *` is x times 2. `x` is the main clip, `y`, `z`, `a` ... the next clips. Unlike \"Formula per pixel (std.Expr)\" it knows names that fit any bit depth (`plane_max`, `neutral` ...). Example: `plane_min plane_max + x -` makes a negative."

[method."vsexprtools.norm_expr".docs]
expr = "`x`, `y` ... clips; `plane_min`/`plane_max` legal range of the plane; `range_max` full-range peak; `neutral` grey colour (128); `X` `Y` position; `N` frame number; `x[-1,0]` left pixel. Per plane: `('x 1.2 *', '')`, empty copies.\n\nExample: `x neutral - 1.5 * neutral +` on U and V boosts saturation."
opt = "On computes with whole numbers where possible: faster on integer clips, but intermediate results must fit 32-bit integers. Needed for bit operations on 24-32-bit integer clips."
boundary = "What a neighbour pixel past the picture edge is (in `x[-1,0]`): on mirrors the picture (default), off repeats the edge pixel."
format = "The output format; Default gives the first clip's format. Pick another when results would not fit, e.g. a 32-bit float format.\n\nExample: GRAYS"
split_planes = "On splits each clip into its planes first, so `x`, `y`, `z` are the Y, U, V planes of one clip (needs 4:4:4 to mix them)."
kwargs = "Values for `{name}` placeholders in the formula, one value or one per plane.\n\nExample: `{'gain': 1.5}` with formula `x {gain} *`"

[method."vsexprtools.expr_func"]
help = "Runs a per-pixel formula exactly as typed, through the akarin plugin, without the depth names (`plane_max`, `neutral`) or placeholders of \"Formula per pixel, any bit depth\". Formulas list operands first, then the operator: `x 2 *` is x times 2. Example: `x 0.5 *` halves the values."

[method."vsexprtools.expr_func".docs]
expr = "The formula, applied to every plane; values are in the clip's own scale (0-255 at 8 bit, 0-1 float). `x`, `y` ... are the clips.\n\nExample: `x 16 - 255 * 219 /`"
opt = "On computes with whole numbers where possible: faster on integer clips, but intermediate results must fit 32-bit integers."
boundary = "What a neighbour pixel past the picture edge is (in `x[-1,0]`): on mirrors the picture (default), off repeats the edge pixel."
format = "The output format; Default gives the first clip's format."

[method."vsexprtools.combine"]
help = "Joins clips pixel by pixel with one operator: by default the maximum, keeping the brightest value of the clips at each pixel (useful for adding masks). Before each clip and After each clip change each clip's term. Example: After the whole formula `0.5 *` halves the result."

[method."vsexprtools.combine".docs]
operator = "The joining operator. Max (the start value) keeps the brightest pixel of the clips, Min the darkest.\n\nExample: Min"
suffix = "Formula text put after each clip's letter.\n\nExample: `2 *` (gives `x 2 * y 2 * max`)"
prefix = "Formula text put before each clip's letter.\n\nExample: `1` with suffix `-`"
expr_suffix = "Formula text put after the whole joined formula.\n\nExample: `0.5 *`"
expr_prefix = "Formula text put before the whole joined formula.\n\nExample: `1`"
split_planes = "On treats each plane of the clips as a separate input, so the planes of one clip are joined with each other."
kwargs = "More settings for the formula run, as in \"Formula per pixel, any bit depth\", e.g. placeholder values.\n\nExample: `{'opt': True}`"

[method."std.Expr"]
help = "VapourSynth's built-in per-pixel formula. Formulas list operands first, then the operator: `x 2 *` is x times 2. `x`, `y`, `z`, `a` ... are the clips (up to 26). Values are in the clip's own scale (0-255 at 8 bit). The neighbours method also reads nearby pixels and frame properties; the any-bit-depth method has names that fit every depth. Example: `x y + 2 /` averages two clips."

[method."std.Expr".docs]
expr = "The formula, or a list with one per plane; an empty one copies that plane, and the last is reused for missing planes.\n\nExample: `['x 1.1 *', '']`"
format = "Output format; default the first clip's. It must keep the subsampling. Integer results are clipped to the format's range."

[method."akarin.Expr"]
help = "Per-pixel formula like \"Formula per pixel (std.Expr)\", plus neighbour pixels `x[-1,0]`, frame properties `x.PlaneStatsAverage`, position `X` `Y`, frame number `N`, `clamp`, `round` and variables. Formulas list operands first, then the operator: `x 2 *` is x times 2. Example: `x x[-1,0] + x[1,0] + 3 /` blurs horizontally."

[method."akarin.Expr".docs]
expr = "The formula, or a list with one per plane; an empty one copies that plane.\n\nExample: `['x 1.1 *', '']`"
format = "Output format; default the first clip's. It must keep the subsampling."
opt = "1 computes with 32-bit whole numbers as long as possible: faster, but values must fit and overflow wraps. Default 0.\n\nExample: `1`"
boundary = "Neighbour pixels past the edge: 0 (default) repeat the edge pixel, 1 mirror the picture.\n\nExample: `1`"

[method."akarin.Select"]
help = "Chooses per frame which clip to output, by a formula on frame properties of the property clips: the result is the clip's number. Example: `x._Combed 1 0 ?` gives the second clip on frames marked combed."

[method."akarin.Select".docs]
prop_src = "Clip(s) whose frame properties the formula reads, as `x`, `y` ..."
expr = "Formula on frame properties (`x.PlaneStatsAverage`); pixels cannot be read. Its result picks the clip, counted from 0.\n\nExample: `x.PlaneStatsAverage 0.5 > 1 0 ?`"

[method."akarin.Text"]
help = "Writes text on the frames, with frame properties filled in, for checking a chain. Example: `Frame {N}: {_PictType}`. By default the text shows in previews but not when encoding with vspipe."

[method."akarin.Text".docs]
text = "The text; `{N}` is the frame number, `{Name}` a frame property, `{x._Matrix:d}` as a number, `{x.Prop:.4f}` with 4 decimals.\n\nExample: `{N} {_PictType}`"
alignment = "Position, numpad style: 7 top left (default), 8 top centre, 5 centre, 2 bottom centre.\n\nExample: `8`"
scale = "Text size; 2 doubles it.\n\nExample: `2`"
prop = "If set, the text is stored in this frame property instead of being drawn.\n\nExample: `Label`"
strict = "1 stops with an error when the text format is wrong for a frame.\n\nExample: `1`"
vspipe = "1 also draws the text when encoding with vspipe (default only in previews).\n\nExample: `1`"

[method."akarin.Cambi"]
help = "Measures visible banding (Netflix's CAMBI score) on the luma of each frame and stores it in the CAMBI frame property; the picture is not changed. 8 or 10-bit integer clips only. Example: find frames that need debanding."

[method."akarin.Cambi".docs]
window_size = "Size of the area judged together, 15 to 127; 63 (default) fits 4K.\n\nExample: `31`"
topk = "Share of the worst pixels pooled into the score, 0.0001 to 1; default 0.6.\n\nExample: `0.3`"
tvi_threshold = "Visibility threshold for brightness steps, 0.0001 to 1; default 0.019. Lower counts fainter bands.\n\nExample: `0.01`"
scores = "1 also stores the score at each of 5 scales (CAMBI_SCALE0 ...).\n\nExample: `1`"
scaling = "Factor that normalizes the per-scale scores stored with Per-scale scores; default 1 divided by Window size."

[method."akarin.DLISR"]
help = "Upscales with NVIDIA's DLISR network. Needs an RTX graphics card and the nvngx_dlisr.dll next to the plugin; takes RGBS (32-bit float RGB) only. Uses much video memory (about 2 GB for 2x of 1080p)."

[method."akarin.DLISR".docs]
scale = "Upscale factor: 2 (default), 4 or 8.\n\nExample: `2`"

[method."akarin.DLVFX"]
help = "NVIDIA Video Effects: Effect 0 reduces compression artifacts, Effect 1 upscales. Needs an RTX card and NVIDIA's Video Effects library installed; RGBS or RGB24 input with width a multiple of 128."

[method."akarin.DLVFX".docs]
op = "0 artifact reduction, 1 super resolution.\n\nExample: `1`"
scale = "Upscale factor for Effect 1.\n\nExample: `2`"
strength = "Enhancement strength: 0 or 1.\n\nExample: `1`"
output_depth = "32 gives RGBS, 8 gives RGB24; default like the input.\n\nExample: `32`"
num_streams = "Frames processed at once on the GPU; more can be faster on a strong card.\n\nExample: `2`"

[method."std.Lut"]
help = "Replaces every value through a table you type: one output value per possible input value (256 entries for 8 bit). \"Formula per pixel (std.Expr)\" or \"Formula per pixel, any bit depth\" is easier for most uses."

[method."std.Lut".docs]
lut = "Output value for each input value 0, 1, 2 ... up to the maximum, comma separated; integer output."
lutf = "Like the whole-number table, with decimal output values; needs Float output `1`."
bits = "Bit depth of the output; default the input's.\n\nExample: `16`"
floatout = "1 gives 32-bit float output (with Table (decimals)).\n\nExample: `1`"

[method."std.Lut2"]
help = "Like \"Lookup table, one clip\" with two clips: the table has one output for every pair of input values (65,536 entries for two 8-bit clips), so typing it is impractical. \"Formula per pixel (std.Expr)\" or \"Formula per pixel, any bit depth\" is easier."

[method."std.Lut2".docs]
clipb = "The second clip, whose value is the second index into the table."
lut = "Output value for every pair of values, comma separated; the second clip's value varies slowest."
lutf = "Like the whole-number table, with decimal output values; needs Float output `1`."
bits = "Bit depth of the output; default the first clip's. Values are not scaled.\n\nExample: `10`"
floatout = "1 gives 32-bit float output (with Table (decimals)).\n\nExample: `1`"

[method."chainner_vs.range_fix"]

[method."chainner_vs.range_fix".docs]
mode = "Compress squeezes full-range values into the limited range, for a clip that looks too dark and contrasty; Expand stretches limited to full, for a washed-out clip. Only the values change, not the range flag.\n\nExample: Compress (Full to Limited)"
