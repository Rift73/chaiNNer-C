transfer_in_s = "The input's transfer by name, used only when the frames do not say.\n\nExample: `709`"
primaries_in = "The input's colour gamut, used only when the frames do not say.\n\nExample: BT.709 (1)"
primaries_in_s = "The input's primaries by name, used only when the frames do not say.\n\nExample: `709`"
range_in = "The input's range, used only when the frames do not say: limited (TV) or full (PC)."
