time = "Position of the new frame between the two source frames, 0 to 100; 50 = midway. Example: `time = 50`"
ml = "Motion length that counts as full occlusion; lower = stronger occlusion masking. Example: `ml = 100`"
blend = "Blends both directions in occluded areas instead of picking one. Example: `blend = False`"
thscd1 = "Block difference (SAD, sum of absolute differences, given for an 8x8 block at 8-bit) above which a block counts as changed, for scene-change detection. Higher = fewer scene changes. Example: `thscd1 = 400`"
