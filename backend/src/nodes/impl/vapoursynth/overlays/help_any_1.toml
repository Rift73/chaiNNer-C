blksize = "Block size in pixels, one value or `[h, v]`; defaults to the super clip's. Smaller = finer motion, slower. Example: `blksize = 16`"
overlap = "Block overlap, at most half the block size; defaults to the super clip's. More = smoother vectors, slower. Example: `overlap = 8`"
levels = "How many levels of the coarse-to-fine search pyramid to use; 0 = all. Example: `levels = 0`"
search = "Search pattern: 0 diamond, 1 exhaustive, 2 hexagon (default), 3 uneven multi-hexagon (most thorough of the fast ones), 4 horizontal only, 5 vertical only. Example: `search = 3`"
searchparam = "Search radius or step of that pattern. Higher = finds larger motion, slower. Example: `searchparam = 2`"
pelsearch = "Search radius at the finest, sub-pixel level; defaults to the super clip's pel. Example: `pelsearch = 2`"
mvlambda = "How strongly each block's vector is pulled towards its neighbours. High (default 1000) = smooth, true motion for interpolation; 0 = best match per block, often better for denoising. Example: `mvlambda = 0`"
chroma = "Includes the colour planes when comparing blocks. Example: `chroma = False`"
delta = "Step between the analysed distances (always positive here): 2 analyses frames 2, 4, 6 away. Example: `delta = 1`"
lsad = "Block difference above which the smoothness pull (mvlambda) is relaxed, so poorly matching blocks may search freely. No effect when mvlambda is 0. Example: `lsad = 400`"
plevel = "How the smoothness pull grows at the coarse levels: 0 constant, 1 linear (default), 2 quadratic. Example: `plevel = 2`"
globalmv = "Also estimates one whole-frame (camera pan) vector and tries it for every block. Example: `globalmv = False`"
pnew = "Penalty, out of 256, a newly found vector must overcome to replace the predicted one. Higher = steadier vectors. Example: `pnew = 50`"
pzero = "Same penalty for choosing the zero (no motion) vector; defaults to pnew. Example: `pzero = 0`"
pglobal = "Same penalty for choosing the whole-frame vector. Example: `pglobal = 0`"
badsad = "Block difference above which a block gets a second, wider search. Example: `badsad = 10000`"
badrange = "Radius of that wider search in pixels. Example: `badrange = 24`"
meander = "Scans block rows alternately left-to-right and right-to-left, which reuses neighbour vectors better. Example: `meander = False`"
trymany = "Tries several candidate vectors per block: 0 off, 1 on all but the finest level, 2 everywhere. Slower, occasionally better. Example: `trymany = 1`"
fields = "Treats the clip as separated fields (interlaced material after SeparateFields). Example: `fields = True`"
tff = "Top field first; only used with `fields = True`. Example: `tff = True`"
satd = "Compares blocks with SATD (transform-based, closer to visible difference) instead of plain SAD. Slower. Example: `satd = True`"
prefix = "Name prefix of the frame properties that carry the vectors. Must be the same on the super, vector and consumer calls; only change it to run two analyses on one clip. Example: `prefix = 'B'`"
radius = "Number of frames on each side to analyse; Degrain then uses that many. 1 to 3 is usual. Example: `radius = 2`"

[method."mvu.Recalculate"]
help = "Refines existing vectors at a smaller block size instead of searching again, for finer motion at little cost. Connect a Super (mvu) of the same bit depth as the main clip and the AnalyseMany result to a socket named `vectors`. Example: `blksize = 4` and `overlap = 2` after an 8/4 analysis."

[method."mvu.Recalculate".docs]
vectors = "The vector clip or list to refine (for example from AnalyseMany). Connect it to a Clip or filter socket and type `vectors` as its Argument name."
thsad = "Blocks whose difference is below this keep their vector; worse ones are searched again. Example: `thsad = 200`"
smooth = "Starts the finer vectors from an interpolation of their neighbours (on) or from the nearest old vector (off). Example: `smooth = False`"
blksize = "The finer block size, usually half the original. Example: `blksize = 4`"
overlap = "The finer overlap, usually half the original. Example: `overlap = 2`"
search = "Search pattern: 0 diamond, 1 exhaustive, 2 hexagon (default), 3 uneven multi-hexagon (most thorough of the fast ones), 4 horizontal only, 5 vertical only. Example: `search = 3`"
searchparam = "Search radius or step of that pattern. Higher = finds larger motion, slower. Example: `searchparam = 2`"
mvlambda = "How strongly each block's vector is pulled towards its neighbours. High (default 1000) = smooth, true motion for interpolation; 0 = best match per block, often better for denoising. Example: `mvlambda = 0`"
chroma = "Includes the colour planes when comparing blocks. Example: `chroma = False`"
pnew = "Penalty, out of 256, a newly found vector must overcome to replace the predicted one. Higher = steadier vectors. Example: `pnew = 50`"
meander = "Scans block rows alternately left-to-right and right-to-left, which reuses neighbour vectors better. Example: `meander = False`"
fields = "Treats the clip as separated fields (interlaced material after SeparateFields). Example: `fields = True`"
tff = "Top field first; only used with `fields = True`. Example: `tff = True`"
satd = "Compares blocks with SATD (transform-based, closer to visible difference) instead of plain SAD. Slower. Example: `satd = True`"
prefix = "Name prefix of the frame properties that carry the vectors. Must be the same on the super, vector and consumer calls; only change it to run two analyses on one clip. Example: `prefix = 'B'`"

[method."mvu.Degrain"]
help = "Motion-compensated temporal denoise: averages each block with the matching blocks of neighbouring frames, so grain drops while moving detail stays sharp. Main clip = the video; sockets `super` (Super (mvu)) and `vectors` (AnalyseMany (mvu)). The Denoise node's Denoise moving grain (mc_degrain) does all three steps in one. Example: `thsad = 300`."

[method."mvu.Degrain".docs]
super = "The super clip made by Super (mvu) from the same video. Connect it to a Clip or filter socket and type `super` as its Argument name."
vectors = "The vector list from AnalyseMany (mvu); its length sets how many frames are averaged. Connect it to a Clip or filter socket and type `vectors` as its Argument name."
thsad = "Block difference at which a neighbouring frame's block stops counting, `[luma, chroma]` or one value. Higher = stronger denoising, more risk of ghosting. 200 to 500 is usual. Example: `thsad = [300, 200]`"
thsad2 = "The same threshold for the furthest frames; the frames between blend from thsad to this. Lower than thsad cuts blur from distant frames. Example: `thsad2 = 150`"
limit = "Largest change allowed per pixel, `[luma, chroma]`, in the clip's own values; default no limit. Example: `limit = [8, 8]`"
thscd1 = "Block difference (SAD, sum of absolute differences, given for an 8x8 block at 8-bit) above which a block counts as changed, for scene-change detection. Higher = fewer scene changes. Example: `thscd1 = 400`"
thscd2 = "Percentage (0 to 100) of changed blocks that makes the frame a scene change; there the frame passes through unprocessed. Example: `thscd2 = 51`"
weights = "Extra weight per frame in time order, from the furthest past through the current frame to the furthest future (2 x radius + 1 values); only ratios matter. Example: `weights = [1, 2, 1]`"
prefix = "Name prefix of the frame properties that carry the vectors. Must be the same on the super, vector and consumer calls; only change it to run two analyses on one clip. Example: `prefix = 'B'`"

[method."mvu.Compensate"]
help = "Builds each frame from its reference frame moved along the motion vectors (block by block): a motion-aligned neighbour, for your own temporal filters. Main clip = the video; sockets `super` and `vectors` (one clip from Analyse). Flow (mvu) does the same per pixel, without block edges."

[method."mvu.Compensate".docs]
super = "The super clip made by Super (mvu) from the same video. Connect it to a Clip or filter socket and type `super` as its Argument name."
vectors = "One vector clip from Analyse (mvu). Connect it to a Clip or filter socket and type `vectors` as its Argument name."
thsad = "Blocks whose difference exceeds this are taken from the current frame instead of the reference. Example: `thsad = 1000`"
fields = "Treats the clip as separated fields (interlaced material after SeparateFields). Example: `fields = True`"
time = "Position between the frame and its reference, 0 to 100 percent; 100 = fully at the reference. Example: `time = 50`"
thscd1 = "Block difference (SAD, sum of absolute differences, given for an 8x8 block at 8-bit) above which a block counts as changed, for scene-change detection. Higher = fewer scene changes. Example: `thscd1 = 400`"
thscd2 = "Percentage (0 to 100) of changed blocks that makes the frame a scene change; there the frame passes through unprocessed. Example: `thscd2 = 51`"
tff = "Top field first; only used with `fields = True`. Example: `tff = True`"
prefix = "Name prefix of the frame properties that carry the vectors. Must be the same on the super, vector and consumer calls; only change it to run two analyses on one clip. Example: `prefix = 'B'`"

[method."mvu.Flow"]
help = "Warps the reference frame onto the current one pixel by pixel along the motion vectors: a smooth motion-aligned neighbour without block edges. Main clip = the video; sockets `super` and `vectors` (one clip from Analyse). Example: `time = 50` warps half way."

[method."mvu.Flow".docs]
super = "The super clip made by Super (mvu) from the same video. Connect it to a Clip or filter socket and type `super` as its Argument name."
vectors = "One vector clip from Analyse (mvu). Connect it to a Clip or filter socket and type `vectors` as its Argument name."
time = "Position between the frame and its reference, 0 to 100 percent; 100 = fully at the reference. Example: `time = 50`"
fields = "Treats the clip as separated fields (interlaced material after SeparateFields). Example: `fields = True`"
thscd1 = "Block difference (SAD, sum of absolute differences, given for an 8x8 block at 8-bit) above which a block counts as changed, for scene-change detection. Higher = fewer scene changes. Example: `thscd1 = 400`"
thscd2 = "Percentage (0 to 100) of changed blocks that makes the frame a scene change; there the frame passes through unprocessed. Example: `thscd2 = 51`"
tff = "Top field first; only used with `fields = True`. Example: `tff = True`"
prefix = "Name prefix of the frame properties that carry the vectors. Must be the same on the super, vector and consumer calls; only change it to run two analyses on one clip. Example: `prefix = 'B'`"

[method."mvu.FlowBlur"]
help = "Adds motion blur: smears each pixel along its motion. Use it to soften judder or fake shutter blur. Main clip = the video; sockets `super` and `vectors` (AnalyseMany with radius 1). Example: `blur = 100` for a full-frame smear."

[method."mvu.FlowBlur".docs]
super = "The super clip made by Super (mvu) from the same video. Connect it to a Clip or filter socket and type `super` as its Argument name."
vectors = "The vector list from AnalyseMany (mvu) with radius 1 (backward and forward). Connect it to a Clip or filter socket and type `vectors` as its Argument name."
blur = "Blur length as a percentage of the motion, 0 to 200. Example: `blur = 50`"
prec = "Step between blur samples in pixels; lower = smoother, slower. Example: `prec = 1`"
thscd1 = "Block difference (SAD, sum of absolute differences, given for an 8x8 block at 8-bit) above which a block counts as changed, for scene-change detection. Higher = fewer scene changes. Example: `thscd1 = 400`"
thscd2 = "Percentage (0 to 100) of changed blocks that makes the frame a scene change; there the frame passes through unprocessed. Example: `thscd2 = 51`"
prefix = "Name prefix of the frame properties that carry the vectors. Must be the same on the super, vector and consumer calls; only change it to run two analyses on one clip. Example: `prefix = 'B'`"

[method."mvu.FlowFPS"]
help = "Changes the frame rate by building new in-between frames from motion (frame interpolation), e.g. 24 to 60 fps. Main clip = the video; sockets `super` and `vectors` (AnalyseMany with radius 1). The Clip Properties node's Change frame rate (change_fps) only drops or repeats frames. Pitfall: fast or complex motion shows warping artefacts."

[method."mvu.FlowFPS".docs]
super = "The super clip made by Super (mvu) from the same video. Connect it to a Clip or filter socket and type `super` as its Argument name."
vectors = "The vector list from AnalyseMany (mvu) with radius 1 (backward and forward). Connect it to a Clip or filter socket and type `vectors` as its Argument name."
num = "Output frame rate numerator. Default 25 fps (num 25, den 1), so type both; num or den 0 doubles the input rate. Example: `num = 60000`"
den = "Output frame rate denominator. Example: `den = 1001`"
extramask = "Uses a second occlusion pass, which hides more warping in covered or revealed areas. Example: `extramask = False`"
ml = "Motion length that counts as full occlusion; lower = stronger occlusion masking. Example: `ml = 100`"
blend = "Blends both directions in occluded areas instead of picking one. Example: `blend = False`"
thscd1 = "Block difference (SAD, sum of absolute differences, given for an 8x8 block at 8-bit) above which a block counts as changed, for scene-change detection. Higher = fewer scene changes. Example: `thscd1 = 400`"
thscd2 = "Percentage (0 to 100) of changed blocks that makes the frame a scene change; there the frame passes through unprocessed. Example: `thscd2 = 51`"
prefix = "Name prefix of the frame properties that carry the vectors. Must be the same on the super, vector and consumer calls; only change it to run two analyses on one clip. Example: `prefix = 'B'`"

[method."mvu.FlowInter"]
help = "Builds a frame between each frame and the next from motion, at the position set by time; the frame count stays the same. Use it to replace a broken or duplicated frame with an interpolated one. Main clip = the video; sockets `super` and `vectors` (AnalyseMany with radius 1). Example: `time = 50`."

