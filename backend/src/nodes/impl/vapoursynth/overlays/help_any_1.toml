help = "Edge mask, refined 3x3 Scharr: thin lines, even in all directions. White lines on black, full range. The Masks node's Edge mask (edgemask) with Edge detector RScharr runs this same plugin and adds thresholds, so prefer it; use this for the bare, fastest call. Example: `scale = 2` for brighter lines."

[method."edgemasks.RScharr".docs]
scale = "Multiplies the result; above 1 brightens the lines. One value or one per plane. Example: `scale = 2`"
opt = "CPU code path: 0 automatic (default), 1 plain C, 2 SSE4.1, 3 AVX2, 4 AVX-512. Only for testing. Example: `opt = 1`"

[method."edgemasks.Scharr"]
help = "Edge mask, 3x3 with even response in every direction: thin, brighter than Sobel. White lines on black, full range. The Masks node's Edge mask (edgemask) with Edge detector Scharr runs this same plugin and adds thresholds, so prefer it; use this for the bare, fastest call. Example: `scale = 2` for brighter lines."

[method."edgemasks.Scharr".docs]
scale = "Multiplies the result; above 1 brightens the lines. One value or one per plane. Example: `scale = 2`"
opt = "CPU code path: 0 automatic (default), 1 plain C, 2 SSE4.1, 3 AVX2, 4 AVX-512. Only for testing. Example: `opt = 1`"

