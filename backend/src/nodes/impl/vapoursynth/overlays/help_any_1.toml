scale = "Multiplies the result; above 1 brightens the lines. One value or one per plane. Example: `scale = 2`"
opt = "CPU code path: 0 automatic (default), 1 plain C, 2 SSE4.1, 3 AVX2, 4 AVX-512. Only for testing. Example: `opt = 1`"

