[method."mvu.DepanEstimate"]
help = "First step of stabilising: measures each frame's whole-picture motion (camera pan, optionally zoom) directly from the image. Feed the result to DepanStabilise (mvu) as `data`. Integer clips only, no float. Example: `zoommax = 1.1` to also measure zoom."

[method."mvu.DepanEstimate".docs]
trust = "Trust limit for accepting an estimate; higher = more permissive. Example: `trust = 4.0`"
winx = "Width of the measuring window in pixels; 0 = automatic. Example: `winx = 512`"
winy = "Height of the measuring window in pixels; 0 = automatic. Example: `winy = 256`"
wleft = "Left edge of the measuring window; -1 = centred. Example: `wleft = -1`"
wtop = "Top edge of the measuring window; -1 = centred. Example: `wtop = -1`"
dxmax = "Largest expected horizontal motion in pixels; -1 = automatic. Example: `dxmax = 40`"
dymax = "Largest expected vertical motion in pixels; -1 = automatic. Example: `dymax = 20`"
zoommax = "Largest expected zoom factor; 1.0 = pan only. Example: `zoommax = 1.1`"
stab = "Stability factor of the estimate. Example: `stab = 1.0`"
pixaspect = "Pixel aspect ratio of the source (1 = square pixels). Example: `pixaspect = 1.0`"
info = "Prints the measured or applied values on the frame. Example: `info = True`"
show = "Draws the measured motion on the frame, to check it. Example: `show = True`"
fields = "Treats the clip as separated fields (interlaced material after SeparateFields). Example: `fields = True`"
tff = "Top field first; only used with `fields = True`. Example: `tff = True`"

[method."mvu.DepanAnalyse"]
help = "Measures each frame's whole-picture motion (pan, zoom, rotation) from block motion vectors instead of the image; often steadier than DepanEstimate on busy scenes. Main clip = the video; socket `vectors` (one clip from Analyse). Feed the result to DepanStabilise (mvu) as `data`. Integer clips only."

[method."mvu.DepanAnalyse".docs]
vectors = "One vector clip from Analyse (mvu) of the same video. Connect it to a Clip or filter socket and type `vectors` as its Argument name."
mask = "Optional mask: white areas are trusted for the fit, e.g. to ignore a moving foreground. Connect it to a Clip or filter socket and type `mask` as its Argument name."
zoom = "Also measures zoom. Example: `zoom = False`"
rot = "Also measures rotation. Example: `rot = False`"
pixaspect = "Pixel aspect ratio of the source (1 = square pixels). Example: `pixaspect = 1.0`"
error = "Error limit for accepting the global fit. Example: `error = 15.0`"
info = "Prints the measured or applied values on the frame. Example: `info = True`"
wrong = "Penalty for block vectors that disagree with the global motion. Example: `wrong = 10.0`"
zerow = "Weight given to zero (static) vectors in the fit. Example: `zerow = 0.05`"
thscd1 = "Block difference (SAD, sum of absolute differences, given for an 8x8 block at 8-bit) above which a block counts as changed, for scene-change detection. Higher = fewer scene changes. Example: `thscd1 = 400`"
thscd2 = "Percentage (0 to 100) of changed blocks that makes the frame a scene change; there the frame passes through unprocessed. Example: `thscd2 = 51`"
fields = "Treats the clip as separated fields (interlaced material after SeparateFields). Example: `fields = True`"
tff = "Top field first; only used with `fields = True`. Example: `tff = True`"

[method."mvu.DepanStabilise"]
help = "Removes camera shake: smooths the measured camera path and moves each frame to follow the smooth path, keeping deliberate pans. Main clip = the video; socket `data` (DepanEstimate or DepanAnalyse). Pitfall: shifted frames expose borders; fill them with mirror or hide them with zoom. Integer clips only."

[method."mvu.DepanStabilise".docs]
data = "The global-motion data from DepanEstimate (mvu) or DepanAnalyse (mvu). Connect it to a Clip or filter socket and type `data` as its Argument name."
cutoff = "How fast the stabilised path may follow the real one, in Hz; lower = smoother, more correction. Example: `cutoff = 0.5`"
damping = "Damping of the smoothing; higher = less overshoot. Example: `damping = 0.9`"
initzoom = "Fixed zoom applied to every frame to hide exposed borders. Example: `initzoom = 1.05`"
addzoom = "Adds zoom automatically as needed to hide exposed borders. Example: `addzoom = True`"
prev = "Previous frames used to fit the path. Example: `prev = 0`"
next = "Following frames used to fit the path. Example: `next = 0`"
mirror = "Fills the borders exposed by the shift by mirroring; add 1 top, 2 bottom, 4 left, 8 right. Example: `mirror = 15`"
blur = "Blur width applied to the mirrored border area. Example: `blur = 30`"
dxmax = "Largest horizontal correction in pixels. Example: `dxmax = 60`"
dymax = "Largest vertical correction in pixels. Example: `dymax = 30`"
zoommax = "Largest zoom correction factor. Example: `zoommax = 1.05`"
rotmax = "Largest rotation correction in degrees. Example: `rotmax = 1.0`"
subpixel = "Interpolation when shifting: 0 none, 1 bilinear, 2 bicubic (default). Example: `subpixel = 1`"
pixaspect = "Pixel aspect ratio of the source (1 = square pixels). Example: `pixaspect = 1.0`"
tzoom = "Number of frames over which zoom is smoothed. Example: `tzoom = 3.0`"
info = "Prints the measured or applied values on the frame. Example: `info = True`"
fields = "Treats the clip as separated fields (interlaced material after SeparateFields). Example: `fields = True`"

[method."mvu.DepanCompensate"]
help = "Shifts (and zooms or rotates) each frame by its measured whole-picture motion, scaled by offset: undo or reproduce a camera move, or align neighbouring frames. Main clip = the video; socket `data` (DepanEstimate or DepanAnalyse). Use DepanStabilise (mvu) to remove shake. Integer clips only."

[method."mvu.DepanCompensate".docs]
data = "The global-motion data from DepanEstimate (mvu) or DepanAnalyse (mvu). Connect it to a Clip or filter socket and type `data` as its Argument name."
offset = "How much of the measured motion to apply: 0 = none, 1 = the full move to the next frame, -1 = to the previous one, fractions in between. Example: `offset = -1`"
subpixel = "Interpolation when shifting: 0 none, 1 bilinear, 2 bicubic (default). Example: `subpixel = 1`"
pixaspect = "Pixel aspect ratio of the source (1 = square pixels). Example: `pixaspect = 1.0`"
matchfields = "Keeps fields matched for interlaced material. Example: `matchfields = False`"
mirror = "Fills the borders exposed by the shift by mirroring; add 1 top, 2 bottom, 4 left, 8 right. Example: `mirror = 15`"
blur = "Blur width applied to the mirrored border area. Example: `blur = 30`"
info = "Prints the measured or applied values on the frame. Example: `info = True`"
fields = "Treats the clip as separated fields (interlaced material after SeparateFields). Example: `fields = True`"
tff = "Top field first; only used with `fields = True`. Example: `tff = True`"

[method."edgemasks.Cross"]
help = "Edge mask, diagonal differences only: very thin, dim lines, fastest. White lines on black, full range. The Masks node's Edge mask (edgemask) with Edge detector Cross runs this same plugin and adds thresholds, so prefer it; use this for the bare, fastest call. Example: `scale = 2` for brighter lines."

[method."edgemasks.Cross".docs]
scale = "Multiplies the result; above 1 brightens the lines. One value or one per plane. Example: `scale = 2`"
opt = "CPU code path: 0 automatic (default), 1 plain C, 2 SSE4.1, 3 AVX2, 4 AVX-512. Only for testing. Example: `opt = 1`"

[method."edgemasks.ExKirsch"]
help = "Edge mask, 5x5 compass: the brightest and thickest, catches grain too. White lines on black, full range. The Masks node's Edge mask (edgemask) with Edge detector ExKirsch runs this same plugin and adds thresholds, so prefer it; use this for the bare, fastest call. Example: `scale = 2` for brighter lines."

[method."edgemasks.ExKirsch".docs]
scale = "Multiplies the result; above 1 brightens the lines. One value or one per plane. Example: `scale = 2`"
opt = "CPU code path: 0 automatic (default), 1 plain C, 2 SSE4.1, 3 AVX2, 4 AVX-512. Only for testing. Example: `opt = 1`"

[method."edgemasks.ExPrewitt"]
help = "Edge mask, 5x5 Prewitt: thick lines, among the least grain-sensitive. White lines on black, full range. The Masks node's Edge mask (edgemask) with Edge detector ExPrewitt runs this same plugin and adds thresholds, so prefer it; use this for the bare, fastest call. Example: `scale = 2` for brighter lines."

[method."edgemasks.ExPrewitt".docs]
scale = "Multiplies the result; above 1 brightens the lines. One value or one per plane. Example: `scale = 2`"
opt = "CPU code path: 0 automatic (default), 1 plain C, 2 SSE4.1, 3 AVX2, 4 AVX-512. Only for testing. Example: `opt = 1`"

[method."edgemasks.ExSobel"]
help = "Edge mask, 5x5 Sobel: thick, bright lines, low grain sensitivity. White lines on black, full range. The Masks node's Edge mask (edgemask) with Edge detector ExSobel runs this same plugin and adds thresholds, so prefer it; use this for the bare, fastest call. Example: `scale = 2` for brighter lines."

[method."edgemasks.ExSobel".docs]
scale = "Multiplies the result; above 1 brightens the lines. One value or one per plane. Example: `scale = 2`"
opt = "CPU code path: 0 automatic (default), 1 plain C, 2 SSE4.1, 3 AVX2, 4 AVX-512. Only for testing. Example: `opt = 1`"

[method."edgemasks.FDoG"]
help = "Edge mask, 5x5 smoothed detector: thick lines, low grain sensitivity. White lines on black, full range. The Masks node's Edge mask (edgemask) with Edge detector FDoG runs this same plugin and adds thresholds, so prefer it; use this for the bare, fastest call. Example: `scale = 2` for brighter lines."

[method."edgemasks.FDoG".docs]
scale = "Multiplies the result; above 1 brightens the lines. One value or one per plane. Example: `scale = 2`"
opt = "CPU code path: 0 automatic (default), 1 plain C, 2 SSE4.1, 3 AVX2, 4 AVX-512. Only for testing. Example: `opt = 1`"

[method."edgemasks.Kirsch"]
help = "Edge mask, 3x3 compass (strongest of eight directions): bright, solid lines. White lines on black, full range. The Masks node's Edge mask (edgemask) with Edge detector Kirsch runs this same plugin and adds thresholds, so prefer it; use this for the bare, fastest call. Example: `scale = 2` for brighter lines."

[method."edgemasks.Kirsch".docs]
scale = "Multiplies the result; above 1 brightens the lines. One value or one per plane. Example: `scale = 2`"
opt = "CPU code path: 0 automatic (default), 1 plain C, 2 SSE4.1, 3 AVX2, 4 AVX-512. Only for testing. Example: `opt = 1`"

[method."edgemasks.Kroon"]
help = "Edge mask, 3x3 accuracy-tuned: thin lines, a bit brighter than Sobel. White lines on black, full range. The Masks node's Edge mask (edgemask) with Edge detector Kroon runs this same plugin and adds thresholds, so prefer it; use this for the bare, fastest call. Example: `scale = 2` for brighter lines."

[method."edgemasks.Kroon".docs]
scale = "Multiplies the result; above 1 brightens the lines. One value or one per plane. Example: `scale = 2`"
opt = "CPU code path: 0 automatic (default), 1 plain C, 2 SSE4.1, 3 AVX2, 4 AVX-512. Only for testing. Example: `opt = 1`"

[method."edgemasks.Prewitt"]
help = "Edge mask, classic 3x3: thin, clean lines. White lines on black, full range. The Masks node's Edge mask (edgemask) with Edge detector Prewitt runs this same plugin and adds thresholds, so prefer it; use this for the bare, fastest call. Example: `scale = 2` for brighter lines."

[method."edgemasks.Prewitt".docs]
scale = "Multiplies the result; above 1 brightens the lines. One value or one per plane. Example: `scale = 2`"
opt = "CPU code path: 0 automatic (default), 1 plain C, 2 SSE4.1, 3 AVX2, 4 AVX-512. Only for testing. Example: `opt = 1`"

