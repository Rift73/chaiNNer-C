help = "Edge mask, classic 3x3: thin, clean lines; the usual first choice. White lines on black, full range. The Masks node's Edge mask (edgemask) with Edge detector Sobel runs this same plugin and adds thresholds, so prefer it; use this for the bare, fastest call. Example: `scale = 2` for brighter lines."

[method."edgemasks.Sobel".docs]
scale = "Multiplies the result; above 1 brightens the lines. One value or one per plane. Example: `scale = 2`"
opt = "CPU code path: 0 automatic (default), 1 plain C, 2 SSE4.1, 3 AVX2, 4 AVX-512. Only for testing. Example: `opt = 1`"

[method."edgemasks.Tritical"]
help = "Edge mask, plain pixel difference from TCanny: thinnest, dim lines. White lines on black, full range. The Masks node's Edge mask (edgemask) with Edge detector Tritical runs this same plugin and adds thresholds, so prefer it; use this for the bare, fastest call. Example: `scale = 2` for brighter lines."

[method."edgemasks.Tritical".docs]
scale = "Multiplies the result; above 1 brightens the lines. One value or one per plane. Example: `scale = 2`"
opt = "CPU code path: 0 automatic (default), 1 plain C, 2 SSE4.1, 3 AVX2, 4 AVX-512. Only for testing. Example: `opt = 1`"

[method."hysteresis.Hysteresis"]
help = "Grows a seed mask into whole shapes: keeps every connected white area of Candidate mask that touches a white pixel of the main clip (the seed), drops the rest. Use it to turn a strict, spotty mask into complete shapes, e.g. full subtitle letters from a few sure pixels. Pitfall: both must be black-and-white masks of the same format."

[method."hysteresis.Hysteresis".docs]
clipb = "The wider black-and-white mask whose areas are kept where they touch the seed; same format as the main clip."

[method."atwt.ExtractFrequency"]
help = "Splits off fine detail with an a trous wavelet: the output is the picture minus a blur of it, grey-centred like a difference clip. Use it to separate detail from colour or light, e.g. fix colour from one clip while keeping another's detail. The Denoise node's Only what DFTTest removes (extract_freq) does a similar split by frequency."

[method."atwt.ExtractFrequency".docs]
radius = "Wavelet scale: the blur reaches 2 to the power (radius - 1) pixels apart; higher = coarser detail layer. Example: `radius = 2`"

[method."atwt.ReplaceFrequency"]
help = "Adds a detail layer back onto a base picture (base + detail - grey). The reverse of ExtractFrequency (atwt): main clip = the base; socket `detail` = the detail layer, usually from another clip. Example: detail of the filtered clip on the colours of the source."

[method."atwt.ReplaceFrequency".docs]
detail = "The detail layer, usually from ExtractFrequency (atwt). Connect it to a Clip or filter socket and type `detail` as its Argument name."

[method."awarp.AWarp"]
help = "Warp sharpening, the second half of aWarpSharp: moves pixels towards edges along a supplied edge mask, thinning lines. The Sharpen and Blur node's Sharpen lines by warping (awarpsharp) builds the mask and calls this for you, so prefer it. Main clip = the video; socket `mask` (an edge mask of the same format)."

[method."awarp.AWarp".docs]
mask = "Edge mask of the same format, same size or a quarter of the clip's size (clip upscaled 4x). Usually a blurred Sobel mask. Connect it to a Clip or filter socket and type `mask` as its Argument name."
depth_h = "How far to warp horizontally; negative values blur instead. Example: `depth_h = 3`"
depth_v = "How far to warp vertically; defaults to depth_h. Example: `depth_v = 3`"
mask_first_plane = "Uses the luma mask to warp all planes (default for YUV); off = each plane uses its own mask plane. Example: `mask_first_plane = False`"

[method."deblock.Deblock"]
help = "Smooths 8x8 block edges with the H.264 deblocking filter, for blocky low-bitrate or MPEG-2 sources. Deblock (deblock_qed) in this node is a gentler, block-aware variant built on it. Example: Strength `30` for heavier blocking. Pitfall: strong values soften detail along the block grid."

[method."deblock.Deblock".docs]
quant = "Strength, 0 to 60; higher = stronger. Empty = 25. Nothing happens while Strength plus an offset is below 16. Example: `30`"
aoffset = "Shifts the block-edge detection threshold; higher = more edges treated. Example: `2`"
boffset = "Shifts detection and strength together; higher = stronger. Example: `2`"
opt = "CPU code path: 0 automatic (default), 1 plain C, 2 SSE4.1. Only for testing. Example: `1`"

[method."dmetrics.DMetrics"]
help = "Measures field-match quality (Decomb Telecide's metrics) and stores it as the frame properties MMetrics and VMetrics, mainly for the Wobbly IVTC editor. The Deinterlace node's Field metrics for Wobbly (dmetrics) handles the format and field order for you. Pitfall: this bare call takes 8-bit 4:2:0 only."

[method."dmetrics.DMetrics".docs]
tff = "Field order: `tff = True` for top field first. Example: `tff = True`"
chroma = "Includes the colour planes when judging combing. Example: `chroma = False`"
nt = "Noise tolerance; higher ignores more small differences. Example: `nt = 10`"
y0 = "First row of a band left out of the matching (e.g. subtitles); same as y1 = off. Example: `y0 = 900`"
y1 = "Last row of that band. Example: `y1 = 1080`"
prefix = "Text added in front of the property names (MMetrics becomes XMMetrics). Example: `prefix = 'X'`"

[method."vivtc.VFM"]
help = "Field matching, first step of inverse telecine: rebuilds the original progressive frames from telecined video by pairing the right fields. Follow it with VDecimate (vivtc). The Deinterlace node's Detelecine step 1: field match (VFM) converts formats and can fix leftover combed frames, so prefer it. Pitfall: 8-bit only here; order must be typed."

[method."vivtc.VFM".docs]
order = "Field order, required: `order = 1` top field first, `order = 0` bottom field first. Example: `order = 1`"
field = "Field to match from: 0 bottom, 1 top, 2 and 3 follow the clip's field order property (default 2). Example: `field = 2`"
mode = "Matching strategy, 0 to 5: 0 safest 2-way, 1 default (adds a third match on combed frames), up to 5 most thorough but most risk of jerky duplicates. Example: `mode = 0`"
mchroma = "Includes chroma when comparing matches; turn off for sources with rainbowing. Example: `mchroma = False`"
cthresh = "How visible combing must be to count, -1 to 255; 8 to 12 is good. Default 9. Example: `cthresh = 10`"
mi = "How many combed pixels in one block make the frame combed. Default 80. Example: `mi = 64`"
chroma = "Includes chroma in the combed-frame decision. Example: `chroma = False`"
blockx = "Width of the combing-detection block, a power of 2 from 4 to 512. Example: `blockx = 16`"
blocky = "Height of the combing-detection block, a power of 2 from 4 to 512. Example: `blocky = 16`"
y0 = "First row of a band ignored for matching (subtitles, logo); equal to y1 = off. Example: `y0 = 900`"
y1 = "Last row of that band. Example: `y1 = 1060`"
scthresh = "Scene-change threshold, percent of maximum luma change; 8 to 14 is good. Example: `scthresh = 12`"
micmatch = "Uses combing values to choose matches: 0 never, 1 around scene changes (default), 2 everywhere. Example: `micmatch = 2`"
micout = "Computes combing values for all five matches, not only those of the mode. Example: `micout = True`"
clip2 = "Optional full-quality clip: matching is computed on the main clip, but the output fields are taken from this one (works around the 8-bit limit). Connect it to a Clip or filter socket and type `clip2` as its Argument name."

[method."vivtc.VDecimate"]
help = "Drops one frame in every cycle, the likeliest duplicate: the second step of inverse telecine after VFM (vivtc), turning 29.97 into 23.976 fps. The Deinterlace node's Detelecine step 2: drop repeats (VDecimate) also handles other bit depths. Example: `cycle = 5`."

[method."vivtc.VDecimate".docs]
cycle = "One frame is dropped in every cycle frames. Example: `cycle = 5`"
chroma = "Includes chroma in the duplicate comparison. Example: `chroma = False`"
dupthresh = "Difference below which a frame counts as a duplicate, percent of a block's maximum change. Example: `dupthresh = 1.1`"
scthresh = "Scene-change threshold, percent of maximum luma change; 10 to 15 is good. Example: `scthresh = 15`"
blockx = "Width of the comparison blocks, a power of 2 from 4 to 512; larger = more noise-robust, misses small motion. Example: `blockx = 32`"
blocky = "Height of the comparison blocks, a power of 2 from 4 to 512. Example: `blocky = 32`"
clip2 = "Optional clip the frames are dropped from, while the decision uses the main clip. Connect it to a Clip or filter socket and type `clip2` as its Argument name."
ovr = "Text file with manual overrides of which frames are dropped. Example: `ovr = 'C:/ivtc/overrides.txt'`"
dryrun = "Drops nothing; only writes VDecimateDrop and the difference values as frame properties, to inspect. Example: `dryrun = True`"

[method."std.AverageFrames"]
help = "Weighted average of frames: with one clip, of neighbouring frames (a simple temporal blur); with several, of the same frame across clips (e.g. merging several captures of a tape). Connect the clip as the main clip. Example: `weights = [1, 1, 1]` averages three frames."

[method."std.AverageFrames".docs]
weights = "Weight per frame (one clip: an odd count, centred on the current frame, up to 31) or per clip. Integers for integer clips. Example: `weights = [1, 2, 1]`"
scale = "Divisor of the weighted sum; default the sum of the weights. Example: `scale = 4`"
scenechange = "One clip only: does not average across scene changes (reads the scene-change frame properties). Example: `scenechange = True`"

[method."std.GPUUpload"]
help = "Moves frames to the GPU (the core's Vulkan device) for GPU filters. VapourSynth inserts this by itself when needed, so use it only to choose where in the chain the transfer happens."

[method."std.GPUDownload"]
help = "Brings frames from the GPU back to the CPU for CPU filters. Does nothing if the clip is already on the CPU."

[method."std.PEMVerifier"]
help = "Checks that every pixel lies inside an allowed range and raises an error naming the first bad pixel; a debugging aid for filter output. Example: `upper = [235, 240, 240]`."

[method."std.PEMVerifier".docs]
upper = "Highest allowed value per plane, in the clip's own values; default the format's maximum. Example: `upper = [235, 240, 240]`"
lower = "Lowest allowed value per plane, in the clip's own values; default the format's minimum. Example: `lower = [16, 16, 16]`"

[method."std.PreMultiply"]
help = "Multiplies a clip by its alpha (transparency) clip, which gives cleaner edges when resizing and is the form Merge through a mask (Planes) can take with premultiplied on. Main clip = the picture; socket `alpha` = its grey alpha clip."

[method."std.PreMultiply".docs]
alpha = "The alpha clip, grey, same size and bit depth as the main clip. Connect it to a Clip or filter socket and type `alpha` as its Argument name."

[method."text.Text"]
help = "Prints a fixed text on every frame with a simple built-in font, for labels when comparing clips. Example: `text = 'Filtered'`. For styled text use Subtitle (sub). Pitfall: Latin characters only (Windows-1252)."

[method."text.Text".docs]
text = "The text to print. Example: `text = 'Filtered'`"
alignment = "Position by numpad key: 7 top-left (default), 8 top, 9 top-right, 4 left, 5 centre, 6 right, 1 bottom-left, 2 bottom, 3 bottom-right. Example: `alignment = 8`"
scale = "Integer enlargement of the 8x16 bitmap font. Example: `scale = 2`"

[method."text.ClipInfo"]
help = "Prints the clip's details on each frame: format, size, frame count, frame rate. A quick check of what a chain produces."

[method."text.ClipInfo".docs]
alignment = "Position by numpad key: 7 top-left (default), 8 top, 9 top-right, 4 left, 5 centre, 6 right, 1 bottom-left, 2 bottom, 3 bottom-right. Example: `alignment = 8`"
scale = "Integer enlargement of the 8x16 bitmap font. Example: `scale = 2`"

[method."text.CoreInfo"]
help = "Prints VapourSynth's version, thread count and cache size on the frame (on a blank clip when none is connected)."

[method."text.CoreInfo".docs]
alignment = "Position by numpad key: 7 top-left (default), 8 top, 9 top-right, 4 left, 5 centre, 6 right, 1 bottom-left, 2 bottom, 3 bottom-right. Example: `alignment = 8`"
scale = "Integer enlargement of the 8x16 bitmap font. Example: `scale = 2`"

[method."text.FrameNum"]
help = "Prints each frame's number on it, to find frame numbers for trims, ranges and overrides."

[method."text.FrameNum".docs]
alignment = "Position by numpad key: 7 top-left (default), 8 top, 9 top-right, 4 left, 5 centre, 6 right, 1 bottom-left, 2 bottom, 3 bottom-right. Example: `alignment = 8`"
scale = "Integer enlargement of the 8x16 bitmap font. Example: `scale = 2`"

[method."text.FrameProps"]
help = "Prints the frame properties of each frame on it (field order, scene changes, metrics ...), to see what earlier filters set. Example: `props = ['_FieldBased', '_Combed']` limits the list."

[method."text.FrameProps".docs]
props = "Names of the properties to show; default all. Example: `props = ['_Combed']`"
alignment = "Position by numpad key: 7 top-left (default), 8 top, 9 top-right, 4 left, 5 centre, 6 right, 1 bottom-left, 2 bottom, 3 bottom-right. Example: `alignment = 8`"
scale = "Integer enlargement of the 8x16 bitmap font. Example: `scale = 2`"

[method."sub.TextFile"]
help = "Burns a subtitle file (ASS, SRT and other text formats) into the video with libass, with its fonts and styling. Use it for hardsubbing or previews. Example: `file = 'C:/subs/ep01.ass'`. Pitfall: fonts the file names must be installed or in fontdir."

[method."sub.TextFile".docs]
file = "Path of the subtitle file. Example: `file = 'C:/subs/ep01.ass'`"
charset = "Character set of the file; default UTF-8. Example: `charset = 'CP1252'`"
scale = "Font scale. Example: `scale = 1.5`"
style = "ASS style line for formats without styles (SRT); no effect on ASS files. Example: `style = 'Arial,48,&H00FFFFFF,&H000000FF,&H00000000,&H00000000,0,0,0,0,100,100,0,0,1,2,0,2,10,10,40,1'`"
debuglevel = "How much libass reports in the log, 0 (default) to more. Example: `debuglevel = 5`"
fontdir = "Folder with extra fonts. Example: `fontdir = 'C:/fonts'`"
linespacing = "Extra space between lines in pixels. Example: `linespacing = 4`"
margins = "Extra margins in pixels: top, bottom, left, right. Example: `margins = [0, 40, 0, 0]`"
sar = "Pixel aspect ratio to render for; 0 (default) reads it from each frame, 1 = square pixels. Example: `sar = 1`"
blend = "On (default) burns the text into the clip. Off returns the subtitle picture alone with its transparency in the `_Alpha` property. Example: `blend = False`"
matrix = "Colour matrix of the clip as a number, overriding its frame property (only when blending). Example: `matrix = 1`"
matrix_s = "Same as a name. Example: `matrix_s = '709'`"
transfer = "Transfer of the clip as a number (only when blending); `transfer = 1` with `primaries = 1` turns colour conversion off. Example: `transfer = 1`"
transfer_s = "Same as a name. Example: `transfer_s = '709'`"
primaries = "Colour primaries of the clip as a number (only when blending). Example: `primaries = 1`"
primaries_s = "Same as a name. Example: `primaries_s = '709'`"

[method."sub.Subtitle"]
help = "Burns a line of text into the video with libass styling (font, outline, position, ASS tags), between two frames. Nicer than Text (text) for titles or labels. Example: `text = 'Episode 1'` with `start = 0` and `end = 120`."

[method."sub.Subtitle".docs]
text = "The text, may contain ASS tags. Example: `text = '{\\an8}Episode 1'`"
start = "First frame showing it. Example: `start = 0`"
end = "Frame where it stops; default the clip's end. Example: `end = 120`"
style = "ASS style line (font, size, colours, outline, alignment, margins). Example: `style = 'Arial,48,&H00FFFFFF,&H000000FF,&H00000000,&H00000000,0,0,0,0,100,100,0,0,1,2,0,2,10,10,40,1'`"
debuglevel = "How much libass reports in the log, 0 (default) to more. Example: `debuglevel = 5`"
fontdir = "Folder with extra fonts. Example: `fontdir = 'C:/fonts'`"
linespacing = "Extra space between lines in pixels. Example: `linespacing = 4`"
margins = "Extra margins in pixels: top, bottom, left, right. Example: `margins = [0, 40, 0, 0]`"
sar = "Pixel aspect ratio to render for; 0 (default) reads it from each frame, 1 = square pixels. Example: `sar = 1`"
blend = "On (default) burns the text into the clip. Off returns the subtitle picture alone with its transparency in the `_Alpha` property. Example: `blend = False`"
matrix = "Colour matrix of the clip as a number, overriding its frame property (only when blending). Example: `matrix = 1`"
matrix_s = "Same as a name. Example: `matrix_s = '709'`"
transfer = "Transfer of the clip as a number (only when blending); `transfer = 1` with `primaries = 1` turns colour conversion off. Example: `transfer = 1`"
transfer_s = "Same as a name. Example: `transfer_s = '709'`"
primaries = "Colour primaries of the clip as a number (only when blending). Example: `primaries = 1`"
primaries_s = "Same as a name. Example: `primaries_s = '709'`"

[method."sub.ImageFile"]
help = "Burns picture-based subtitles (VobSub .idx/.sub from DVDs, PGS .sup from Blu-rays) into the video. Example: `file = 'C:/subs/movie.idx'`. Use `info = True` to list the tracks."

[method."sub.ImageFile".docs]
file = "Path of the subtitle file; for VobSub the .idx, with the .sub beside it. Example: `file = 'C:/subs/movie.idx'`"
id = "Subtitle track to render; -1 (default) = the first one. Example: `id = 2`"
palette = "Replacement colours, up to 256 numbers packed as alpha, red, green, blue. Example: `palette = [0xFF000000, 0xFFFFFFFF]`"
gray = "Turns the subtitles grey. Example: `gray = True`"
info = "Prints the available tracks (id, language, size) on each frame. Example: `info = True`"
flatten = "Outputs exactly one frame per subtitle picture instead of following the clip; blend then has no effect. Example: `flatten = True`"
blend = "On (default) burns the text into the clip. Off returns the subtitle picture alone with its transparency in the `_Alpha` property. Example: `blend = False`"
matrix = "Colour matrix of the clip as a number, overriding its frame property (only when blending). Example: `matrix = 1`"
matrix_s = "Same as a name. Example: `matrix_s = '709'`"
transfer = "Transfer of the clip as a number (only when blending); `transfer = 1` with `primaries = 1` turns colour conversion off. Example: `transfer = 1`"
transfer_s = "Same as a name. Example: `transfer_s = '709'`"
primaries = "Colour primaries of the clip as a number (only when blending). Example: `primaries = 1`"
primaries_s = "Same as a name. Example: `primaries_s = '709'`"
