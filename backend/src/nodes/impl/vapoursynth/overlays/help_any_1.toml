prefix = "Name prefix of the frame properties that carry the vectors. Must be the same on the super, vector and consumer calls; only change it to run two analyses on one clip. Example: `prefix = 'B'`"

[method."mvu.OcclusionMask"]
help = "Mask of covered and revealed areas: brighter where the motion field pulls apart or piles up, the places interpolation gets wrong. Connect one vector clip from Analyse as the main clip. Use it to blend a fallback in over interpolation artefacts."

