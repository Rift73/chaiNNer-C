# Any Function, part 1: mvu, edgemasks, hysteresis, std, text, sub, atwt, awarp, deblock, dmetrics, vivtc.
# Arguments here are typed as `name = value` rows; clips go in a Clip or filter socket with their name.

[method."mvu.Super"]
help = "First step of every MVUtensils chain: prepares a clip for motion search (padding, sub-pixel planes, a pyramid). Its output only feeds Analyse, AnalyseMany and the other mvu methods. For plain denoising, the Denoise node's Denoise moving grain (mc_degrain) does the whole chain. Pitfall: type `blksize = 8` and `overlap = 4`; both are required."

[method."mvu.Super".docs]
blksize = "Block size in pixels, one value or `[h, v]`; required. Must match the block size used in Analyse. 8 or 16 is usual. Example: `blksize = 8`"
overlap = "Block overlap in pixels, at most half of blksize; required. Example: `overlap = 4`"
pad = "Border padding in pixels, one value or `[h, v]`. Example: `pad = [16, 16]`"
onelevel = "Builds only the finest level. Use for a super that only feeds Degrain, Compensate, Flow or Recalculate (saves memory); Analyse needs the full pyramid. Example: `onelevel = True`"
sharp = "Sub-pixel interpolation: 0 bilinear, 1 bicubic, 2 Wiener (sharpest, default). Example: `sharp = 1`"
rfilter = "Filter used to shrink the pyramid levels: 0 average, 1 bilinear (default), 2 cubic. Example: `rfilter = 2`"
pel = "Motion precision: 1 full pixel, 2 half pixel (default), 4 quarter pixel. Higher = more accurate, more memory and time. Example: `pel = 1`"
pelclip = "Optional ready-made upscaled clip used for the sub-pixel planes instead of the built-in interpolation. Connect it to a Clip or filter socket and type `pelclip` as its Argument name."
prefix = "Name prefix of the frame properties that carry the vectors. Must be the same on the super, vector and consumer calls; only change it to run two analyses on one clip. Example: `prefix = 'B'`"

[method."mvu.Analyse"]
help = "Finds motion vectors between each frame and one other frame (direction and distance from delta). Connect the Super (mvu) output as the main clip. Use it when a method needs one vector clip (Compensate, Flow, masks, SCDetection); for Degrain and the Flow interpolators AnalyseMany gives the whole list. Example: `delta = -1` for forward vectors."

[method."mvu.Analyse".docs]
blksize = "Block size in pixels, one value or `[h, v]`; defaults to the super clip's. Smaller = finer motion, slower. Example: `blksize = 16`"
overlap = "Block overlap, at most half the block size; defaults to the super clip's. More = smoother vectors, slower. Example: `overlap = 8`"
levels = "How many levels of the coarse-to-fine search pyramid to use; 0 = all. Example: `levels = 0`"
search = "Search pattern: 0 diamond, 1 exhaustive, 2 hexagon (default), 3 uneven multi-hexagon (most thorough of the fast ones), 4 horizontal only, 5 vertical only. Example: `search = 3`"
searchparam = "Search radius or step of that pattern. Higher = finds larger motion, slower. Example: `searchparam = 2`"
pelsearch = "Search radius at the finest, sub-pixel level; defaults to the super clip's pel. Example: `pelsearch = 2`"
mvlambda = "How strongly each block's vector is pulled towards its neighbours. High (default 1000) = smooth, true motion for interpolation; 0 = best match per block, often better for denoising. Example: `mvlambda = 0`"
chroma = "Includes the colour planes when comparing blocks. Example: `chroma = False`"
delta = "Which frame to match and in which direction: positive = past frames (backward), negative = future frames (forward); 2 means two frames away. Example: `delta = -1`"
lsad = "Block difference above which the smoothness pull (mvlambda) is relaxed, so poorly matching blocks may search freely. No effect when mvlambda is 0. Example: `lsad = 400`"
plevel = "How the smoothness pull grows at the coarse levels: 0 constant, 1 linear (default), 2 quadratic. Example: `plevel = 2`"
globalmv = "Also estimates one whole-frame (camera pan) vector and tries it for every block. Example: `globalmv = False`"
pnew = "Penalty, out of 256, a newly found vector must overcome to replace the predicted one. Higher = steadier vectors. Example: `pnew = 50`"
pzero = "Same penalty for choosing the zero (no motion) vector; defaults to pnew. Example: `pzero = 0`"
pglobal = "Same penalty for choosing the whole-frame vector. Example: `pglobal = 0`"
badsad = "Block difference above which a block gets a second, wider search. Example: `badsad = 10000`"
badrange = "Radius of that wider search in pixels. Example: `badrange = 24`"
meander = "Scans block rows alternately left-to-right and right-to-left, which reuses neighbour vectors better. Example: `meander = False`"
trymany = "Tries several candidate vectors per block: 0 off, 1 on all but the finest level, 2 everywhere. Slower, occasionally better. Example: `trymany = 1`"
fields = "Treats the clip as separated fields (interlaced material after SeparateFields). Example: `fields = True`"
tff = "Top field first; only used with `fields = True`. Example: `tff = True`"
satd = "Compares blocks with SATD (transform-based, closer to visible difference) instead of plain SAD. Slower. Example: `satd = True`"
prefix = "Name prefix of the frame properties that carry the vectors. Must be the same on the super, vector and consumer calls; only change it to run two analyses on one clip. Example: `prefix = 'B'`"

[method."mvu.AnalyseMany"]
help = "Finds all the motion vectors Degrain and the Flow interpolators need, in the right order: backward and forward for distances 1 to radius. Connect the Super (mvu) output as the main clip and wire the result to a socket named `vectors`. Example: `radius = 2` gives four vector clips."

