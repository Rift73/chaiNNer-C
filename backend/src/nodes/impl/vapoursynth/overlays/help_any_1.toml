help = "Edge mask, 3x3 compass with Sobel weights: thin, Sobel-like lines. White lines on black, full range. The Masks node's Edge mask (edgemask) with Edge detector Robinson5 runs this same plugin and adds thresholds, so prefer it; use this for the bare, fastest call. Example: `scale = 2` for brighter lines."

