prefix = "Name prefix of the frame properties that carry the vectors. Must be the same on the super, vector and consumer calls; only change it to run two analyses on one clip. Example: `prefix = 'B'`"

[method."mvu.VectorLengthMask"]
help = "Motion mask: brighter where the motion vectors are longer, so moving areas are white and static ones black. Connect one vector clip from Analyse as the main clip. Use it as the Mask of Merge through a mask (Planes) to filter only static or only moving parts. Output is grey at the vectors' bit depth."

[method."mvu.VectorLengthMask".docs]
ml = "Value that maps to full white; lower = brighter mask. Example: `ml = 50`"
gamma = "Gamma curve of the mask; below 1 brightens weak values. Example: `gamma = 0.5`"
time = "Time position used to project the vectors, 0 to 100. Example: `time = 50`"
scval = "Mask value written on scene-change frames, in the mask's own values (8-bit: 0 to 255). Example: `scval = 255`"
thscd1 = "Block difference (SAD, sum of absolute differences, given for an 8x8 block at 8-bit) above which a block counts as changed, for scene-change detection. Higher = fewer scene changes. Example: `thscd1 = 400`"
thscd2 = "Percentage (0 to 100) of changed blocks that makes the frame a scene change; there the frame passes through unprocessed. Example: `thscd2 = 51`"
prefix = "Name prefix of the frame properties that carry the vectors. Must be the same on the super, vector and consumer calls; only change it to run two analyses on one clip. Example: `prefix = 'B'`"

[method."mvu.SADMask"]
help = "Mask of poor motion matches: brighter where a block matched its reference badly (new objects, fast motion, flashes). Connect one vector clip from Analyse as the main clip. Use it to keep a temporal filter away from those areas via Merge through a mask (Planes)."

