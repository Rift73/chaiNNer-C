[method."vsscale.Rescale.default_credit_mask"]
help = "Marks credits and other overlays that were added after the upscale: descales and rescales the clip with the given kernel and height, and shows where the result differs. Feed it to Areas to leave out of Descale: undo an upscale (descale) or a masked merge. Example: Kernel Bilinear, Height `720`."

[method."vsscale.Rescale.default_credit_mask".docs]
height = "The height the source was made at, before its upscale. A fraction descales to a fractional size. Example: `720`"
kernel = "The kernel that made the source's upscale. Example: Bilinear."
upscaler = "Scaler that doubles the descaled clip before it is brought back to size. Starts at Catrom; ArtCNN is sharper but needs vs-mlrt and its downloaded model."
downscaler = "Scaler that brings the doubled clip back to the source size. Default = Hermite in linear light."
width = "Width the source was made at. Empty = worked out from Height and the aspect ratio."
base_height = "Whole-number height around a fractional descale. Empty = worked out from Height."
base_width = "Whole-number width around a fractional descale. Empty = worked out from Width."
crop = "Pixels cropped before the descale, as `(left, right, top, bottom)`. Example: `(0, 0, 138, 138)`"
shift = "Fraction-of-a-pixel offset of the original upscale, as (top, left). Example: `(0.25, 0)`"
field_based = "Top field first (TFF) or Bottom field first (BFF) for cross-converted (upscaled while interlaced) sources; As the video says reads the clip's tag."
border_handling = "How the edges are padded: `0` mirror, `1` black (zero), `2` repeat the last row. Change it only when undoing a scale that padded that way. Example: `0`"
sample_grid_model = "`0` lines up the outer edges of the pictures (normal); `1` lines up the centres of the outer pixels, as some programs do. Example: `1`"
thr = "How big a difference counts as credits. Lower = catches more, also noise. Example: `0.216`"
expand = "Pixels the mask grows by around what it found. Example: `4`"
ranges = "Frames to build the mask for; other frames get an empty mask. Example: `100-250, 3000-3120`"
stabilize = "Smooths the mask over time so it does not flicker; works only with Ranges."
scenechanges = "Frame numbers of scene changes, used by Stabilize. Example: `120, 480`"
rescale = "Rescaled clip to compare with. Empty = the one made from Kernel and Height."
src = "Source clip to compare with. Empty = the main clip."

