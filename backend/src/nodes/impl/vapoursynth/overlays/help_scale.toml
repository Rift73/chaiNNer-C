left = "Pixels added on the left. Example: `16`"
right = "Pixels added on the right. Example: `16`"
top = "Pixels added at the top. Example: `16`"
bottom = "Pixels added at the bottom. Example: `16`"
input_width = "Not used by this method; only Crop padding back off (Padder crop) reads it."
input_height = "Not used by this method; only Crop padding back off (Padder crop) reads it."
