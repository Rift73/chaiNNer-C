[method."vskernels.*.resample"]
help = "Converts the clip to another format (YUV to RGB, 4:2:0 to 4:4:4, bit depth), using the chosen kernel for the colour planes it scales. Example: Format from an RGB clip turns YUV into RGB. Wrong matrix tags give wrong colours."

[method."vskernels.*.resample".docs]
b = "Bicubic's blur term. Higher = softer and blurrier, less ringing; 0 to 1 is usual. Example: `0.333`"
c = "Bicubic's sharpness term. Higher = sharper with more ringing; 0 to 1 is usual. Example: `0.5`"
taps = "How many lobes the kernel has. More = sharper with more ringing and slower; 2 to 4 is usual. Example: `3`"
sigma = "Width of the Gaussian curve. Higher = blurrier; 0.3 to 1 is usual. Example: `0.5`"
cutoff = "Distance in pixels beyond which the kernel gives 0, even inside Taps. Empty = no cut. Example: `2.5`"
format = "The output format (colour family, subsampling, bit depth).\n\nExample: YUV444P16"
matrix = "Matrix of the output (how YUV maps to RGB). Default = from the clip's tags. Example: BT.709 (1) for HD."
matrix_in = "Matrix the input really uses, when its tag is missing or wrong. Default = the clip's tag."
transfer = "Transfer (gamma curve) of the output. Default = unchanged."
transfer_in = "Transfer the input really uses, when its tag is missing or wrong."
primaries = "Colour primaries of the output. Default = unchanged."
primaries_in = "Primaries the input really uses, when its tag is missing or wrong."
range = "Output range: Limited (16-235 in 8-bit, normal for video) or Full (0-255). Default = unchanged."
range_in = "Range the input really uses, when its tag is missing or wrong."
chromaloc = "Where the colour samples sit relative to the brightness samples in the output. Left is normal for HD and DVD, Top left for UHD."
chromaloc_in = "Where the input's colour samples really sit, when its tag is missing or wrong."

