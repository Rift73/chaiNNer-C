[method."vskernels.*.descale"]
help = "Undoes an upscale: computes the picture at the size it was made at (e.g. 720p anime released as 1080p), which a normal downscale cannot. The kernel and size must match the ones that made the upscale, or the result rings and loses detail. Example: Bilinear at 1280x720. Needs a 32-bit float clip. Wrong guesses look worse than plain scaling."

[method."vskernels.*.descale".docs]
b = "Bicubic's blur term. Higher = softer and blurrier, less ringing; 0 to 1 is usual. Example: `0.333`"
c = "Bicubic's sharpness term. Higher = sharper with more ringing; 0 to 1 is usual. Example: `0.5`"
taps = "How many lobes the kernel has. More = sharper with more ringing and slower; 2 to 4 is usual. Example: `3`"
sigma = "Width of the Gaussian curve. Higher = blurrier; 0.3 to 1 is usual. Example: `0.5`"
cutoff = "Distance in pixels beyond which the kernel gives 0, even inside Taps. Empty = no cut. Example: `2.5`"
blur = "The blur (kernel stretch) the original upscale used. Empty = 1, none. Example: `1.05` for Adobe's Bicubic Sharper."
width = "The width the picture was made at, before it was upscaled. Empty keeps the clip's width (nothing is undone). Example: `1280`"
height = "The height the picture was made at, before it was upscaled, as found with a descale test. Empty keeps the clip's height (nothing is undone). Example: `720`"
linear = "Undoes the upscale in linear light. Only right when the source was upscaled in linear light; most were not. Default = only when Sigmoid light is on."
sigmoid = "Undoes an upscale that was made on a sigmoid curve. Tick for the usual curve (6.5, 0.75); most sources were not made that way."
shift = "Fraction-of-a-pixel offset the original upscale had, as (top, left). Leave (0, 0) unless the source was shifted. Example: `(0.25, 0)`"
border_handling = "How the edges are padded: `0` mirror, `1` black (zero), `2` repeat the last row. Change it only when undoing a scale that padded that way. Example: `0`"
sample_grid_model = "`0` lines up the outer edges of the pictures (normal); `1` lines up the centres of the outer pixels, as some programs do. Example: `1`"
field_based = "As the video says reads the clip's tag. Top field first (TFF) or Bottom field first (BFF) descales each field on its own and weaves them back, for cross-converted (upscaled while interlaced) sources; Height must then be even."
ignore_mask = "A mask clip: white areas (credits, overlays added after the upscale) are left out of the descale calculation. Wire a mask from the Masks node."

