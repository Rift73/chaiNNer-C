shift = "Fraction-of-a-pixel offset of the original upscale, as (top, left). Example: `(0.25, 0)`"
field_based = "Top field first (TFF) or Bottom field first (BFF) for cross-converted (upscaled while interlaced) sources; As the video says reads the clip's tag."
border_handling = "How the edges are padded: `0` mirror, `1` black (zero), `2` repeat the last row. Change it only when undoing a scale that padded that way. Example: `0`"
