help = "Rotates the picture 90 degrees clockwise; width and height swap."

[method."vsaa.BWDIF.deinterlace"]
help = "Deinterlaces with BWDIF (motion-adaptive: keeps still areas sharp, interpolates moving ones); Double rate on doubles the frame rate, off keeps it. Fast and decent. Needs the field order."

[method."vsaa.BWDIF.deinterlace".docs]
tff = "Field order. Default reads the clip's tag and stops if the clip says it is progressive or does not say. Yes = top field first (TFF), No = bottom field first (BFF). Example: Yes"
double_rate = "On: one frame per field, so the frame rate doubles (50i becomes 50p). Off: one frame per frame, half the fields dropped."
edeint = "Clip (or deinterlacer) whose result BWDIF uses for its spatial guess instead of cubic interpolation. Example: an NNEDI3 deinterlace; it must have as many frames as the output."

[method."vsaa.EEDI3.antialias"]
help = "Removes jaggies by rebuilding every other line with EEDI3, which follows edge directions: best at joining long thin lines, slower than NNEDI3, can draw artefacts on busy detail. Example: on aliased anime lines. Pick a GPU backend if you have one."

[method."vsaa.EEDI3.antialias".docs]
alpha = "Weight given to joining similar areas along lines, 0 to 1. Higher connects more lines, can join wrong ones. Alpha plus Beta must not exceed 1. Example: `0.2`"
beta = "Weight given to keeping the vertical difference small, 0 to 1. Higher = less line-following; 1 turns it off. Example: `0.25`"
gamma = "Penalty for changing direction between neighbours. Higher = smoother, steadier lines but softer edges; 10 to 50 is usual. Example: `20`"
nrad = "Radius of the neighbourhood compared, 0 to 3. Larger joins lines better, slower. Example: `2`"
mdis = "Farthest connection searched, 1 to 40 pixels. Larger catches flatter lines, more artefacts and slower. Example: `20`"
hp = "On: searches in half-pixel steps (finer, slower)."
vcheck = "Reliability check on the result: 0 none, 1 weak, 2 medium, 3 strong. Stronger falls back to plain interpolation more often. Example: `2`"
vthresh = "Three thresholds of that check, as `first, second, direction`; lower = stricter. Example: `32, 64, 4`"
sclip = "Clip (or filter) used where the reliability check fails, instead of cubic interpolation. Example: an NNEDI3 result."
mclip = "Mask: only white pixels get edge-directed interpolation, the rest cubic; saves time. CPU and Vulkan backends only."
backend = "Where EEDI3 runs: CPU, OpenCL, Vulkan or CUDA (NVIDIA). A GPU backend is much faster; the plugin for it must be installed."
tff = "Field order the filter assumes. For anti-aliasing it picks which line set is rebuilt; Default = Yes (top field). For deinterlacing set it when the clip does not say."
transpose_first = "On: works on columns before rows. Rarely matters; can change which direction's jaggies are fixed best."
scaler = "Kernel for the final resize and the half-pixel correction after doubling. Catrom is the usual pick."
noshift = "On: skips the half-pixel correction after doubling, leaving the picture shifted. For processing that will be scaled back the same way."
direction = "Which jaggies are fixed: Vertical (horizontal lines), Horizontal (vertical lines) or both (Default)."
double_rate = "On: rebuilds the picture from both line sets and averages them (smoother, slower); off: from one."

