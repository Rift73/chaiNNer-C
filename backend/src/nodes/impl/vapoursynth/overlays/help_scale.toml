[method."vsaa.NNEDI3.antialias"]
help = "Removes jaggies (stair-stepped lines) by throwing away every other line and rebuilding it with the NNEDI3 network, in both directions. Sharper and steadier than plain blurring; softer than EEDI3 on thin lines. Example: on aliased anime lines. Blurs fine detail too; Anti-alias edges at a larger size (based_aa) limits it to edges."

[method."vsaa.NNEDI3.antialias".docs]
nsize = "Size of the area the network looks at around each pixel: 0 = 8x6, 1 = 16x6, 2 = 32x6, 3 = 48x6, 4 = 8x4, 5 = 16x4, 6 = 32x4. Wider catches flatter lines, slower. Example: `0`"
nns = "Network size: 0 = 16 neurons up to 4 = 256. Larger = better lines, much slower; 2 to 4 is usual. Example: `3`"
qual = "`1` or `2`: how many networks are blended. 2 is a little cleaner and about twice as slow. Example: `2`"
etype = "Network weights: 0 trained for least absolute error, 1 for least squared error. Example: `0`"
pscrn = "Prescreener that hands easy pixels to plain cubic interpolation: 0 = none (very slow), 1 = old, 2 to 4 = the new one at levels 0 to 2. Example: `2`"
gpu = "On: runs NNEDI3 on the GPU (Vulkan plugin), much faster; needs a Vulkan GPU."
tff = "Field order the filter assumes. For anti-aliasing it picks which line set is rebuilt; Default = Yes (top field). For deinterlacing set it when the clip does not say."
