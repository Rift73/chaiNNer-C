[method."vskernels.resample_to".docs]
out_fmt = "The output format (colour family, subsampling, bit depth).\n\nExample: RGB24"
matrix = "Matrix for a YUV to RGB conversion (or back). Default = from the clip's tags. Example: BT.709 (1) for HD."
resampler = "Kernel for the colour planes when the subsampling changes. Catrom is the usual pick."

[method."vsscale.*.scale"]
help = "Scales with a smarter scaler than a kernel: ArtCNN or Waifu2x (neural upscalers for anime), DPIR (neural denoise or deblock), a shader, your own ONNX model, or a kernel kept free of ringing (ClampScaler). Example: ArtCNN to 3840x2160. Neural ones need vs-mlrt and are slow without a GPU."

[method."vsscale.*.scale".docs]
backend = "Where the model runs (a vs-mlrt backend such as TensorRT, CUDA or CPU). Empty picks the best one available, preferring half precision on a GPU."
tiles = "Splits the picture into this many tiles, as `columns, rows`, to save graphics memory; results can differ slightly at tile edges. Example: `2, 2`"
tilesize = "Size of each tile in pixels, as `width, height`, when Tiles is used. Example: `960, 540`"
overlap = "Pixels shared by neighbouring tiles, hiding tile seams. Example: `16`"
max_instances = "Most model copies kept for a clip whose size changes between frames. Example: `2`"
kernel = "Kernel for the plain scaling and shifting steps around the model (such as reaching an exact size). Catrom is the usual pick."
scaler = "Kernel for the final resize to Width and Height. Default = Kernel."
shifter = "Kernel for fraction-of-a-pixel shifts. Default = Kernel."
base_scaler = "The sharp scaler whose result is clamped. Example: Lanczos."
reference = "The calmer scaler whose result sets the allowed limits. Example: Catrom."
strength = "ClampScaler: How far the result moves toward Clamp reference where it rings. Higher = less ringing, less sharpness; 0 to 100. Example: `80` DPIR: higher = smoother."
overshoot = "How far bright overshoot may go past Clamp reference, 0 to 1. Empty = the default. Example: `0.1`"
undershoot = "How far dark undershoot may go past Clamp reference, 0 to 1. Empty = Overshoot. Example: `0.1`"
limit = "How the result is limited: by Overshoot and Undershoot, or by repairing it against Clamp reference with the chosen repair mode."
operator = "Min keeps the darker of the two results in the merge, Max the brighter."
masked = "On: clamps only near edges, where ringing occurs; off: everywhere."
function = "A Python function applied to the enlarged clip."
shader = "An mpv GLSL shader file (`.glsl`), such as FSRCNNX."
model = "Your ONNX model file (`.onnx`)."
multiple = "Tile sizes are rounded to a multiple of this, as some models need. Example: `8`"
func = "A Python function that scales the clip."
copy_props = "On: the output keeps the input's frame properties (tags)."
width = "Output width in pixels. Empty = the clip's width. Example: `3840`"
height = "Output height in pixels. Empty = the clip's height. Example: `2160`"
shift = "Fraction-of-a-pixel move after scaling, as top then left; positive moves the picture up or left. Example: `0.5, 0`"

[method."vsscale.*.scale".choices]
ArtCNN = "Neural upscaler trained on anime (model R8F64). Upscales the brightness with the model and the colour with Kernel. Needs vs-mlrt; slow without a GPU."
Waifu2x = "Neural upscaler for anime and art (Cunet model), on RGB. Needs vs-mlrt; slow without a GPU."
DPIR = "Neural denoise or deblock (Strength sets how much) at the same size, then a plain resize. Needs vs-mlrt; slow without a GPU."
GenericOnnxScaler = "Runs your own ONNX upscaling model (Model). Needs vs-mlrt."
ClampScaler = "Scales with Scaler to clamp and clamps it against Clamp reference so sharp kernels do not ring. Example: Lanczos clamped against Catrom."
PlaceboShader = "Scales with an mpv GLSL shader file (Shader), such as FSRCNNX. Needs the placebo plugin, which runs on a Vulkan device (graphics card)."
GenericScaler = "Scales with a Python function you give (Func). For scripts."
ComplexSuperSamplerProcess = "Upscales, runs your function (Function) at the higher size, and scales back. For scripts."

