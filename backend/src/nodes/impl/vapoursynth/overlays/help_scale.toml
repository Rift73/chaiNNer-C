[method."vsaa.based_aa"]
help = "Anti-aliasing limited to edges: enlarges the brightness (Lanczos at the start; ArtCNN is sharper but needs vs-mlrt and its model), rebuilds lines with EEDI3, scales back, cleans halos and merges only where the edge mask is white. The usual first pick for aliased anime. Example: Size factor `2`. Colour is left untouched."

[method."vsaa.based_aa".docs]
rfactor = "How much the picture is enlarged before anti-aliasing. Higher = finer result, slower; below 1 shrinks instead, for extreme aliasing. Example: `2`"
mask_thr = "Edge threshold of the mask (8-bit scale). Lower = more of the picture is anti-aliased. Example: `60`"
pscale = "How much of the plain up-and-down loss is added back: 0 = all (keeps the most original detail), 1 = none. Example: `0`"
mask = "Edge mask clip, or an edge detector to make one; anti-aliasing applies where it is white. Default = Prewitt edges."
downscaler = "Scaler that brings the result back to size. Default = Box for whole factors, else Catrom."
supersampler = "Scaler that enlarges the clip first. Starts at Lanczos. ArtCNN is sharper but needs vs-mlrt and its downloaded model."
antialiaser = "The anti-aliaser object. Empty = EEDI3 tuned for this (alpha 0.125, beta 0.25, gamma 40). Example: `vsaa.NNEDI3()`"
prefilter = "Clip or filter applied before anti-aliasing, such as a denoise, to steady the result."
postfilter = "Default cleans the halos anti-aliasing leaves (bilateral smoothing with a median). False turns that off."
show_mask = "On: outputs the edge mask instead of the result, to check Edge threshold."
aa_kwargs = "Extra options for the anti-aliaser, as a Python dict. Example: `{'backend': vsaa.EEDI3.Backend.CUDA}`"

[method."vsaa.pre_aa"]
help = "Light anti-aliasing for lines: per direction, keeps the middle value of the clip, its NNEDI3 anti-aliased version and a sharpened version, so lines get smoother without going soft. Example: before Anti-alias edges at a larger size (based_aa) on strong aliasing."

[method."vsaa.pre_aa".docs]
sharpener = "Filter giving the sharpened version. Default = unsharp mask with a vertical blur."
antialiaser = "The anti-aliaser object. Default = NNEDI3. Example: `vsaa.EEDI3()`"
transpose_first = "On: works on columns before rows. Rarely matters; can change which direction's jaggies are fixed best."
direction = "Which jaggies are fixed: Vertical (horizontal lines), Horizontal (vertical lines) or both (Default)."

[method."vsdehalo.YAHR"]
help = "Yet Another Halo Remover: removes thin halos by warping (pulling edges tight) and repairing, limited by an edge mask. Gentler than Dehalo (dehalo_alpha); good for halos one or two pixels wide. Example: Warp depth `32`."

[method."vsdehalo.YAHR".docs]
blur = "Blur strength of the warp step. Higher = smoother warp. Example: `3`"
depth = "Strength of the warp. Higher = stronger halo removal, can thin lines; 16 to 64 is usual. Example: `32`"
expand = "Width of the mask around edges. Larger reaches farther; False (in the Python value box) turns the mask off. Example: `5`"
shift = "Fine-tunes the edge mask; higher makes it cover less. Example: `8`"

[method."vsdehalo.dehalo_alpha"]
help = "Removes halos (light or dark outlines next to edges, from sharpening or bad scaling) by blending in a blurred version around edges. Strong; can thin lines and smear detail, which Dehalo, lines protected (fine_dehalo) avoids. Example: Bright halo strength `1`, Dark halo strength `0.3`. Progressive clips only."

[method."vsdehalo.dehalo_alpha".docs]
blur = "The blur that makes the cleaned version; a wider blur removes wider halos and softens more. Type a Gaussian sigma, or a list with one per pass; empty = sigma 1.4.\n\nExample: `2`"
lowsens = "Edge sensitivity, 0 to 100. Higher = more areas get dehaloed. Both sensitivities at -1 = dehalo everywhere. A tuple runs extra passes, one value each, e.g. `(1.0, 0.5)`."
highsens = "Edge protection, 0 to 100. Higher = strong edges are left alone more. Both sensitivities at -1 = dehalo everywhere. A tuple runs extra passes, one value each, e.g. `(1.0, 0.5)`."
ss = "Supersampling of the final clamp, which stops aliasing. 1 = off (faster); 1.5 to 2 is usual. Example: `1.5`"
darkstr = "How much of the dark halos is removed: 0 none, 1 all. Example: `0.3` A tuple runs extra passes, one value each, e.g. `(1.0, 0.5)`."
brightstr = "How much of the bright halos is removed: 0 none, 1 all. Example: `0.8` A tuple runs extra passes, one value each, e.g. `(1.0, 0.5)`."
attach_masks = "On: stores the masks it made as frame properties, to inspect them."
kwargs = "Python dict choosing the scalers of the supersampled clamp: `supersampler` (default Lanczos) and `supersampler_ref` (default Mitchell). Example: `{'supersampler': 'Catrom'}`"

[method."vsdehalo.edge_cleaner"]
help = "Cleans dirty, noisy or slightly haloed edges by warping them tight (aWarpSharp) and repairing, kept to edges by a mask. Example: Strength `5` on rough lineart. Can thin lines at high strength."

[method."vsdehalo.edge_cleaner".docs]
strength = "Warp strength. Higher = cleaner edges, more line thinning; 3 to 10 is usual. Example: `5`"
rmode = "Repair mode that limits the warp against the source (Repair modes of the Sharpen and Blur node). Default = 17."
hot = "On: one more repair step against bright or dark single-pixel specks along edges."
smode = "On: stronger mode; warps harder and also cleans spots next to edges."
edgemask = "Edge detector for the mask that keeps the effect to edges. Default = Prewitt."

[method."vsdehalo.fine_dehalo"]
help = "Dehalo (dehalo_alpha) with masks that keep it to the area around strong lines, leaving lines and fine detail alone; optional sharpening afterwards. The usual first pick for halos. Example: Halo width `2`, Contra-sharpening `1.5`. Progressive clips only."

[method."vsdehalo.fine_dehalo".docs]
blur = "The blur that makes the cleaned version; a wider blur removes wider halos and softens more. Type a Gaussian sigma, or a list with one per pass; empty = sigma 1.4.\n\nExample: `2`"
lowsens = "Edge sensitivity, 0 to 100. Higher = more areas get dehaloed. Both sensitivities at -1 = dehalo everywhere. A tuple runs extra passes, one value each, e.g. `(1.0, 0.5)`."
highsens = "Edge protection, 0 to 100. Higher = strong edges are left alone more. Both sensitivities at -1 = dehalo everywhere. A tuple runs extra passes, one value each, e.g. `(1.0, 0.5)`."
ss = "Supersampling of the final clamp, which stops aliasing. 1 = off (faster); 1.5 to 2 is usual. Example: `1.5`"
darkstr = "How much of the dark halos is removed: 0 none, 1 all. Example: `0.3` A tuple runs extra passes, one value each, e.g. `(1.0, 0.5)`."
brightstr = "How much of the bright halos is removed: 0 none, 1 all. Example: `0.8` A tuple runs extra passes, one value each, e.g. `(1.0, 0.5)`."
attach_masks = "On: stores the masks it made as frame properties, to inspect them."
kwargs = "Python dict choosing the scalers of the supersampled clamp: `supersampler` (default Lanczos) and `supersampler_ref` (default Mitchell). Example: `{'supersampler': 'Catrom'}`"
rx = "Horizontal halo width in pixels the mask covers. Wider halos need more. Example: `2`"
ry = "Vertical halo width in pixels. Empty = Halo width. Example: `2`"
edgemask = "Edge detector used to find lines. Default = Robinson3."
thmi = "Edges weaker than this are not treated as sharp lines. Lower = more lines treated. Example: `80`"
thma = "Edges stronger than this count fully as sharp lines. Example: `128`"
thlimi = "Lower threshold for adding back fainter edges that were skipped. Example: `50`"
thlima = "Upper threshold for adding back fainter edges. Example: `100`"
exclude = "On: leaves areas with lines close together (fine detail, text) alone."
edgeproc = "Above 0: also processes the edges themselves, not only around them. Example: `0.5`"
contra = "Sharpens back what dehaloing softened, limited so halos do not return. 0 = off. Example: `1.5`"
pre_ss = "Works on a 2x or 4x NNEDI3-enlarged clip and scales back, for finer results; a power of 2, much slower. Example: `2`"

[method."vsdehalo.hq_dering"]
help = "Removes ringing (ripples next to edges, from compression or sharp scaling) by putting a smoothed clip only into a ring-shaped mask around edges, limited so edges stay sharp. Example: on MPEG-2 sources with mosquito noise around lines."

[method."vsdehalo.hq_dering".docs]
smooth = "The smoothed version used inside the mask: a clip, or a prefilter. Default = MinBlur. Stronger smoothing removes more ringing."
ringmask = "Your own mask of where to dering. Empty = built from edges."
mrad = "How far the mask grows outward from edges. Higher = wider area treated. Example: `1`"
msmooth = "How much the mask's border is softened. Example: `1`"
minp = "How far the mask is pulled back from the edges themselves. Higher = edges better protected. Example: `1`"
mthr = "Edge threshold (8-bit scale). Lower = more edges found, more treated; on strong ringing too low marks ringing as edges and protects it. Example: `60`"
incedge = "On: treats the edges themselves too, not only the area next to them."
contra = "Sharpens the smoothed clip back, limited so ringing does not return. 0 = off. Example: `1.4`"
drrep = "Repair mode keeping detail against the source; 24, 23, 13, 12 or 1 are recommended. Example: `24`"
ref = "Reference clip the change limit is measured against. Empty = the main clip."
dark_thr = "How much darker the result may get, 8-bit scale. Higher removes more bright ringing. Example: `12`"
bright_thr = "How much brighter the result may get, 8-bit scale. Higher removes more dark ringing. Empty = Darkening limit divided by 4. Example: `3`"
elast = "Softness of those limits: beyond the threshold, the change fades out up to threshold times this. Example: `2`"

[method."vsdehalo.vine_dehalo"]
help = "Removes halos with NL-Means (non-local means) filtering on a supersampled copy, keeping the fine detail. Slower than Dehalo, lines protected (fine_dehalo). Example: Strength `16`."

[method."vsdehalo.vine_dehalo".docs]
strength = "NL-Means strength. Higher = more halo removal and more smoothing. Example: `16`"
sharp = "Blend between the supersampled and the normal-size filtering: higher = more of the normal-size result. Must be above 0; above 1 acts as 1. Example: `0.5`"
sigma = "Blur sigma splitting coarse from fine detail: the coarse part stays from the source, the fine part comes from the filtered version. Higher = more taken from the filtered version. Example: `1`"
supersampler = "Scaler that enlarges the clip first. Default = NNEDI3."
downscaler = "Scaler that brings it back to size. Default = Catrom."
