[method."vskernels.*.rescale"]
help = "Upscales a descaled clip back with the same kernel, exactly the reverse of Descale: undo an upscale (descale). Compare it with the source to check a descale guess, or to build masks of what the descale changed. Example: Bilinear from 1280x720 to 1920x1080. For a final upscale pick Resize with a kernel or a neural upscaler instead."

[method."vskernels.*.rescale".docs]
b = "Bicubic's blur term. Higher = softer and blurrier, less ringing; 0 to 1 is usual. Example: `0.333`"
c = "Bicubic's sharpness term. Higher = sharper with more ringing; 0 to 1 is usual. Example: `0.5`"
taps = "How many lobes the kernel has. More = sharper with more ringing and slower; 2 to 4 is usual. Example: `3`"
sigma = "Width of the Gaussian curve. Higher = blurrier; 0.3 to 1 is usual. Example: `0.5`"
cutoff = "Distance in pixels beyond which the kernel gives 0, even inside Taps. Empty = no cut. Example: `2.5`"
blur = "The same kernel stretch given to Descale: undo an upscale (descale). Empty = 1. Example: `1.05`"
width = "Width to scale back up to, usually the source's. Example: `1920`"
height = "Height to scale back up to, usually the source's. Example: `1080`"
linear = "Rescales in linear light; match what Descale: undo an upscale (descale) used. Default = only when Sigmoid light is on."
sigmoid = "Rescales on a sigmoid curve; match what Descale: undo an upscale (descale) used."
shift = "The same (top, left) offset given to Descale: undo an upscale (descale). Example: `(0.25, 0)`"
border_handling = "How the edges are padded: `0` mirror, `1` black (zero), `2` repeat the last row. Change it only when undoing a scale that padded that way. Example: `0`"
sample_grid_model = "`0` lines up the outer edges of the pictures (normal); `1` lines up the centres of the outer pixels, as some programs do. Example: `1`"
field_based = "Interlaced rescaling is not supported: leave As the video says or pick Progressive."
ignore_mask = "The same mask given to Descale: undo an upscale (descale): white areas are left out of the calculation."

