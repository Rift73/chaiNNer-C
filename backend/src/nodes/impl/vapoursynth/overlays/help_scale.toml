[method."vskernels.*.scale"]
help = "Changes the picture size with the chosen kernel, which decides how sharp or soft the result is. Catrom is the safe start for both upscaling and downscaling; Lanczos or Spline36 for sharper upscales, Hermite for halo-free downscales. Example: 1920x1080 to 1280x720. To undo an upscale use Descale: undo an upscale (descale)."

[method."vskernels.*.scale".docs]
b = "Bicubic's blur term. Higher = softer and blurrier, less ringing; 0 to 1 is usual. Example: `0.333`"
c = "Bicubic's sharpness term. Higher = sharper with more ringing; 0 to 1 is usual. Example: `0.5`"
taps = "How many lobes the kernel has. More = sharper with more ringing and slower; 2 to 4 is usual. Example: `3`"
sigma = "Width of the Gaussian curve. Higher = blurrier; 0.3 to 1 is usual. Example: `0.5`"
radius = "How far the kernel reaches, in pixels. Larger = sharper, more ringing, slower; leave the kernel's own value unless matching a source. Example: `3`"
antiring = "Holds back the halos (ringing) a sharp kernel draws next to edges. 0 = off, 1 = strongest; 0.5 to 0.8 is usual. Example: `0.8`"
cutoff = "Distance in pixels beyond which the kernel gives 0, even inside Taps. Empty = no cut. Example: `2.5`"
blur = "Stretches the kernel. Above 1 = softer, below 1 = sharper; empty keeps the kernel's own value. Example: `1.05`"
width = "Output width in pixels. Empty = the clip's width. Example: `1920`"
height = "Output height in pixels. Empty = the clip's height. Example: `1080`"
linear = "Scales in linear light (converted from the clip's gamma and back). Keeps fine bright detail from darkening when downscaling; slower. Default = only when Sigmoid light is on. Example: Yes"
sigmoid = "Scales on an S-curve of linear light, which keeps halos from ringing kernels small when upscaling. Tick it for the usual curve (slope 6.5, centre 0.75). Example: `(6.5, 0.75)` in the Python value box. Cannot be used with Linear light set to No."
shift = "Moves the picture by a fraction of a pixel while scaling, as (top, left); positive moves it up or left. A list gives one value per plane. Example: `(0.5, 0)`"
border_handling = "How the edges are padded: `0` mirror, `1` black (zero), `2` repeat the last row. Change it only when undoing a scale that padded that way. Example: `0`"
sample_grid_model = "`0` lines up the outer edges of the pictures (normal); `1` lines up the centres of the outer pixels, as some programs do. Example: `1`"
sar = "Takes the clip's sample aspect ratio (SAR, the shape of its pixels) into account and keeps the shape of the picture, cropping as Keep aspect ratio does."
keep_ar = "Keeps the picture's shape: when Width and Height have another aspect ratio, crops the sides or top and bottom of the source instead of stretching."

