scaler = "Scaler used to match the source clip's format. Example: Bilinear."

[method."vsscale.descale_detail_mask"]
help = "Marks detail that was added at full size (credits, overlays) by comparing the clip with its descaled-and-rescaled version, so a descale can leave those parts alone. Example: Rescaled clip from Upscale a descaled clip (rescale) with the source's kernel. Expects a float clip."

[method."vsscale.descale_detail_mask".docs]
rescaled = "The clip after Descale: undo an upscale (descale) then Upscale a descaled clip (rescale) with the source's kernel and size."
thr = "How big a difference counts as detail. Lower = catches more; 0.03 to 0.1 is usual. Example: `0.05`"
inflate = "How often the mask is softened outward. Example: `2`"
xxpand = "How often the mask is grown, before and after softening, as `before, after`. Example: `4, 0`"

[method."vsscale.descale_error_mask"]
help = "Marks where a rescaled clip differs from the original, to catch frames or areas where a descale went wrong. Example: Rescaled clip from Upscale a descaled clip (rescale); the mask then protects those areas."

[method."vsscale.descale_error_mask".docs]
rescaled = "The clip after Descale: undo an upscale (descale) then Upscale a descaled clip (rescale)."
thr = "Smallest difference that counts. Lower = catches more. Example: `0.038`"
expands = "How often the mask grows at each step (difference, expand, binarize), as three numbers. Example: `2, 2, 3`"
blur = "How much the clip is blurred first; a whole number box-blurs, a fraction blurs with a Gaussian. Example: `3`"
bwbias = "Takes the clip's colour into account in the difference; 1 = off. Example: `1`"
tr = "Temporal radius: frames on each side used to make the mask steady over time. 0 = off. Example: `1`"

[method."vsscale.pre_ss"]
help = "Enlarges the clip, runs your function at the higher size and scales the result back: filters that work on pixels then act finer. Example: Size factor `2` with a function wired in. Slower by about the factor squared."

[method."vsscale.pre_ss".docs]
function = "The filter to run on the enlarged clip."
rfactor = "How many times larger the clip is made. Example: `2`"
sp = "A scaler process that does the enlarging and shrinking as one object. Empty = Lanczos up, Point down."
supersampler = "Scaler for the enlarging, when Sp is empty. Example: NNEDI3 for sharp lines."
downscaler = "Scaler for shrinking back, when Sp is empty."
mod = "The enlarged size is rounded to a multiple of this. Example: `4`"
pscale = "How much of the plain up-and-down loss is added back: 1 = none added back, 0 = all, keeping more of the original detail. Example: `0.5`"

[method."vstools.Padder.color"]
