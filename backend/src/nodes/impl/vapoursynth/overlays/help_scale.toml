# Help texts of the Resize, Anti-alias and Dehalo nodes (overlay format).

[method."vskernels.*.bob"]
help = "Deinterlaces by stretching each field to full height with the kernel: one frame per field, so the frame rate doubles. Fast and soft, with bobbing on fine lines; the other deinterlacers in this node look far better. Needs the field order."

[method."vskernels.*.bob".docs]
b = "Bicubic's blur term. Higher = softer and blurrier, less ringing; 0 to 1 is usual. Example: `0.333`"
c = "Bicubic's sharpness term. Higher = sharper with more ringing; 0 to 1 is usual. Example: `0.5`"
taps = "How many lobes the kernel has. More = sharper with more ringing and slower; 2 to 4 is usual. Example: `3`"
tff = "Field order. As the video says reads the clip's tag and stops if the clip says it is progressive or does not say. TFF = top field first, BFF = bottom field first."

[method."vskernels.*.bob".choices]
Catrom = "Bicubic with b 0, c 0.5 (Catmull-Rom). Sharp with little ringing; the usual all-round pick for upscaling and downscaling."
Mitchell = "Bicubic with b 1/3, c 1/3. A little softer than Catrom with less ringing and aliasing; a safe neutral pick."
Hermite = "Bicubic with b 0, c 0. Soft, no ringing; good for downscaling when halos must not appear."
BSpline = "Bicubic with b 1, c 0. Very soft and blurry, no ringing; for smoothing, not for keeping detail."
Bicubic = "Bicubic with your own Bicubic b and Bicubic c (defaults 0 and 0.5, the same as Catrom). Higher B = softer and blurrier; higher C = sharper with more ringing."
BicubicAuto = "Bicubic where you set only Bicubic b or only Bicubic c and the other follows b + 2c = 1, a balanced pair. Setting both stops with an error."
BicubicSharp = "Bicubic with b 0, c 1. Very sharp with strong ringing; mostly for descaling sources that were upscaled with it."
FFmpegBicubic = "Bicubic with b 0, c 0.6, FFmpeg's default bicubic. Pick it to match or undo a scale made by FFmpeg."
AdobeBicubic = "Bicubic with b 0, c 0.75, Adobe's \"Bicubic\" preset. Sharper than Catrom with more ringing; mostly for descaling Adobe-made upscales."
AdobeBicubicSharper = "Bicubic with b 0, c 1 and blur 1.05, Adobe's \"Bicubic Sharper\" preset. For matching or descaling Adobe output."
AdobeBicubicSmoother = "Bicubic with b 0, c 0.625 and blur 1.15, Adobe's \"Bicubic Smoother\" preset. Soft; for matching or descaling Adobe output."
Robidoux = "Bicubic with b 0.378, c 0.311. Close to Mitchell, slightly sharper; balanced with low ringing."
RobidouxSharp = "Bicubic with b 0.262, c 0.369. Between Robidoux and Catrom in sharpness."
RobidouxSoft = "Bicubic with b 0.680, c 0.160. Soft with almost no ringing."
Bilinear = "Blends the two nearest pixels in each direction. Soft when upscaling, aliased when shrinking a lot; fast. A common kernel to descale."
Point = "Nearest neighbour: copies whole pixels. Blocky when upscaling, aliased when downscaling; for pixel art, masks and exact integer upscales."
Lanczos = "Windowed sinc with Taps lobes (default 3). Sharp, with ringing next to hard edges; a common pick for live action. More taps = sharper, more ringing."
Spline16 = "Spline, 2 taps. Sharp like Catrom with a little ringing."
Spline36 = "Spline, 3 taps. Sharp with moderate ringing; a common pick for upscaling."
Spline64 = "Spline, 4 taps. Slightly sharper than Spline36 with a bit more ringing."
CustomPoint = "Point built through the custom-kernel route of the resize plugin. Same look as Point; pick Point unless a script names this one."
CustomBilinear = "Bilinear built through the custom-kernel route of the resize plugin. Same look as Bilinear; pick Bilinear unless a script names this one."
CustomLanczos = "Lanczos built through the custom-kernel route of the resize plugin. Same look as Lanczos; pick Lanczos unless a script names this one."

[method."vskernels.*.deinterlace"]
help = "Deinterlaces by stretching fields to full height with the kernel; Double rate on gives one frame per field (frame rate doubles), off keeps the frame rate. Fast and soft; the other deinterlacers in this node look far better. Needs the field order."

[method."vskernels.*.deinterlace".docs]
b = "Bicubic's blur term. Higher = softer and blurrier, less ringing; 0 to 1 is usual. Example: `0.333`"
c = "Bicubic's sharpness term. Higher = sharper with more ringing; 0 to 1 is usual. Example: `0.5`"
taps = "How many lobes the kernel has. More = sharper with more ringing and slower; 2 to 4 is usual. Example: `3`"
tff = "Field order. As the video says reads the clip's tag and stops if the clip says it is progressive or does not say. TFF = top field first, BFF = bottom field first."
double_rate = "On: one frame per field, so the frame rate doubles (50i becomes 50p). Off: one frame per frame, half the fields dropped."

