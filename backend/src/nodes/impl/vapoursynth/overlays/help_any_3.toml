[method."fmtc.resample"]
help = "fmtconv's resizer: scales, changes subsampling, and can work as a convolution; integer input comes out 16-bit (use fmtc bitdepth after). The Resize node's Resize with a kernel (scale) is the friendlier form. Example: `w = 1920`, `h = 1080`, `kernel = 'spline36'`."

[method."fmtc.resample".docs]
w = "Output width. Empty = unchanged. Example: `w = 1920`"
h = "Output height. Empty = unchanged. Example: `h = 1080`"
sx = "Left edge of the source area; fractions shift. Example: `sx = 0.5`"
sy = "Top edge of the source area. Example: `sy = 0.5`"
sw = "Width of the source area; 0 = whole, negative counts from the right. Example: `sw = -2`"
sh = "Height of the source area, like Sw. Example: `sh = -2`"
scale = "Size factor for both directions; Width and Height win. Example: `scale = 0.5`"
scaleh = "Horizontal size factor. Example: `scaleh = 2`"
scalev = "Vertical size factor. Example: `scalev = 2`"
kernel = "Kernel: point, box, bilinear, bicubic, lanczos, blackman, spline16, spline36 (default), spline64, gauss, sinc, impulse. Example: `kernel = 'lanczos'`"
taps = "Kernel length, 1 to 128 (default 4). Example: `taps = 3`"
a1 = "Kernel setting: bicubic b, or gauss sharpness. Example: `a1 = 0`"
a2 = "Kernel setting: bicubic c. Example: `a2 = 0.5`"
fh = "Horizontal frequency factor: below 1 blurs, above 1 sharpens; negative forces processing. Example: `fh = 0.9`"
fv = "Vertical frequency factor, like Fh. Example: `fv = 0.9`"
invks = "True = inverts the kernel, to undo an earlier upscale when shrinking. Example: `invks = True`"
css = "Output chroma subsampling. Example: `css = '444'`"
planes = "Per plane: 3 process, 2 copy, 1 leave garbage, 0 or negative fill with that value. Example: `planes = [3, 2, 2]`"
fulls = "True = the input is full range. Example: `fulls = True`"
fulld = "True = the output is full range. Example: `fulld = True`"
cplace = "Chroma placement: mpeg2 (default, left), mpeg1 (centre), dv, top_left. Example: `cplace = 'top_left'`"
interlaced = "0 progressive, 1 fields, 2 read from the clip (default). Example: `interlaced = 0`"
tff = "0 bottom field first, 1 top field first, 2 read from the clip. Example: `tff = 1`"
csp = "Output format (a VapourSynth format); only 16-bit integer or 32-bit float."
flt = "True = float maths even for integer clips. Example: `flt = True`"
cnorm = "True (default) = kernel sums to 1; off for raw convolution. Example: `cnorm = False`"
center = "True (default) = keeps the picture centre in place. Example: `center = False`"
kernelh = "Kernel for the horizontal pass; empty = Kernel. Example: `kernelh = 'bicubic'`"
kernelv = "Kernel for the vertical pass; empty = Kernel. Example: `kernelv = 'bicubic'`"
tapsh = "Taps of the horizontal pass. Example: `tapsh = 3`"
tapsv = "Taps of the vertical pass. Example: `tapsv = 3`"
a1h = "A1 for the horizontal pass."
a1v = "A1 for the vertical pass."
a2h = "A2 for the horizontal pass."
a2v = "A2 for the vertical pass."
a3 = "Third kernel setting, for kernels that use one."
a3h = "A3 for the horizontal pass."
a3v = "A3 for the vertical pass."
impulse = "Coefficients of your own kernel when Kernel is impulse; an odd count. Example: `impulse = [1, 2, 1]`"
impulseh = "Impulse for the horizontal pass."
impulsev = "Impulse for the vertical pass."
kovrspl = "Oversampling of the impulse kernel, 1 or more. Example: `kovrspl = 2`"
total = "Sum the kernel is normalised to; 0 = its own sum. Example: `total = 4`"
totalh = "Total for the horizontal pass."
totalv = "Total for the vertical pass."
invksh = "Invks for the horizontal pass only."
invksv = "Invks for the vertical pass only."
invkstaps = "Taps of the inverted kernel, 1 to 128 (default 4). Example: `invkstaps = 5`"
invkstapsh = "Invkstaps for the horizontal pass."
invkstapsv = "Invkstaps for the vertical pass."
cplaces = "Chroma placement of the source; empty = Cplace. Example: `cplaces = 'mpeg2'`"
cplaced = "Chroma placement of the output; empty = Cplace. Example: `cplaced = 'top_left'`"
interlacedd = "Interlacing of the output; empty = Interlaced. Example: `interlacedd = 0`"
tffd = "Field order of the output; empty = Tff. Example: `tffd = 1`"
cpuopt = "Limits the CPU instruction set: -1 automatic (default), 0 default build set. For testing. Example: `cpuopt = 0`"

[method."fmtc.bitdepth"]
help = "Changes bit depth or integer/float with a choice of dithers. The Convert Format node's Bit depth (depth) is the friendlier form. Example: `bits = 10`, `dmode = 3`."

[method."fmtc.bitdepth".docs]
bits = "Output bit depth. Example: `bits = 10`"
flt = "1 = float output, 0 = integer. Example: `flt = 1`"
csp = "Output format (a VapourSynth format); only bit depth and type may differ from the input."
fulls = "True = the input is full range. Example: `fulls = True`"
fulld = "True = the output is full range. Example: `fulld = True`"
dmode = "Dither: 0 ordered, 1 or 2 rounding, 3 to 7 error diffusion (3 default), 8 void-and-cluster, 9 quasirandom. Example: `dmode = 8`"
ampo = "Ordered dither strength. Example: `ampo = 1.5`"
ampn = "Added noise strength, up to 4. Example: `ampn = 0.5`"
dyn = "True = the ordered pattern changes every frame. Example: `dyn = True`"
staticnoise = "True = the same noise on every frame. Example: `staticnoise = True`"
patsize = "Void-and-cluster pattern width, a power of 2 from 4 to 1024. Example: `patsize = 32`"
planes = "Planes to process. Example: `planes = [0]`"
tpdfo = "True = triangular distribution for the ordered dither. Example: `tpdfo = True`"
tpdfn = "True = triangular distribution for the added noise. Example: `tpdfn = True`"
corplane = "True = dither and noise patterns are the same on all planes. Example: `corplane = True`"
cpuopt = "Limits the CPU instruction set: -1 automatic (default), 0 default build set. For testing. Example: `cpuopt = 0`"

[method."fmtc.matrix"]
help = "Converts between YUV and RGB (and other colour spaces) with a chosen matrix. The Convert Format node's Convert format and colours (Spline36) is the friendlier form. Example: `mat = '709'`."

[method."fmtc.matrix".docs]
mat = "Matrix for conversions to or from RGB: 601, 709, 2020, YCoCg and others. Example: `mat = '709'`"
mats = "Source matrix. Example: `mats = '601'`"
matd = "Destination matrix. Example: `matd = '709'`"
fulls = "True = the input is full range. Example: `fulls = True`"
fulld = "True = the output is full range. Example: `fulld = True`"
coef = "Twelve coefficients of your own matrix, four per output plane, the fourth an added constant."
csp = "Output format (a VapourSynth format)."
col_fam = "Output colour family (a VapourSynth constant); wins over Csp."
bits = "Output bit depth (8 to 16 or 32); cannot be lower than the input. Example: `bits = 16`"
singleout = "Outputs only this plane, 0 to 2; -1 = all. Example: `singleout = 0`"
cpuopt = "Limits the CPU instruction set: -1 automatic (default), 0 default build set. For testing. Example: `cpuopt = 0`"

[method."fmtc.matrix2020cl"]
help = "Converts between linear RGB and BT.2020 constant-luminance YUV, which the usual matrix conversion cannot. Example: `full = False`."

[method."fmtc.matrix2020cl".docs]
full = "True = full-range YUV, False (default) = limited. Example: `full = True`"
bits = "Output bit depth. Example: `bits = 16`"
csp = "Output format."
cpuopt = "Limits the CPU instruction set: -1 automatic (default), 0 default build set. For testing. Example: `cpuopt = 0`"

[method."fmtc.primaries"]
help = "Converts linear RGB from one set of primaries (colour gamut) to another, such as BT.2020 to BT.709. The clip must already be linear RGB (fmtc transfer). Example: `prims = '2020'`, `primd = '709'`."

[method."fmtc.primaries".docs]
prims = "Source primaries preset: 709, 2020, p3d65 and others. Example: `prims = '2020'`"
primd = "Destination primaries preset. Example: `primd = '709'`"
wconv = "True = skips white-point adaptation. Example: `wconv = True`"
rs = "Source red primary as x, y. Example: `rs = [0.64, 0.33]`"
gs = "Source green primary as x, y."
bs = "Source blue primary as x, y."
ws = "Source white point as x, y."
rd = "Destination red primary as x, y; empty = source."
gd = "Destination green primary."
bd = "Destination blue primary."
wd = "Destination white point."
cpuopt = "Limits the CPU instruction set: -1 automatic (default), 0 default build set. For testing. Example: `cpuopt = 0`"

[method."fmtc.transfer"]
help = "Converts between transfer curves (gamma): linear, 709, sRGB, PQ (2084), HLG and others. Example: `transs = '709'`, `transd = 'linear'`. Output is 16-bit or float."

[method."fmtc.transfer".docs]
transs = "Source curve: 709, 1886, srgb, 2084 (PQ), hlg, linear and others. Example: `transs = '709'`"
transd = "Destination curve. Example: `transd = 'linear'`"
cont = "Contrast multiplier on the linear signal. Example: `cont = 1.1`"
gcor = "Extra gamma power on the linear signal. Example: `gcor = 1.2`"
bits = "Output bit depth, 16 or 32. Example: `bits = 32`"
flt = "1 = float output. Example: `flt = 1`"
fulls = "True (default) = the input is full range. Example: `fulls = False`"
fulld = "True (default) = the output is full range. Example: `fulld = False`"
lb = "Black level of the source display, cd/m2. Example: `lb = 0.1`"
lw = "Peak white, cd/m2. Example: `lw = 1000`"
lws = "Peak white of the source. Example: `lws = 1000`"
lwd = "Peak white of the destination. Example: `lwd = 100`"
ambient = "Surrounding light for display curves, cd/m2. Example: `ambient = 5`"
match = "Brightness matching: 0 none, 1 reference white (default), 2 display. Example: `match = 2`"
sceneref = "True = scene-referred linear light, False = display-referred. Example: `sceneref = True`"
gy = "True = gamma on brightness only. Example: `gy = True`"
sig_c = "Sigmoid curvature, 0.1 to 10 (default 6.5). Example: `sig_c = 6.5`"
sig_t = "Sigmoid centre, 0 to 1 (default 0.5). Example: `sig_t = 0.5`"
logceis = "Exposure index for Arri Log C curves (default 800). Example: `logceis = 800`"
logceid = "Exposure index for the destination Log C curve. Example: `logceid = 800`"
blacklvl = "Old black-level setting; use Lb and Lw instead."
debug = "Non-zero = adds a debug frame property. Example: `debug = 1`"
cpuopt = "Limits the CPU instruction set: -1 automatic (default), 0 default build set. For testing. Example: `cpuopt = 0`"

[method."fmtc.nativetostack16"]
help = "Turns a 16-bit clip into the stacked 8-bit form (top half high bytes, bottom half low bytes) some old AviSynth-era filters need. Rarely needed. Example: no settings."

[method."fmtc.stack16tonative"]
help = "Turns a stacked 8-bit clip (double height) back into a normal 16-bit clip. Rarely needed. Example: no settings."

[method."placebo.Resample"]
help = "libplacebo's resizer, by default EWA Lanczos (weights by 2D distance: fewer jaggies on diagonals). The Resize node's Resize with a kernel (scale), Ewa kernels, is the friendlier form. Runs on a Vulkan device (graphics card). Example: `width = 1920`, `height = 1080`."

[method."placebo.Resample".docs]
width = "Output width. Example: `width = 1920`"
height = "Output height. Example: `height = 1080`"
filter = "Kernel name from libplacebo, such as ewa_lanczos (default), lanczos, spline36. Example: `filter = 'ewa_lanczossharp'`"
radius = "Kernel radius, for kernels that allow it. Example: `radius = 3`"
clamp = "Removes negative lobes (ringing): 0 none, 1 all. Example: `clamp = 0.5`"
taper = "Flattens the kernel's centre. Example: `taper = 0.5`"
blur = "Stretches the kernel without changing its radius. Example: `blur = 1.05`"
param1 = "First kernel parameter (bicubic b). Example: `param1 = 0`"
param2 = "Second kernel parameter (bicubic c). Example: `param2 = 0.5`"
antiring = "Antiringing strength, 0 to 1. Example: `antiring = 0.8`"
sx = "Left edge of the source area; fractions shift. Example: `sx = 0.5`"
sy = "Top edge of the source area. Example: `sy = 0.5`"
src_width = "Width of the source area. Example: `src_width = 1918`"
src_height = "Height of the source area. Example: `src_height = 1078`"
linearize = "True = scales in linear light; default on for RGB, off for YUV. Example: `linearize = True`"
sigmoidize = "True = scales on a sigmoid curve (needs Linearize on); do not use on HDR. Example: `sigmoidize = True`"
sigmoid_center = "Centre of the sigmoid curve (default 0.75). Example: `sigmoid_center = 0.75`"
sigmoid_slope = "Steepness of the sigmoid curve (default 6.5). Example: `sigmoid_slope = 6.5`"
trc = "Transfer curve used for linearizing, 0 to 16 (default 1, BT.1886). Example: `trc = 1`"
min_luma = "Lowest brightness of the display model (default 1e-6). Example: `min_luma = 0`"
log_level = "How much libplacebo logs (default 2, errors). Example: `log_level = 3`"

[method."placebo.Shader"]
help = "Runs an mpv GLSL shader (such as an FSRCNNX or Anime4K upscaler) through libplacebo. Input must be 16-bit YUV; output is 16-bit YUV 4:4:4. Runs on a Vulkan device. Example: `shader = 'C:/shaders/FSRCNNX_x2_8-0-4-1.glsl'`, `width = 3840`, `height = 2160`."

[method."placebo.Shader".docs]
filter = "Kernel name from libplacebo, such as ewa_lanczos (default), lanczos, spline36. Example: `filter = 'ewa_lanczossharp'`"
radius = "Kernel radius, for kernels that allow it. Example: `radius = 3`"
clamp = "Removes negative lobes (ringing): 0 none, 1 all. Example: `clamp = 0.5`"
taper = "Flattens the kernel's centre. Example: `taper = 0.5`"
blur = "Stretches the kernel without changing its radius. Example: `blur = 1.05`"
param1 = "First kernel parameter (bicubic b). Example: `param1 = 0`"
param2 = "Second kernel parameter (bicubic c). Example: `param2 = 0.5`"
linearize = "True = scales in linear light; default on for RGB, off for YUV. Example: `linearize = True`"
sigmoidize = "True = scales on a sigmoid curve (needs Linearize on); do not use on HDR. Example: `sigmoidize = True`"
sigmoid_center = "Centre of the sigmoid curve (default 0.75). Example: `sigmoid_center = 0.75`"
sigmoid_slope = "Steepness of the sigmoid curve (default 6.5). Example: `sigmoid_slope = 6.5`"
trc = "Transfer curve used for linearizing, 0 to 16 (default 1, BT.1886). Example: `trc = 1`"
log_level = "How much libplacebo logs (default 2, errors). Example: `log_level = 3`"
shader = "Path of the shader file (mpv GLSL). Example: `shader = 'C:/shaders/FSRCNNX_x2_8-0-4-1.glsl'`"
shader_s = "The shader's text itself, used when Shader is empty."
width = "Output width; needed for scaling shaders. Example: `width = 3840`"
height = "Output height. Example: `height = 2160`"
chroma_loc = "Chroma location, libplacebo numbering (default 1). Example: `chroma_loc = 1`"
matrix = "YUV matrix, libplacebo numbering (default 2). Example: `matrix = 2`"
antiring = "Antiringing strength of the final scaling (default 0). Example: `antiring = 0.5`"

[method."placebo.Deband"]
help = "libplacebo's debander: smooths banding in gradients and adds a little grain. The Deband and Grain node's Deband, Vulkan GPU only (placebo_deband) is the friendlier form. Runs on a Vulkan device. Example: `threshold = 4`, `grain = 6`."

[method."placebo.Deband".docs]
planes = "Planes as a bit mask: 1 = Y, 2 = U, 4 = V; `1 | 2 | 4` = all. Example: `planes = 7`"
iterations = "Debanding passes per pixel. Example: `iterations = 2`"
threshold = "Cut-off; higher debands more but blurs detail. Example: `threshold = 4`"
radius = "Starting radius, growing each pass; larger finds wider gradients. Example: `radius = 16`"
grain = "Noise added to hide leftover banding; higher = more. Example: `grain = 6`"
dither = "Dither the result to the output bit depth; works for 8-bit only. Example: `dither = False`"
dither_algo = "Dither method (default blue noise). Example: `dither_algo = 0`"
log_level = "How much libplacebo logs (default 2, errors). Example: `log_level = 3`"

[method."noise.Add"]
help = "Adds noise or film-like grain: Gaussian, Perlin, Simplex, fractal or Poisson. The Deband and Grain node's Add grain (Grainer) is the friendlier form. Example: `var = 2`, `uvar = 0.5`."

[method."noise.Add".docs]
var = "Brightness noise strength; 0 = none. Example: `var = 2`"
uvar = "Colour noise strength (YUV only). Example: `uvar = 0.5`"
type = "0 Gaussian, 1 Perlin, 2 Simplex, 3 fractal (fBm on Simplex), 4 Poisson. Example: `type = 1`"
hcorr = "Horizontal correlation 0 to 1 (streaks; Gaussian only); raise Var to keep the amount. Example: `hcorr = 0.5`"
vcorr = "Vertical correlation 0 to 1 (streaks; Gaussian only). Example: `vcorr = 0.5`"
xsize = "Horizontal size of Perlin or Simplex noise (default 2). Example: `xsize = 3`"
ysize = "Vertical size of Perlin or Simplex noise (default 2). Example: `ysize = 3`"
seed = "Fixed seed for repeatable noise; -1 = random. Example: `seed = 42`"
constant = "True = the same pattern on every frame. Example: `constant = True`"
every = "New pattern every this many frames. Example: `every = 2`"
opt = "CPU code path: 0 automatic, 1 plain, 2 SSE2, 3 AVX2, 4 AVX-512. Example: `opt = 1`"
