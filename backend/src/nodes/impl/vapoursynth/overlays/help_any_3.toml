# Help texts of Any Function methods: zsmooth, descale, resize2, fmtc, placebo, noise.

[method."zsmooth.Median"]
help = "Replaces each pixel with the median of its square neighbourhood (3x3 to 7x7): removes specks and dots, keeps edges better than a blur. The Sharpen and Blur node's Median (median_blur) is the friendlier form. Example: `radius = 1`."

[method."zsmooth.Median".docs]
radius = "Neighbourhood per plane: 1 = 3x3, 2 = 5x5, 3 = 7x7, 0 = plane left alone. Larger = stronger, flatter. Example: `radius = 1`"
planes = "Planes to process, as a list of plane numbers (0 = Y or R); the others are copied. Empty = all. Example: `planes = [0]`"

[method."zsmooth.InterQuartileMean"]
help = "Averages the middle half of the values in each pixel's neighbourhood, dropping the darkest and brightest quarter: a denoise between a median and a blur. Example: `radius = 1`."

[method."zsmooth.InterQuartileMean".docs]
radius = "Neighbourhood per plane: 1 = 3x3, 2 = 5x5, 3 = 7x7, 0 = plane left alone. Larger = stronger, flatter. Example: `radius = 1`"
planes = "Planes to process, as a list of plane numbers (0 = Y or R); the others are copied. Empty = all. Example: `planes = [0]`"

[method."zsmooth.SmartMedian"]
help = "Median that only touches flat areas: pixels whose neighbourhood varies less than the threshold are smoothed, edges and texture stay. Example: `radius = 1`, `threshold = 50`."

[method."zsmooth.SmartMedian".docs]
radius = "Neighbourhood per plane: 1 = 3x3, 2 = 5x5, 3 = 7x7, 0 = plane left alone. Larger = stronger, flatter. Example: `radius = 1`"
threshold = "Variance limit below which a pixel is smoothed; higher = more is smoothed. Default 50 for radius 1, 128 for larger. In the clip's own scale unless `scalep = True`. Example: `threshold = 50`"
scalep = "True = thresholds are on the 8-bit scale (0-255) and scaled to the clip's bit depth. Example: `scalep = True`"
planes = "Planes to process, as a list of plane numbers (0 = Y or R); the others are copied. Empty = all. Example: `planes = [0]`"

[method."zsmooth.RemoveGrain"]
help = "Classic spatial cleaner with 24 modes (median variants, blurs, line-preserving clips) working on 3x3 neighbourhoods. The Sharpen and Blur node's Small 3x3 filters (remove_grain) is the friendlier form. Example: `mode = 1` removes isolated specks."

[method."zsmooth.RemoveGrain".docs]
mode = "Mode 1 to 24 per plane (a short list reuses its last value for the remaining planes); see the RGVS documentation for each mode. Example: `mode = [11, 0]`"

[method."zsmooth.Repair"]
help = "Limits a filtered clip to the range of the original's neighbourhood, undoing damage such as thinned lines from strong filtering. Wire the original into Repair clip. The Sharpen and Blur node's Limit to a reference (repair) is the friendlier form. Example: `mode = 1`."

[method."zsmooth.Repair".docs]
mode = "Mode 1 to 24 per plane, as in RemoveGrain's RGVS documentation; a short list reuses its last value. Example: `mode = 1`"
repairclip = "The reference, usually the clip before filtering."

[method."zsmooth.VerticalCleaner"]
help = "Fast vertical median: removes thin horizontal lines and specks such as dropout lines. The Sharpen and Blur node's Vertical median (vertical_cleaner) is the friendlier form. Example: `mode = 1`."

[method."zsmooth.VerticalCleaner".docs]
mode = "Per plane: 0 = pass through, 1 = vertical median, 2 = relaxed median that keeps more detail. Example: `mode = 1`"

[method."zsmooth.Clense"]
help = "Temporal median of the previous, current and next frame: removes one-frame spots and flicker on still content; moving areas can ghost. The Sharpen and Blur node's Remove one-frame specks (clense) is the friendlier form. Example: no settings needed."

[method."zsmooth.Clense".docs]
previous = "Clip to take the previous frames from. Empty = the main clip."
next = "Clip to take the next frames from. Empty = the main clip."
planes = "Planes to process, as a list of plane numbers (0 = Y or R); the others are copied. Empty = all. Example: `planes = [0]`"

[method."zsmooth.ForwardClense"]
help = "Temporal median of the current frame and the two after it. Like Clense, for the first frame after a scene change. Example: no settings needed."

[method."zsmooth.ForwardClense".docs]
planes = "Planes to process, as a list of plane numbers (0 = Y or R); the others are copied. Empty = all. Example: `planes = [0]`"

[method."zsmooth.BackwardClense"]
help = "Temporal median of the current frame and the two before it. Like Clense, for the last frame before a scene change. Example: no settings needed."

[method."zsmooth.BackwardClense".docs]
planes = "Planes to process, as a list of plane numbers (0 = Y or R); the others are copied. Empty = all. Example: `planes = [0]`"

[method."zsmooth.TemporalMedian"]
help = "Median over several frames: removes noise and spots on still content; moving areas can ghost. The first and last Radius frames are left alone. Example: `radius = 2`."

[method."zsmooth.TemporalMedian".docs]
radius = "Frames on each side, 1 to 10. Larger = stronger, more ghosting. Example: `radius = 2`"
scenechange = "True = frames across a scene change are not used; needs scene-change properties on the clip (Clip Properties node). Example: `scenechange = True`"
planes = "Planes to process, as a list of plane numbers (0 = Y or R); the others are copied. Empty = all. Example: `planes = [0]`"

[method."zsmooth.TemporalSoften"]
help = "Averages up to Radius frames on each side, using only pixels that differ from the current frame by less than the threshold: a gentle temporal denoise. Example: `radius = 2`, `threshold = 4`."

[method."zsmooth.TemporalSoften".docs]
radius = "Frames on each side, 1 to 7. Example: `radius = 2`"
threshold = "Largest difference from the current frame that is still averaged, per plane; 0 copies the plane. Default 4, 8, 8 for YUV. Example: `threshold = [4, 8, 8]`"
scenechange = "0 = no scene detection; -1 = use the clip's scene-change properties; above 0 = detect with this percentage (needs the misc plugin). Example: `scenechange = 0`"
scalep = "True = thresholds are on the 8-bit scale (0-255) and scaled to the clip's bit depth. Example: `scalep = True`"
planes = "Planes to process, as a list of plane numbers (0 = Y or R); the others are copied. Empty = all. Example: `planes = [0]`"

[method."zsmooth.FluxSmoothT"]
help = "Temporal denoise: averages a pixel with the previous or next frame where both lie on the same side of it and within the threshold, so motion is kept. The Sharpen and Blur node's Smooth over time (flux_smooth) is the friendlier form. Example: `temporal_threshold = 7`."

[method."zsmooth.FluxSmoothT".docs]
temporal_threshold = "Largest frame-to-frame difference that is averaged, per plane; higher = stronger; a negative value copies that plane. Example: `temporal_threshold = 7`"
scalep = "True = thresholds are on the 8-bit scale (0-255) and scaled to the clip's bit depth. Example: `scalep = True`"
planes = "Planes to process, as a list of plane numbers (0 = Y or R); the others are copied. Empty = all. Example: `planes = [0]`"

[method."zsmooth.FluxSmoothST"]
help = "FluxSmoothT plus averaging with the eight neighbouring pixels within the spatial threshold. Stronger; the outer rows and columns are not processed. Example: `temporal_threshold = 7`, `spatial_threshold = 7`."

[method."zsmooth.FluxSmoothST".docs]
temporal_threshold = "Largest frame-to-frame difference that is averaged, per plane; higher = stronger; a negative value copies that plane. Example: `temporal_threshold = 7`"
spatial_threshold = "Largest difference to a neighbouring pixel that is averaged, per plane; a negative value skips that plane. Example: `spatial_threshold = 7`"
scalep = "True = thresholds are on the 8-bit scale (0-255) and scaled to the clip's bit depth. Example: `scalep = True`"
planes = "Planes to process, as a list of plane numbers (0 = Y or R); the others are copied. Empty = all. Example: `planes = [0]`"

[method."zsmooth.DegrainMedian"]
help = "Limited median over the 3x3 neighbourhood of the previous, current and next frame: removes grain and noise while each pixel changes at most by Limit. Example: `limit = 7`, `mode = 1`."

[method."zsmooth.DegrainMedian".docs]
limit = "Largest change per pixel, per plane; higher = smoother. Example: `limit = [7, 5, 5]`"
mode = "0 (strongest) to 5 (weakest), per plane. Example: `mode = 1`"
interlaced = "True = uses lines of the same field; only for interlaced clips. Example: `interlaced = True`"
norow = "True = leaves out the pixels left and right of the current one (frames before and after still count). Example: `norow = True`"
scalep = "True = thresholds are on the 8-bit scale (0-255) and scaled to the clip's bit depth. Example: `scalep = True`"

[method."zsmooth.TTempSmooth"]
help = "Motion-adaptive temporal smoother: weights neighbouring frames by distance and by how much pixels differ, so still areas smooth and motion is kept. Example: `maxr = 3`, `thresh = [4, 5, 5]`."

[method."zsmooth.TTempSmooth".docs]
maxr = "Largest temporal radius, 1 to 7. Higher = steadier picture, slower. Example: `maxr = 3`"
thresh = "Largest frame difference that is smoothed, 8-bit scale, per plane. Example: `thresh = [4, 5, 5]`"
mdiff = "Differences up to this (8-bit scale) count as none. Example: `mdiff = [2, 3, 3]`"
strength = "How fast the weight of farther frames drops, 1 to 8; higher = stronger smoothing. Example: `strength = 2`"
scthresh = "Scene-change threshold in percent of the largest brightness change; 0 = off, -1 = use the clip's properties. Example: `scthresh = 12`"
fp = "True = the weight not given to other frames goes back to the current pixel, fewer artefacts in motion. Example: `fp = False`"
pfclip = "A prefiltered clip used only to decide the weights; the original's pixels are averaged."
planes = "Planes to process, as a list of plane numbers (0 = Y or R); the others are copied. Empty = all. Example: `planes = [0]`"

[method."zsmooth.TemporalRepair"]
help = "Brings static detail back from Repair clip onto a filtered clip (experimental). Example: `mode = 0`."

[method."zsmooth.TemporalRepair".docs]
repairclip = "The clip whose static detail is restored, usually the source."
mode = "0 to 4: 0 and 4 look only over time, 1 to 3 also at neighbours; 2 restores least, 4 most. Example: `mode = 0`"
planes = "Planes to process, as a list of plane numbers (0 = Y or R); the others are copied. Empty = all. Example: `planes = [0]`"

[method."zsmooth.CCD"]
help = "Colour denoiser (Camcorder Color Denoiser): averages nearby pixels whose colour is within the threshold. For colour blotches in camcorder and VHS footage. The Denoise node's Chroma denoise (ccd) is the friendlier form. Example: `threshold = 4`."

[method."zsmooth.CCD".docs]
threshold = "Colour distance below which pixels are averaged; higher = stronger. YUV needs about half the RGB value. Example: `threshold = 4`"
temporal_radius = "Frames on each side also used, 0 to 10. Example: `temporal_radius = 1`"
points = "Which of the low, medium and high reference points are used. Example: `points = [True, True, False]`"
scale = "Size of the area searched; 1 = 25x25. Empty = from the clip height. Example: `scale = 1`"
ref = "Clip used only for the weights; same format and size as the main clip."

[method."zsmooth.Cnr4"]
help = "Temporal colour denoiser (after Cnr2): removes colour noise that changes from frame to frame, for analogue captures. 8 to 16-bit YUV only. Example: `mode = 'oxx'`."

[method."zsmooth.Cnr4".docs]
mode = "One letter per plane: `o` wide (stronger), `x` narrow (keeps more detail). Example: `mode = 'oxx'`"
radius = "Temporal radius, 1 to 10. Example: `radius = 2`"
sense = "Noise and motion sensitivity per plane, 0 to 255; higher catches more noise, risks ghosting. Example: `sense = [35, 47, 47]`"
str = "Strength per plane, 0 to 255. Example: `str = [192, 255, 255]`"
pow = "Power of the weight curve; below 1 = weaker, fewer artefacts. Example: `pow = [1.0, 1.0, 1.0]`"
tmode = "Temporal mode 0 to 4; higher = weaker and faster. Example: `tmode = 0`"
wmode = "Distance weighting 0 to 3; higher = weaker. Example: `wmode = 0`"
scenechange = "True (default) = respects the clip's scene-change properties; off causes artefacts across cuts. Example: `scenechange = False`"
ref = "Clip used only for the weights, such as a prefiltered copy."

[method."zsmooth.DCTFilter"]
help = "Scales the frequencies of each 8x8 block (DCT) and transforms back: lowering the high factors softens and removes fine noise. Example: `factors = [1, 1, 1, 1, 1, 0.5, 0.5, 0.5]`."

[method."zsmooth.DCTFilter".docs]
factors = "Eight factors 0 to 1, low to high frequency, for the rows and columns of each block; keep the first at 1. Example: `factors = [1, 1, 1, 1, 1, 0.5, 0.5, 0.5]`"
planes = "Planes to process, as a list of plane numbers (0 = Y or R); the others are copied. Empty = all. Example: `planes = [0]`"

[method."descale.Debilinear"]
help = "Undoes an upscale made with the bilinear kernel, back to the size the picture was made at. The Resize node's Descale: undo an upscale (descale) is the friendlier form. The kernel and size must match the original upscale. Example: `width = 1280`, `height = 720`."

[method."descale.Debilinear".docs]
width = "Width the picture was made at, before the upscale. Example: `width = 1280`"
height = "Height the picture was made at, before the upscale. Example: `height = 720`"
border_handling = "How the upscale padded the edges: 0 mirror, 1 black (zero), 2 repeat the last row. Example: `border_handling = 1`"
src_left = "Left edge of the source area, in pixels; fractions shift the picture. Example: `src_left = 0.5`"
src_top = "Top edge of the source area, in pixels; fractions shift the picture. Example: `src_top = 0.5`"
src_width = "Width of the source area. Empty = Width. Example: `src_width = 1279.5`"
src_height = "Height of the source area. Empty = Height. Example: `src_height = 719.5`"
ignore_mask = "Mask clip the size of the main clip; white areas (credits added after the upscale) are left out of the calculation."
opt = "CPU code path: 0 automatic, 1 plain, 2 AVX2. Example: `opt = 1`"

[method."descale.Debicubic"]
help = "Undoes an upscale made with the bicubic kernel, back to the size the picture was made at. The Resize node's Descale: undo an upscale (descale) is the friendlier form. The kernel and size must match the original upscale. Example: `width = 1280`, `height = 720`."

