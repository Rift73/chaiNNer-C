# ---------------------------------------------------------------- VapourSynth built-ins

[method."std.Binarize"]
help = "Turns a picture pure black and white at a threshold, in the clip's own values (8-bit: 0 to 255). Colour planes are treated as colour (centred on grey). For mask clips use Mask to black or white (BinarizeMask). Example: Threshold `128` on an 8-bit clip."

[method."std.Binarize".docs]
threshold = "Cut point in the clip's own values (8-bit 0 to 255, 16-bit 0 to 65535). Below = Value below, at or above = Value above. Empty = middle of the range. Example: `128`"
v0 = "Value for pixels below the threshold, in the clip's own values. Empty = the lowest value. Example: `0`"
v1 = "Value for pixels at or above the threshold, in the clip's own values. Empty = the highest value. Example: `255`"

[method."std.BinarizeMask"]
help = "Turns a mask pure black and white at a threshold, in the clip's own values (8-bit: 0 to 255). Unlike Black or white by a threshold (Binarize), every plane is treated like a mask, not like colour. Example: Threshold `64` on an 8-bit mask keeps faint parts white."

[method."std.BinarizeMask".docs]
threshold = "Cut point in the clip's own values (8-bit 0 to 255, 16-bit 0 to 65535). Below = Value below, at or above = Value above. Empty = middle of the range. Example: `64`"
v0 = "Value for pixels below the threshold, in the clip's own values. Empty = black. Example: `0`"
v1 = "Value for pixels at or above the threshold, in the clip's own values. Empty = white. Example: `255`"

[method."std.InvertMask"]
help = "Swaps black and white of a mask, so a filter acts on what was protected and the reverse. Unlike Negative (Colour), every plane is treated as a mask. Example: invert an edge mask to filter only flat areas."

[method."std.Maximum"]
help = "Grows white areas by one pixel: each pixel takes the brightest of its 3x3 neighbours. Chain several to grow more. Same idea as Grow bright areas (Morpho.maximum), in the clip's own values. Example: Threshold empty for full growth."

[method."std.Maximum".docs]
threshold = "Largest change allowed per pixel, in the clip's own values (8-bit 0 to 255). Empty = no limit. Example: `40`"
coordinates = "Which of the 8 neighbours count, 0 or 1 each: top-left, top, top-right, left, right, bottom-left, bottom, bottom-right. Example: `0, 1, 0, 1, 1, 0, 1, 0` (plus shape)"

[method."std.Minimum"]
help = "Shrinks white areas by one pixel: each pixel takes the darkest of its 3x3 neighbours. Removes single-pixel specks from a mask. Same idea as Shrink bright areas (Morpho.minimum), in the clip's own values. Example: Threshold empty for full shrinking."

[method."std.Minimum".docs]
threshold = "Largest change allowed per pixel, in the clip's own values (8-bit 0 to 255). Empty = no limit. Example: `40`"
coordinates = "Which of the 8 neighbours count, 0 or 1 each: top-left, top, top-right, left, right, bottom-left, bottom, bottom-right. Example: `0, 1, 0, 1, 1, 0, 1, 0` (plus shape)"

[method."std.Inflate"]
help = "Softens and slightly grows mask edges: a pixel rises to the average of its 8 neighbours when that is brighter. Use after a hard mask so a merge blends without a seam. Example: chain two for a softer edge."

[method."std.Inflate".docs]
threshold = "Largest change allowed per pixel, in the clip's own values (8-bit 0 to 255). Empty = no limit. Example: `40`"

[method."std.Deflate"]
help = "Softens and slightly shrinks mask edges: a pixel drops to the average of its 8 neighbours when that is darker. Opposite of Soften and grow edges (Inflate). Example: chain two for a softer, smaller mask."

[method."std.Deflate".docs]
threshold = "Largest change allowed per pixel, in the clip's own values (8-bit 0 to 255). Empty = no limit. Example: `40`"
