ranges = "Each mask image with the frames it covers. Example: `{'C:/masks/sign.png': (100, 200)}`"

[method."vsmasktools.CustomMaskFromFolder.apply_mask"]
help = "Places Overlay clip over the main clip wherever hand-drawn mask images from a folder are white. The file names give the frames: `100_200.png` covers frames 100 to 200. Use it for manual fixes such as restoring a sign from another source."

[method."vsmasktools.CustomMaskFromFolder.apply_mask".docs]
folder_path = "Folder holding the mask images, each named by its frames. Example: `C:\\masks\\ep01`"
processing = "Filter applied to each loaded image; default turns it pure black and white at mid-grey."
idx = "Source filter used to open the images; default BestSource."
_clipb = "The clip shown where the mask is white."
_ref = "Clip whose size and frame count the mask follows. Empty = the main clip."

[method."vsmasktools.CustomMaskFromRanges.apply_mask"]
help = "Places Overlay clip over the main clip wherever hand-drawn mask images are white, each image used for the frame ranges you list. Use it for manual fixes such as restoring a sign from another source."

[method."vsmasktools.CustomMaskFromRanges.apply_mask".docs]
ranges = "Each mask image with the frames it covers. Example: `{'C:/masks/sign.png': (100, 200)}`"
processing = "Filter applied to each loaded image; default turns it pure black and white at mid-grey."
idx = "Source filter used to open the images; default BestSource."
_clipb = "The clip shown where the mask is white."
_ref = "Clip whose size and frame count the mask follows. Empty = the main clip."

[method."vsmasktools.squaremask"]
help = "Makes a rectangle mask: white box on black (or the reverse with White outside the box). Wire it as the Mask of Merge through a mask (Planes) to filter or replace one area, e.g. a sign or a logo. Pitfall: Width and Height start at 0; type the size first, and the box must fit inside the frame."

[method."vsmasktools.squaremask".docs]
width = "Box width in pixels. Box left plus width must not exceed the frame width. Example: `400`"
height = "Box height in pixels. Example: `120`"
offset_x = "Distance of the box from the left edge, in pixels. Example: `760`"
offset_y = "Distance of the box from the top edge, in pixels. Example: `900`"
invert = "Makes everything except the box white."
force_gray = "Gives a one-plane grey mask. Off = the clip's own format with all its planes."

[method."vsmasktools.replace_squaremask"]
help = "Copies a rectangle from Patch clip onto the main clip, optionally only in some frames. Use it to restore a sign or logo from another source, or patch one area. Example: Box `400, 120, 760, 900` and Frame ranges `100-250`. Pitfall: the box must be filled first."

[method."vsmasktools.replace_squaremask".docs]
clipb = "The clip the rectangle is taken from; same size as the main clip."
mask_params = "Box as width, height, distance from left, distance from top, in pixels. Example: `400, 120, 760, 900`"
ranges = "Frames where the box is replaced. Empty = every frame. Example: `100-250`"
blur_sigma = "Softens the box's edge so the patch blends in. Empty = hard edge. Example: `2`"
invert = "Replaces everything except the box."
show_mask = "Outputs the box mask instead of the result, to check placement."

[method."vsmasktools.freeze_replace_squaremask"]
help = "Patches a rectangle over a frame range with a still: takes the Still frame from Patch clip, pastes its box onto the same frame of the main clip, and repeats it over First, last frame. Use it to freeze a cleaned sign. Pitfall: the box and the frame range must be filled first."

[method."vsmasktools.freeze_replace_squaremask".docs]
insert = "The clip the box is taken from; same size as the main clip."
mask_params = "Box as width, height, distance from left, distance from top, in pixels. Example: `400, 120, 760, 900`"
frame = "The frame of both clips used to build the still. Example: `120`"
frame_range = "First and last frame replaced by the still. Example: `100, 150`"

[method."vsmasktools.region_abs_mask"]
help = "Keeps a rectangle and blacks out the rest (or fills inside or outside with values you set). Apply it to a mask to limit that mask to one area, e.g. only the bottom third. Size and position in pixels. Pitfall: Width and Height start at 0; type them first."

[method."vsmasktools.region_abs_mask".docs]
width = "Width of the kept rectangle in pixels. Example: `1920`"
height = "Height of the kept rectangle in pixels. Example: `360`"
left = "Distance of the rectangle from the left edge, in pixels. Example: `0`"
top = "Distance of the rectangle from the top edge, in pixels. Example: `720`"
replace_in = "Value or expression for pixels inside. Empty = keep them. `mask_max` means full white. Example: `mask_max`"
replace_out = "Value or expression for pixels outside. Empty = black. Example: `0`"

[method."vsmasktools.region_rel_mask"]
help = "Keeps a rectangle given as margins from each side and blacks out the rest. Apply it to a mask to limit that mask to one area, e.g. Top margin `720` keeps only the bottom of a 1080p frame. Example: Left margin `100`, Right margin `100`."

[method."vsmasktools.region_rel_mask".docs]
left = "Margin cut from the left side, in pixels. Example: `100`"
right = "Margin cut from the right side, in pixels. Example: `100`"
top = "Margin cut from the top, in pixels. Example: `720`"
bottom = "Margin cut from the bottom, in pixels. Example: `0`"
replace_in = "Value or expression for pixels inside. Empty = keep them. `mask_max` means full white. Example: `mask_max`"
replace_out = "Value or expression for pixels outside. Empty = black. Example: `0`"

[method."vsmasktools.rekt_partial"]
help = "Runs a filter only inside a rectangle: the area is cropped, filtered and put back, which is much faster than filtering the whole frame for a small fix. Connect the filter to Filter, e.g. an anti-alias for one sign. Example: Left margin `1400`, Top margin `800`."

[method."vsmasktools.rekt_partial".docs]
func = "The filter to run inside the rectangle; it must keep the size of what it gets."
left = "Pixels cut from the left edge; the rectangle starts there. Example: `1400`"
right = "Pixels cut from the right edge. Example: `0`"
top = "Pixels cut from the top edge. Example: `800`"
bottom = "Pixels cut from the bottom edge. Example: `0`"

[method."vsmasktools.strength_zones_mask"]
help = "Makes a flat mask whose brightness changes by frame range, e.g. 0.3 in calm scenes and 1 in action. Wire it as the Mask of Merge through a mask (Planes) to blend strong and weak filtering per scene. The main clip sets the base values outside the zones."

[method."vsmasktools.strength_zones_mask".docs]
length = "Number of frames of the mask. Empty = length of the main clip. Example: `34000`"
zones = "Frame ranges with their strength, 0 to 1. Example: `[((0, 500), 0.3), ((501, 900), 1.0)]`"
format = "Format of the mask; default 32-bit grey."

# ---------------------------------------------------------------- shaping masks (morphology)

[method."vsmasktools.grow_mask"]
help = "Makes a soft band just outside the white shapes of a mask: it closes gaps, grows the shapes, then keeps only the ring around them, blurred. Use it to treat the halo zone around lines or text. Pitfall: the inside of the shapes ends up black; to thicken a mask, use Grow white areas (dilation)."

[method."vsmasktools.grow_mask".docs]
radius = "How far each grow step reaches: 1 = 3x3 pixels, 2 = 5x5. Larger = wider band further out. Example: `2`"
thr = "Limits how much one pass may change a pixel. Scale 0 to 1. Empty = no limit. Example: `0.2`"
iterations = "Repeats of the ring step. More = wider band. Example: `1`"
coords = "Which neighbours count, as 0 or 1 per neighbour (8 numbers for radius 1). Example: `0, 1, 0, 1, 1, 0, 1, 0`"
multiply = "Multiplies the result: below 1 dims the band. Example: `0.5`"

[method."vsmasktools.Morpho.dilation"]
help = "Grows the white areas of a mask: each pixel takes the brightest value around it. Use it to make a line or credit mask cover a bit more so a filter does not miss the edges. Example: Radius `2`. Opposite: Shrink white areas (erosion)."

[method."vsmasktools.Morpho.erosion"]
help = "Shrinks the white areas of a mask: each pixel takes the darkest value around it. Removes thin specks and pulls the mask back from edges. Example: Radius `1`. Opposite: Grow white areas (dilation)."

[method."vsmasktools.Morpho.maximum"]
help = "Grows the white areas by one pixel per pass (3x3 neighbourhood). Use Passes for more. Same as Grow white areas (dilation) with radius 1, plus a choice of which neighbours count. Example: Passes `2`."

[method."vsmasktools.Morpho.minimum"]
help = "Shrinks the white areas by one pixel per pass (3x3 neighbourhood). Use Passes for more. Same as Shrink white areas (erosion) with radius 1, plus a choice of which neighbours count. Example: Passes `2`."

[method."vsmasktools.Morpho.expand"]
help = "Grows the white areas by a set number of pixels, with separate horizontal and vertical amounts and a chosen corner shape. The usual way to widen a credit or sign mask. Starts at 2 pixels. Example: Left and right pixels `4`, Corner shape Ellipse."

[method."vsmasktools.Morpho.inpand"]
help = "Shrinks the white areas by a set number of pixels, with separate horizontal and vertical amounts and a chosen corner shape. Starts at 2 pixels. Example: Left and right pixels `1`. Opposite: Grow by pixels, shaped (expand)."

[method."vsmasktools.Morpho.inflate"]
help = "Softens and slightly grows the edges of a mask: a pixel rises to the average of its neighbours when that is brighter. Use it after a hard black-and-white mask so the merge blends instead of showing a seam. Example: Passes `2`. Opposite: Soften and shrink edges (Morpho.deflate)."

[method."vsmasktools.Morpho.deflate"]
help = "Softens and slightly shrinks the edges of a mask: a pixel drops to the average of its neighbours when that is darker. Example: Passes `2`. Opposite: Soften and grow edges (Morpho.inflate)."

[method."vsmasktools.Morpho.closing"]
help = "Fills small black holes and gaps inside white areas (grow, then shrink back). Use it to make a patchy credit or detail mask solid without making it bigger. Example: Radius `2`. Opposite: Remove small specks (opening)."

[method."vsmasktools.Morpho.opening"]
help = "Removes small white specks while keeping larger white areas their size (shrink, then grow back). Use it to clean grain dots from a mask. Example: Radius `1`. Opposite: Fill small holes (closing)."

[method."vsmasktools.Morpho.gradient"]
help = "Outlines the shapes: grown minus shrunk, so only the borders of white areas (or edges of a picture) stay. Use it to get a thin edge band from a solid mask. Example: Radius `1`."

[method."vsmasktools.Morpho.top_hat"]
help = "Keeps only small bright details narrower than the radius (picture minus its opening), e.g. thin bright lines or specks. Example: Radius `2`."

[method."vsmasktools.Morpho.bottom_hat"]
help = "Keeps only small dark details narrower than the radius (closing minus picture), shown white, e.g. thin dark line art. Example: Radius `2`."

[method."vsmasktools.Morpho.outer_hat"]
help = "Gives the ring just outside the white shapes (grown minus original). Use it to target the zone around lines or text, such as halos. Example: Radius `2`."

[method."vsmasktools.Morpho.inner_hat"]
help = "Gives the ring just inside the edges of white shapes (original minus shrunk). Example: Radius `1`."

[method."vsmasktools.Morpho.binarize"]
help = "Turns a picture pure black and white at a threshold: below Threshold becomes Value below, the rest Value above. For a picture with colour planes. For a mask clip use Mask to black or white (Morpho.binarize_mask). Example: Threshold `0.5`."

[method."vsmasktools.Morpho.binarize".docs]
midthr = "The cut point, on a 0 to 1 scale. Empty = middle of the range. One value per plane is allowed. Example: `0.5`"
lowval = "Value given to pixels below the cut, 0 to 1 scale. Empty = black. Example: `0`"
highval = "Value given to pixels at or above the cut, 0 to 1 scale. Empty = white. Example: `1`"

[method."vsmasktools.Morpho.binarize_mask"]
help = "Turns a soft grey mask pure black and white: below Threshold becomes black, the rest white. Use it after an edge or detail mask to get a solid, clean mask. Example: Threshold `0.1` keeps faint lines too."

[method."vsmasktools.Morpho.binarize_mask".docs]
midthr = "The cut point, on a 0 to 1 scale. Lower = more becomes white. Empty = 0.5. Example: `0.1`"
lowval = "Value given to pixels below the cut, 0 to 1 scale. Empty = black. Example: `0`"
highval = "Value given to pixels at or above the cut, 0 to 1 scale. Empty = white. Example: `1`"

# Morphology settings shared by every Morpho method that has them.

[method."vsmasktools.Morpho.dilation".docs]
radius = "How far it reaches: 1 = 3x3 pixels, 2 = 5x5. Larger = stronger. Example: `2`"
thr = "Limits how much a pixel may brighten per pass. Scale 0 to 1. Empty = no limit. Example: `0.2`"
iterations = "Number of passes. More = stronger. Example: `2`"
coords = "Which neighbours count, 0 or 1 each, row by row without the centre: 8 numbers for radius 1, 24 for 2. Overrides Radius. Example: `0, 1, 0, 1, 1, 0, 1, 0`"
multiply = "Multiplies the result: below 1 dims, above 1 brightens. Example: `0.5`"

[method."vsmasktools.Morpho.erosion".docs]
radius = "How far it reaches: 1 = 3x3 pixels, 2 = 5x5. Larger = stronger. Example: `2`"
thr = "Limits how much a pixel may darken per pass. Scale 0 to 1. Empty = no limit. Example: `0.2`"
iterations = "Number of passes. More = stronger. Example: `2`"
coords = "Which neighbours count, 0 or 1 each, row by row without the centre: 8 numbers for radius 1, 24 for 2. Overrides Radius. Example: `0, 1, 0, 1, 1, 0, 1, 0`"
multiply = "Multiplies the result: below 1 dims, above 1 brightens. Example: `0.5`"

[method."vsmasktools.Morpho.maximum".docs]
thr = "Limits how much a pixel may brighten per pass. Scale 0 to 1. Empty = no limit. Example: `0.2`"
iterations = "Number of passes, one pixel of growth each. Example: `3`"
coords = "Which of the 8 neighbours count, 0 or 1 each: top-left, top, top-right, left, right, bottom-left, bottom, bottom-right. Example: `0, 1, 0, 1, 1, 0, 1, 0` (plus shape)"
multiply = "Multiplies the result: below 1 dims, above 1 brightens. Example: `0.5`"

[method."vsmasktools.Morpho.minimum".docs]
thr = "Limits how much a pixel may darken per pass. Scale 0 to 1. Empty = no limit. Example: `0.2`"
iterations = "Number of passes, one pixel of shrinking each. Example: `3`"
coords = "Which of the 8 neighbours count, 0 or 1 each: top-left, top, top-right, left, right, bottom-left, bottom, bottom-right. Example: `0, 1, 0, 1, 1, 0, 1, 0` (plus shape)"
multiply = "Multiplies the result: below 1 dims, above 1 brightens. Example: `0.5`"

[method."vsmasktools.Morpho.expand".docs]
sw = "Pixels of growth to the left and right. Example: `4`"
sh = "Pixels of growth up and down. Empty = same as Left and right pixels. Example: `2`"
mode = "Corner shape of the growth: Rectangle keeps square corners, Ellipse rounds them, Losange gives a diamond."
thr = "Limits how much a pixel may brighten per step. Scale 0 to 1. Empty = no limit. Example: `0.2`"

[method."vsmasktools.Morpho.inpand".docs]
sw = "Pixels of shrinking from the left and right. Example: `2`"
sh = "Pixels of shrinking from top and bottom. Empty = same as Left and right pixels. Example: `2`"
mode = "Corner shape: Rectangle keeps square corners, Ellipse rounds them, Losange gives a diamond."
thr = "Limits how much a pixel may darken per step. Scale 0 to 1. Empty = no limit. Example: `0.2`"

[method."vsmasktools.Morpho.inflate".docs]
radius = "Neighbourhood averaged: 1 = 3x3 pixels, 2 = 5x5. Larger = softer. Example: `1`"
thr = "Limits how much a pixel may brighten per pass. Scale 0 to 1. Empty = no limit. Example: `0.1`"
iterations = "Number of passes. More = softer, wider edge. Example: `2`"
coords = "Which neighbours count, 0 or 1 each, row by row without the centre: 8 numbers for radius 1. Example: `0, 1, 0, 1, 1, 0, 1, 0`"
multiply = "Multiplies the result: below 1 dims, above 1 brightens. Example: `0.5`"

[method."vsmasktools.Morpho.deflate".docs]
radius = "Neighbourhood averaged: 1 = 3x3 pixels, 2 = 5x5. Larger = softer. Example: `1`"
thr = "Limits how much a pixel may darken per pass. Scale 0 to 1. Empty = no limit. Example: `0.1`"
iterations = "Number of passes. More = softer, narrower. Example: `2`"
coords = "Which neighbours count, 0 or 1 each, row by row without the centre: 8 numbers for radius 1. Example: `0, 1, 0, 1, 1, 0, 1, 0`"
multiply = "Multiplies the result: below 1 dims, above 1 brightens. Example: `0.5`"

[method."vsmasktools.Morpho.closing".docs]
radius = "Size of the holes that get filled: 1 = 3x3 pixels, 2 = 5x5. Example: `2`"
thr = "Limits how much a pixel may change per pass. Scale 0 to 1. Empty = no limit. Example: `0.2`"
iterations = "Passes of the grow and of the shrink. More = fills bigger gaps. Example: `1`"
coords = "Which neighbours count, 0 or 1 each, row by row without the centre: 8 numbers for radius 1. Overrides Radius. Example: `0, 1, 0, 1, 1, 0, 1, 0`"
