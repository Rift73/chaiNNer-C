# Tool settings only: the repository is not a Python distribution, so there is no [project]
# table (upstream's held only requires-python, for ruff's target, which is now explicit).
# The backend runs only on the bundled CPython 3.14 (the native pyd links python314).

[tool.ruff]
# backend/src keeps upstream's Python 3.8 dialect, so it stays diffable against
# upstream's sources; native/pyproject.toml targets py314 for chaiNNer-C's own code.
target-version = "py38"
# Same as Black.
line-length = 88
indent-width = 4

src = ["backend/src"]

# ignore vendored code
extend-exclude = ["**/pytorch/architecture/**"]

unsafe-fixes = true

[tool.ruff.lint]
# Add the `line-too-long` rule to the enforced rule set.
select = [
    "UP", # pyupgrade
    "E",  # pycodestyle
    "W",  # pycodestyle
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    # "ANN", # flake8-annotations
    "ANN001",
    "ANN002",
    # "ASYNC", # flake8-async
    "PL",  # pylint
    "RUF", # ruff
    "B",   # flake8-bugbear
    # "A",   # flake8-builtins
    # "COM", # flake8-commas
    "C4",  # flake8-comprehensions
    "FA",  # flake8-future-annotations
    "ISC", # flake8-implicit-str-concat
    "ICN", # flake8-import-conventions
    "G",   # flake8-logging-format
    # "INP", # flake8-implicit-namespaces
    "PIE", # flake8-pie
    # "PYI", # flake8-pyi
    "Q", # flake8-quotes
    # "RET", # flake8-return
    "SLF", # flake8-self
    # "SIM", # flake8-simplify
    # "TCH", # flake8-tidy-imports
    "NPY", # NumPy-specific rules
]
ignore = [
    "E501",    # Line too long
    "PLR2004", # Magic value
    "PLR0911", # Too many return statements
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments
    "PLR0917", # Too many positional arguments: node functions are called positionally by the executor (process.py run_node); sibling of PLR0913
    "PLR0915", # Too many statements,
    "E741",    # Ambiguous variable name,
    "E712",    # true-false-comparison, has false positives because of numpy's operator overloading
    "F821",    # Undefined name -- this one is weird, it seems like it has false positives on closures and other context changes
    "F403",    # 'from module import *' used; unable to detect undefined names
    "PLW0603", # Using the global statement
    "N999",    # Invalid module name (which triggers for chaiNNer)
    "N818",    # Exception name should end in Error
    "ISC001",  # Implicit string concatenation, conflicts with formatter
    "PLC0415", # Import outside top level: deliberate lazy imports (torch/onnx/scipy only where used; native_* <-> image_utils cycle; native tests sequence DLL loads)
    "PLC0414", # Useless import alias: x as x is the PEP 484 explicit export that marks names the native mirrors read through globals() (F401 and pyright honour it)
]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"


[tool.ruff.lint.pep8-naming]
ignore-names = ["*Input", "*Output", "*Dropdown"]

[tool.ruff.lint.per-file-ignores]
# Type stubs must use the names of the external APIs they describe
# (cudaMalloc, cudaError_t, cudaSuccess, ...), which pep8-naming rejects.
"stubs/cuda/**/*.pyi" = ["N801", "N802", "N815", "N816"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
pythonpath = ["backend/src", "native/tools"]
